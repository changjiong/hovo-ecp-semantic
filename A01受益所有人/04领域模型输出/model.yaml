    writes:
    - M.DifferenceReport.state
    depends_on: []
    on_missing: BLOCK
    description: 按实际业务反馈及条件计算允许的状态变化；不写外部系统。
    basis_ids:
    - K.R.24
    - K.R.24.STATUS
  - id: M.Step.G9.Case
    name: 案例申请和审批
    kind: UPDATE
    uses:
