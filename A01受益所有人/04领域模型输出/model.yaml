- question_id: K.Q.24
  question: 差异报告、案例、通知和文件如何配合完成办理？
  answer: 报告、状态、案例、参数和文件五类对象与状态机。 先完成业务核实与报告义务判断，再选择与事实匹配的报告类型；系统中有一种报告入口不等于制度要求每种情形都强制报告。报告提交、待审核、补充、办结、撤销或终止各自保留对应回执。报备型处理成功、审批通过、客户实际更正后复核一致是不同结果，不能互换。案例申请有自己的资格和审批过程；文件ID只是附件索引。参数、业务通知和系统状态决定请求能否办理，错误反馈要关联原请求并处理，尚未收到结果的业务保留待处理。
