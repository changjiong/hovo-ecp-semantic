  - 核对主体登记类别、所引用条文和法定用途，免识别或简化不得由相似名称扩张。
  - 具体查询须有适用机构权限及经办授权，声明和返回方式须符合对应条件，后续使用限于授权用途并保密。
  - 处罚适用所需上位法不齐时只形成责任风险和补充清单，不宣称已完整确定处罚。
  record_fields:
  - M.Identification.category_verified
  - M.Access.lawful_purpose
  - M.Access.institution_authorized
  - M.Access.operator_authorized
  review_requirements: 机构清单、处罚材料、保存期限的上游未决口径继续承接；有效授权人员复核后留存用途和依据。
- id: M.Judgment.RecordContents
  name: 场景所需信息集合核对
  description: 按备案与金融机构留存的各自信息集合逐字段检查，身份、联系、权利类型、比例或控制方式、形成终止信息按适用条件记录。；关系类型与比例口径分开，字段暂不可确认时写明缺证，不用同一空值代表不适用、未知和未采集。
  inputs:
  - name: purpose
    label: 识别用途
    binding: M.Identification.purpose
    type: Enum
    values:
    - 金融机构客户尽调
    - 受益所有人备案
    - 差异核实
    - 持续复核
    cardinality:
      min: 0
      max: 1
  - name: evidence
    label: 采用证据
    binding: M.Identification.evidence
    type: Ref
    target: M.Evidence
    cardinality:
      min: 0
      max: null
  outputs:
  - name: records
    label: 适用业务场景所需身份及权利信息齐备
    binding: M.Identification.records_complete
    type: Boolean
    cardinality:
      min: 0
      max: 1
  responsible_role: M.Appointment
  required_evidence:
  - 主体和个人身份材料
  - 权利与控制证据
  - 相关办理及信息留存要求
  question_ids:
  - K.Q.10
  issue_ids: []
  on_missing: BLOCK
  basis_ids:
  - K.R.10
  nature: BUSINESS_DISCRETION
  criteria:
  - 按备案与金融机构留存的各自信息集合逐字段检查，身份、联系、权利类型、比例或控制方式、形成终止信息按适用条件记录。
  - 关系类型与比例口径分开，字段暂不可确认时写明缺证，不用同一空值代表不适用、未知和未采集。
  record_fields:
  - M.Identification.records_complete
  review_requirements: 确认字段适用性和完整性，不把当前BOMIS字段当作唯一法律信息集合；接口字段匹配未决项继续保留。
- id: M.Judgment.FilingRoute
  name: 地方办理方式和入口核对
  description: 根据主体实际办理地区选用该地权威办理指引，不把北京和深圳的入口要求混用。；核实真实免报条件或自行填报路径，系统推荐信息须核实后采用；录入全部应报人员及其全部适用关系。；检查后提交并保存结果回执，后续变化仍按法定期限更新。
  inputs:
  - name: subject
    label: 备案主体
    binding: M.Filing.subject
    type: Ref
    target: M.Subject
    cardinality:
      min: 1
      max: 1
  - name: method
    label: 办理方式
    binding: M.Filing.method
    type: Enum
    values:
    - 承诺免报
    - 自行填报
    - 系统推荐后核实填报
    cardinality:
      min: 0
      max: 1
  - name: evidence
    label: 备案材料和回执依据
    binding: M.Filing.evidence
    type: Ref
    target: M.Evidence
    cardinality:
      min: 0
      max: null
  outputs:
  - name: route
    label: 备案办理入口已按实际所在地选定
    binding: M.Identification.local_routing
    type: Boolean
    cardinality:
      min: 0
      max: 1
  responsible_role: M.Appointment
  required_evidence:
  - 所在地登记指引
  - 主体及自然人材料
  - 申报页面与办理回执对应材料
  question_ids:
  - K.Q.22
  issue_ids: []
  on_missing: BLOCK
  basis_ids:
  - K.R.22
  nature: BUSINESS_DISCRETION
  criteria:
  - 根据主体实际办理地区选用该地权威办理指引，不把北京和深圳的入口要求混用。
  - 核实真实免报条件或自行填报路径，系统推荐信息须核实后采用；录入全部应报人员及其全部适用关系。
  - 检查后提交并保存结果回执，后续变化仍按法定期限更新。
  record_fields:
  - M.Identification.local_routing
  review_requirements: 业务经办与复核人员确认适用地区和方式；材料未覆盖其他地区时不得假定入口相同。
- id: M.Judgment.Liability
  name: 责任类型及从轻减轻因素核查
  description: 分别分析备案、识别、风险管理、差异和内控保密义务涉及的责任类型，区分一般与严重情形。；先核适用制度与生效时间，再核行为事实及从轻减轻因素；不把差异本身当然等同违法。；当前基线缺少完整上位法或登记法规时形成补充清单，不输出完整处罚判断。
  inputs:
  - name: duty
    label: 相关义务类型
    binding: M.ComplianceReview.duty_kind
    type: Enum
    values:
    - 备案
    - 金融机构识别
    - 风险管理
    - 差异处理
    - 内控与保密
    cardinality:
      min: 0
      max: 1
  - name: evidence
    label: 适用制度与事实依据
    binding: M.ComplianceReview.evidence
    type: Ref
    target: M.Evidence
    cardinality:
      min: 0
      max: null
  - name: date
    label: 适用业务日期
    binding: M.ComplianceReview.as_of
    type: Date
    cardinality:
      min: 0
      max: 1
  outputs:
  - name: violation
    label: 发现的责任风险类型
    binding: M.ComplianceReview.violation_type
    type: Text
    cardinality:
      min: 0
      max: 1
  - name: mitigation
    label: 从轻或减轻因素
    binding: M.ComplianceReview.mitigation
    type: Text
    cardinality:
      min: 0
      max: 1
  - name: rectification
    label: 整改要求
    binding: M.ComplianceReview.rectification
    type: Text
    cardinality:
      min: 0
      max: 1
  - name: complete
    label: 处罚适用所需法律材料齐备
    binding: M.ComplianceReview.legal_sources_complete
    type: Boolean
    cardinality:
      min: 0
      max: 1
  responsible_role: M.Appointment
  required_evidence:
  - 相关行为与整改材料
  - 适用制度版本
  - 处罚引用的法律法规全文
  question_ids:
  - K.Q.21
  issue_ids: []
  on_missing: BLOCK
  basis_ids:
  - K.R.21
  - K.R.EXT.GOV.21.LIABILITY
  nature: BUSINESS_DISCRETION
  criteria:
  - 分别分析备案、识别、风险管理、差异和内控保密义务涉及的责任类型，区分一般与严重情形。
  - 先核适用制度与生效时间，再核行为事实及从轻减轻因素；不把差异本身当然等同违法。
  - 当前基线缺少完整上位法或登记法规时形成补充清单，不输出完整处罚判断。
  record_fields:
  - M.ComplianceReview.violation_type
  - M.ComplianceReview.mitigation
  - M.ComplianceReview.rectification
  - M.ComplianceReview.legal_sources_complete
  review_requirements: 交由法务及合规责任人复核；是否已齐备材料必须有来源佐证，上游缺口未解决不得宣布责任确定。
state_machines:
- id: M.Machine.Difference
  name: 差异实质处置
  type_id: M.Difference
  state_field: state
  initial: 待核实
  transitions:
  - id: M.Transition.DifferenceInvestigate
    name: 开始查因
    event: INVESTIGATE
    from:
    - 待核实
    to: 处理中
    guard:
      op: is_known
      args:
      - field:
          of:
            input: self
          name: cause
    on_unknown: BLOCK
    basis_ids:
    - K.R.19
    - K.R.19.CLOSE
  - id: M.Transition.DifferenceCorrected
    name: 实际更正后等待复核
    event: CORRECTED
    from:
    - 处理中
    to: 待复核
    guard:
      field:
        of:
          input: self
        name: customer_corrected
    on_unknown: BLOCK
    basis_ids:
    - K.R.19
    - K.R.19.CLOSE
  - id: M.Transition.DifferenceResolve
    name: 复核一致后解决
    event: RECHECK
    from:
    - 待复核
    - 处理中
    to: 已解决
    guard:
      op: and
      args:
      - field:
          of:
            input: self
          name: customer_corrected
      - field:
          of:
            input: self
          name: recheck_consistent
    on_unknown: BLOCK
    basis_ids:
    - K.R.19
    - K.R.19.CLOSE
  basis_ids:
  - K.R.19
  - K.R.19.CLOSE
- id: M.Machine.Query
  name: 查询异步反馈
  type_id: M.Query
  state_field: state
  initial: 待发送
  transitions:
  - id: M.Transition.QuerySend
    name: 按准入发起请求
    event: SEND
    from:
    - 待发送
    to: 待业务反馈
    guard:
      field:
        of:
          input: self
        name: query_allowed
    on_unknown: BLOCK
    basis_ids:
    - K.R.23
    - K.R.23.VERIFY
    - K.R.23.CURRENT
  - id: M.Transition.QueryReceive
    name: 逐主体反馈齐备
    event: FEEDBACK
    from:
    - 待业务反馈
    - 待补全
    to: 收到结果
    guard:
      field:
        of:
          input: self
        name: result_usable
    on_unknown: BLOCK
    basis_ids:
    - K.R.23
    - K.R.23.VERIFY
    - K.R.23.CURRENT
  - id: M.Transition.QueryIncomplete
    name: 已反馈但逐主体结果不完整
    event: PARTIAL
    from:
    - 待业务反馈
    to: 待补全
    guard:
      op: and
      args:
      - field:
          of:
            input: self
          name: feedback_received
      - op: not
        args:
        - field:
            of:
              input: self
            name: per_subject_complete
    on_unknown: BLOCK
    basis_ids:
    - K.R.23
    - K.R.23.VERIFY
    - K.R.23.CURRENT
  - id: M.Transition.QueryFail
    name: 收到明确业务失败
    event: FAILED
    from:
    - 待业务反馈
    to: 失败
    guard:
      op: and
      args:
      - field:
          of:
            input: self
          name: feedback_received
      - field:
          of:
            input: self
          name: feedback_matched
      - op: not
        args:
        - field:
            of:
              input: self
            name: business_feedback_success
    on_unknown: BLOCK
    basis_ids:
    - K.R.23
    - K.R.23.VERIFY
    - K.R.23.CURRENT
  basis_ids:
  - K.R.23
  - K.R.23.VERIFY
  - K.R.23.CURRENT
- id: M.Machine.Report
  name: 差异报告办理
  type_id: M.DifferenceReport
  state_field: state
  initial: 准备中
  transitions:
  - id: M.Transition.ReportSubmit
    name: 提交报告后等待反馈
    event: SUBMIT
    from:
    - 准备中
    - 待补充
    to: 已提交待反馈
    guard:
      field:
        of:
          input: self
        name: submit_allowed
    on_unknown: BLOCK
    basis_ids:
    - K.R.24
    - K.R.24.STATUS
  - id: M.Transition.ReportSupplement
    name: 收到待补充反馈
    event: SUPPLEMENT
    from:
    - 已提交待反馈
    - 办理中
    to: 待补充
    guard:
      op: eq
      args:
      - field:
          of:
            input: self
          name: feedback_status
      - literal:
          type: Text
          value: 待补充
    on_unknown: BLOCK
    basis_ids:
    - K.R.24
    - K.R.24.STATUS
  - id: M.Transition.ReportProcessing
    name: 收到办理中反馈
    event: PROCESSING
    from:
    - 已提交待反馈
    to: 办理中
    guard:
      op: eq
      args:
      - field:
          of:
            input: self
          name: feedback_status
      - literal:
          type: Text
          value: 办理中
    on_unknown: BLOCK
    basis_ids:
    - K.R.24
    - K.R.24.STATUS
  - id: M.Transition.ReportDone
    name: 收到办结反馈
    event: DONE
    from:
    - 已提交待反馈
    - 办理中
    to: 已办结
    guard:
      op: eq
      args:
      - field:
          of:
            input: self
          name: feedback_status
      - literal:
          type: Text
          value: 已办结
    on_unknown: BLOCK
    basis_ids:
    - K.R.24
    - K.R.24.STATUS
  - id: M.Transition.ReportWithdrawRequest
    name: 当前状态允许申请撤销
    event: WITHDRAW
    from:
    - 已提交待反馈
    - 待补充
    - 办理中
    to: 撤销待反馈
    guard:
      field:
        of:
          input: self
        name: withdraw_allowed
    on_unknown: BLOCK
    basis_ids:
    - K.R.24
    - K.R.24.STATUS
  - id: M.Transition.ReportWithdrawFeedback
    name: 收到真实撤销反馈
    event: WITHDRAW_FEEDBACK
    from:
    - 撤销待反馈
    to: 已撤销
    guard:
      field:
        of:
          input: self
        name: withdraw_feedback
    on_unknown: BLOCK
    basis_ids:
    - K.R.24
    - K.R.24.STATUS
  - id: M.Transition.ReportTerminate
    name: 收到终止业务反馈
    event: TERMINATE
    from:
    - 已提交待反馈
    - 待补充
    - 办理中
    to: 已终止
    guard:
      field:
        of:
          input: self
        name: termination_feedback
    on_unknown: BLOCK
    basis_ids:
    - K.R.24
    - K.R.24.STATUS
  basis_ids:
  - K.R.24
  - K.R.24.STATUS
- id: M.Machine.Case
  name: 案例申请和审批
  type_id: M.BomisCase
  state_field: state
  initial: 准备中
  transitions:
  - id: M.Transition.CaseApply
    name: 符合条件后提出申请
    event: APPLY
    from:
    - 准备中
    to: 已申请待反馈
    guard:
      field:
        of:
          input: self
        name: conditions_met
    on_unknown: BLOCK
    basis_ids:
    - K.R.24.CASE
  - id: M.Transition.CaseNumber
    name: 首反馈取得编号
    event: NUMBER
    from:
    - 已申请待反馈
    to: 已取得编号
    guard:
      op: and
      args:
      - field:
          of:
            input: self
          name: initial_feedback
      - field:
          of:
            input: self
          name: number_received
    on_unknown: BLOCK
    basis_ids:
    - K.R.24.CASE
  - id: M.Transition.CaseWaitApproval
    name: 按编号查询审批
    event: QUERY
    from:
    - 已取得编号
    to: 待审批
    guard:
      field:
        of:
          input: self
        name: may_query_approval
    on_unknown: BLOCK
    basis_ids:
    - K.R.24.CASE
  - id: M.Transition.CaseApproval
    name: 收到实际审批结果
    event: APPROVAL
    from:
    - 待审批
    to: 已收到审批结果
    guard:
      field:
        of:
          input: self
        name: approval_feedback
    on_unknown: BLOCK
    basis_ids:
    - K.R.24.CASE
  basis_ids:
  - K.R.24.CASE
- id: M.Machine.File
  name: 附件上传与关联
  type_id: M.FileTransfer
  state_field: state
  initial: 待上传
  transitions:
  - id: M.Transition.FileUpload
    name: 发送上传请求
    event: UPLOAD
    from:
    - 待上传
    - 上传失败
    to: 待业务应答
    guard:
      op: is_known
      args:
      - field:
          of:
            input: self
          name: file_digest
    on_unknown: BLOCK
    basis_ids:
    - K.R.24.FILE
  - id: M.Transition.FileUsable
    name: 上传应答确认可用
    event: FEEDBACK
    from:
    - 待业务应答
    to: 可关联
    guard:
      field:
        of:
          input: self
        name: usable
    on_unknown: BLOCK
    basis_ids:
    - K.R.24.FILE
  - id: M.Transition.FileFailed
    name: 收到同步或异步错误
    event: ERROR
    from:
    - 待业务应答
    to: 上传失败
    guard:
      op: or
      args:
      - op: is_known
        args:
        - field:
            of:
              input: self
            name: synchronous_error
      - op: is_known
        args:
        - field:
            of:
              input: self
            name: asynchronous_error
    on_unknown: BLOCK
    basis_ids:
    - K.R.24.FILE
  basis_ids:
  - K.R.24.FILE
processes:
- id: M.Process.G1
  name: 适用性、备案与身份识别
  question_ids:
  - K.Q.01
  - K.Q.02
  - K.Q.03
  - K.Q.04
  - K.Q.05
  - K.Q.06
  - K.Q.08
  - K.Q.10
  trigger: 开始处理适用性、备案与身份识别时，固定主体、用途、业务时点和本机构责任。
  steps:
  - id: M.Step.G1.FilingScope
    name: 判断备案适用范围
    kind: DETERMINE
    uses:
    - M.Rule.FilingScope
    reads:
    - M.Identification.as_of
    - M.Subject.kind
    writes:
    - M.Identification.filing_applicable
    depends_on: []
    on_missing: BLOCK
    description: 备案范围按主体类型单独判断；其他非自然人客户暂不备案不等于免除金融机构识别。
    basis_ids:
    - K.R.01
  - id: M.Step.G1.CddScope
    name: 判断金融机构识别适用范围
    kind: DETERMINE
    uses:
    - M.Rule.CddScope
    reads:
    - M.Identification.as_of
    - M.Identification.business_relation
    - M.Identification.institution_in_scope
    - M.Subject.kind
    writes:
    - M.Identification.cdd_applicable
    depends_on: []
    on_missing: BLOCK
    description: 核实机构适用性和非自然人客户业务关系；义务机构完整清单仍承接缺少第11号令的上游缺口。
    basis_ids:
    - K.R.01
  - id: M.Step.G1.FilingExemption
    name: 承诺免报条件
    kind: DETERMINE
    uses:
    - M.Rule.FilingExemption
    reads:
    - M.Filing.all_natural_holders
    - M.Filing.as_of
    - M.Filing.capital_cny
    - M.Filing.no_external_beneficiary
    - M.Filing.no_other_control_benefit
    - M.Filing.promise_truthful
    - M.Subject.kind
    writes:
    - M.Filing.promise_exempt
    depends_on: []
    on_missing: BLOCK
    description: 四项事实同时满足并真实承诺才可免报；外国公司及其分支不适用，外币折算不明时不生成人民币金额。
    basis_ids:
    - K.R.02
    - K.R.EXT.GOV.15.FILING_EXEMPT
  - id: M.Step.G1.EquityPaths
    name: 股权或合伙权益路径逐条乘算
    kind: DETERMINE
    uses:
    - M.Rule.EquityPaths
    reads:
    - M.Identification.rights
    - M.Identification.subject
    - M.PersonAssessment.as_of
    - M.PersonAssessment.person
    writes:
    - M.PersonAssessment.path_products
    depends_on: []
    on_missing: BLOCK
    description: 按权利类型和有效时点筛选已核实直接关系，枚举自然人到主体的全部无环路径并逐层相乘；未知终止、未知边和循环均不输出确定比例。
    basis_ids:
    - K.R.03
  - id: M.Step.G1.EquityTotal
    name: 股权或合伙权益多路径合计
    kind: DETERMINE
    uses:
    - M.Rule.EquityTotal
    reads:
    - M.Identification.acyclic
    - M.Identification.structure_complete
    - M.PersonAssessment.path_products
    writes:
    - M.PersonAssessment.equity_ratio
    depends_on:
    - M.Step.G1.EquityPaths
    - M.Step.G1.IdentityRights
    on_missing: BLOCK
    description: 只有结构完整且无环已核实才合计同一自然人的全部路径；不得把缺失路径算零，也不把收益权和表决权相加。
    basis_ids:
    - K.R.03
  - id: M.Step.G1.IncomePaths
    name: 收益权路径逐条乘算
    kind: DETERMINE
    uses:
    - M.Rule.IncomePaths
    reads:
    - M.Identification.rights
    - M.Identification.subject
    - M.PersonAssessment.as_of
    - M.PersonAssessment.person
    writes:
    - M.PersonAssessment.income_path_products
    depends_on: []
    on_missing: BLOCK
    description: 按权利类型和有效时点筛选已核实直接关系，枚举自然人到主体的全部无环路径并逐层相乘；未知终止、未知边和循环均不输出确定比例。
    basis_ids:
    - K.R.04
  - id: M.Step.G1.IncomeTotal
    name: 收益权多路径合计
    kind: DETERMINE
    uses:
    - M.Rule.IncomeTotal
    reads:
    - M.Identification.acyclic
    - M.Identification.structure_complete
    - M.PersonAssessment.income_path_products
    writes:
    - M.PersonAssessment.income_ratio
    depends_on:
    - M.Step.G1.IdentityRights
    - M.Step.G1.IncomePaths
    on_missing: BLOCK
    description: 只有结构完整且无环已核实才合计同一自然人的全部路径；不得把缺失路径算零，也不把收益权和表决权相加。
    basis_ids:
    - K.R.04
  - id: M.Step.G1.VotingPaths
    name: 表决权路径逐条乘算
    kind: DETERMINE
    uses:
    - M.Rule.VotingPaths
    reads:
    - M.Identification.rights
    - M.Identification.subject
    - M.PersonAssessment.as_of
    - M.PersonAssessment.person
    writes:
    - M.PersonAssessment.voting_path_products
    depends_on: []
    on_missing: BLOCK
    description: 按权利类型和有效时点筛选已核实直接关系，枚举自然人到主体的全部无环路径并逐层相乘；未知终止、未知边和循环均不输出确定比例。
    basis_ids:
    - K.R.04
  - id: M.Step.G1.VotingTotal
    name: 表决权多路径合计
    kind: DETERMINE
    uses:
    - M.Rule.VotingTotal
    reads:
    - M.Identification.acyclic
    - M.Identification.structure_complete
    - M.PersonAssessment.voting_path_products
    writes:
    - M.PersonAssessment.voting_ratio
    depends_on:
    - M.Step.G1.IdentityRights
    - M.Step.G1.VotingPaths
    on_missing: BLOCK
    description: 只有结构完整且无环已核实才合计同一自然人的全部路径；不得把缺失路径算零，也不把收益权和表决权相加。
    basis_ids:
    - K.R.04
  - id: M.Step.G1.Standard1
    name: 按股权或合伙权益标准认定
    kind: DETERMINE
    uses:
    - M.Rule.Standard1
    reads:
    - M.PersonAssessment.equity_ratio
    writes:
    - M.PersonAssessment.standard1
    depends_on:
    - M.Step.G1.EquityTotal
    on_missing: BLOCK
    description: 最终股权或合伙权益达到25%即达标；不将24.99%四舍五入为25%。
    basis_ids:
    - K.R.03
  - id: M.Step.G1.Standard2
    name: 按收益权或表决权标准认定
    kind: DETERMINE
    uses:
    - M.Rule.Standard2
    reads:
    - M.PersonAssessment.income_ratio
    - M.PersonAssessment.voting_ratio
    writes:
    - M.PersonAssessment.standard2
    depends_on:
    - M.Step.G1.IncomeTotal
    - M.Step.G1.VotingTotal
    on_missing: BLOCK
    description: 收益权与表决权分别比较25%；任一达标即成立，二者不能合成一个比例。
    basis_ids:
    - K.R.04
  - id: M.Step.G1.Standard3
    name: 按实际控制标准认定
    kind: DETERMINE
    uses:
    - M.Rule.Standard3
    reads:
    - M.PersonAssessment.control_verified
    writes:
    - M.PersonAssessment.standard3
    depends_on:
    - M.Step.G1.Control
    on_missing: BLOCK
    description: 以有证据的实际控制判断承接标准三，不引入持股比例门槛。
    basis_ids:
    - K.R.05
  - id: M.Step.G1.PersonQualified
    name: 汇总该自然人的达标情况
    kind: DETERMINE
    uses:
    - M.Rule.PersonQualified
    reads:
    - M.PersonAssessment.standard1
    - M.PersonAssessment.standard2
    - M.PersonAssessment.standard3
    writes:
    - M.PersonAssessment.ownership_qualified
    depends_on:
    - M.Step.G1.Standard1
    - M.Step.G1.Standard2
    - M.Step.G1.Standard3
    on_missing: BLOCK
    description: 本人的任一标准成立可形成认定候选；仍继续检查其他自然人并核实身份与权利。
    basis_ids:
    - K.R.03
    - K.R.04
    - K.R.05
  - id: M.Step.G1.UseStandard2
    name: 本人优先采用标准一后的标准二
    kind: DETERMINE
    uses:
    - M.Rule.UseStandard2
    reads:
    - M.PersonAssessment.standard1
    - M.PersonAssessment.standard2
    writes:
    - M.PersonAssessment.uses_standard2
    depends_on:
    - M.Step.G1.Standard1
    - M.Step.G1.Standard2
    on_missing: BLOCK
    description: 本人标准一成立时优先按标准一记录；不删除本人的其他事实权利。
    basis_ids:
    - K.R.03
    - K.R.04
  - id: M.Step.G1.UseStandard3
    name: 本人优先采用标准一后的标准三
    kind: DETERMINE
    uses:
    - M.Rule.UseStandard3
    reads:
    - M.PersonAssessment.standard1
    - M.PersonAssessment.standard3
    writes:
    - M.PersonAssessment.uses_standard3
    depends_on:
    - M.Step.G1.Standard1
    - M.Step.G1.Standard3
    on_missing: BLOCK
    description: 本人标准一不成立时，标准二与标准三可同时保留，不把两种关系计成两个人。
    basis_ids:
    - K.R.03
    - K.R.05
  - id: M.Step.G1.Fallback
    name: 是否可以采用管理人员兜底
    kind: DETERMINE
    uses:
    - M.Rule.Fallback
    reads:
    - M.Identification.all_standards_checked
    - M.Identification.any_standard_positive
    - M.Identification.structure_complete
    writes:
    - M.Identification.fallback_allowed
    depends_on:
    - M.Step.G1.IdentityRights
    on_missing: BLOCK
    description: 完整核验前三项且未识别出自然人时才可从最高层级日常经营管理人员中至少确定一人；缺证不能启动兜底；同一最高层级存在多名人员时，按公司章程（合伙企业按合伙协议）层级顺位取第一顺位并记录依据（用户已答口径）。
    basis_ids:
    - K.R.06
  - id: M.Step.G1.BranchRoute
    name: 分支机构识别路径
    kind: DETERMINE
    uses:
    - M.Rule.BranchRoute
    reads:
    - M.Identification.branch_reuse_verified
    - M.Subject.kind
    writes:
    - M.Identification.branch_result
    depends_on: []
    on_missing: BLOCK
    description: 国内分支沿用须确认本机构已完成所属主体尽调；外国分支同时保留所属公司穿透和本分支高管两条来源。
    basis_ids:
    - K.R.08
  - id: M.Step.G1.KnownEquityPaths
    name: 保留已证明的股权路径
    kind: DETERMINE
    uses:
    - M.Rule.KnownEquityPaths
    reads:
    - M.Identification.rights
    - M.Identification.subject
    - M.PersonAssessment.as_of
    - M.PersonAssessment.person
    writes:
    - M.PersonAssessment.known_equity_paths
    depends_on: []
    on_missing: BLOCK
    description: 只取身份、比例和有效期已有证明的路径，保留已知正向依据；不能据此宣称结构或名单完整。
    basis_ids:
    - K.R.03
  - id: M.Step.G1.KnownEquityLowerBound
    name: 已知股权路径形成下界
    kind: DETERMINE
    uses:
    - M.Rule.KnownEquityLowerBound
    reads:
    - M.PersonAssessment.known_equity_paths
    writes:
    - M.PersonAssessment.known_equity_lower_bound
    depends_on:
    - M.Step.G1.KnownEquityPaths
    on_missing: BLOCK
    description: 对已证明路径求和作为下界，不把尚未证明的部分填成零或称为最终总比例。
    basis_ids:
    - K.R.03
  - id: M.Step.G1.KnownStandard1Candidate
    name: 不完整结构中的已知达标候选
    kind: DETERMINE
    uses:
    - M.Rule.KnownStandard1Candidate
    reads:
    - M.PersonAssessment.known_equity_lower_bound
    writes:
    - M.PersonAssessment.standard1_candidate
    depends_on:
    - M.Step.G1.KnownEquityLowerBound
    on_missing: BLOCK
    description: 已有证据下界达到25%可记录该人的候选并核实；整体名单和最终总比例仍受结构完整性限制。
    basis_ids:
    - K.R.03
  - id: M.Step.G1.IdentityRights
    name: 核实身份、权利及结构证据
    kind: VERIFY
    uses:
    - M.Judgment.IdentityRights
    reads:
    - M.Identification.evidence
    - M.Identification.rights
    - M.Identification.subject
    writes:
    - M.Identification.identity_verified
    - M.Identification.records_complete
    - M.Identification.rights_verified
    - M.Identification.structure_complete
    depends_on: []
    on_missing: BLOCK
    description: 按主体类型获取能解释所有权和控制结构的相符资料，逐层到自然人；疑点须多来源印证。；身份优先核对可靠官方信息，无法时补证件和其他资料；权利另以章程、协议、股东名册及实际行使记录核实。；分别核对备案和金融机构场景的信息集合，不把BOMIS或客户声明当作独立识别的替代。
    basis_ids:
    - K.R.10
    - K.R.13
    - K.R.EXT.GOV.13.IDENTIFY
    - K.R.EXT.GOV.13.VERIFY
  - id: M.Step.G1.Control
    name: 实际控制证据判断
    kind: VERIFY
    uses:
    - M.Judgment.Control
    reads:
    - M.Control.arrangement
    - M.Control.evidence
    - M.Control.exercise
    - M.Control.matters
    writes:
    - M.Control.sustained
    - M.PersonAssessment.control_verified
    depends_on: []
    on_missing: BLOCK
    description: 逐项确认单独或联合控制的安排及实际行使，判断是否持续实质支配人事、重大经营、财务、重要资产或主要资金。；持股比例低不排除控制；职位、顾问、亲属或第三方标签均不能单独证实控制。
    basis_ids:
    - K.R.05
  - id: M.Step.G1.Authority
    name: 主体分类、用途授权和责任适用核查
    kind: VERIFY
    uses:
    - M.Judgment.Authority
    reads:
    - M.Access.purpose
    - M.Identification.evidence
    - M.Identification.subject
    writes:
    - M.Access.institution_authorized
    - M.Access.lawful_purpose
    - M.Access.operator_authorized
    - M.Identification.category_verified
    depends_on: []
    on_missing: BLOCK
    description: 核对主体登记类别、所引用条文和法定用途，免识别或简化不得由相似名称扩张。；具体查询须有适用机构权限及经办授权，声明和返回方式须符合对应条件，后续使用限于授权用途并保密。；处罚适用所需上位法不齐时只形成责任风险和补充清单，不宣称已完整确定处罚。
    basis_ids:
    - K.R.01
    - K.R.20
    - K.R.21
    - K.R.EXT.GOV.20.ACCESS
    - K.R.EXT.GOV.21.LIABILITY
    - K.R.EXT.GOV.15.EXEMPT
    - K.R.EXT.GOV.15.SIMPLIFY
  - id: M.Step.G1.RecordContents
    name: 场景所需信息集合核对
    kind: VERIFY
    uses:
    - M.Judgment.RecordContents
    reads:
    - M.Identification.evidence
    - M.Identification.purpose
    writes:
    - M.Identification.records_complete
    depends_on: []
    on_missing: BLOCK
    description: 按备案与金融机构留存的各自信息集合逐字段检查，身份、联系、权利类型、比例或控制方式、形成终止信息按适用条件记录。；关系类型与比例口径分开，字段暂不可确认时写明缺证，不用同一空值代表不适用、未知和未采集。
    basis_ids:
    - K.R.10
  basis_ids:
  - K.R.01
  - K.R.02
  - K.R.03
  - K.R.04
  - K.R.05
  - K.R.06
  - K.R.08
  - K.R.10
- id: M.Process.G2
  name: 国企性质与简化
  question_ids:
  - K.Q.07
  - K.Q.07.APPLY
  - K.Q.07.NATURE
  - K.Q.07.RISK
  - K.Q.15
  trigger: 开始处理国企性质与简化时，固定主体、用途、业务时点和本机构责任。
  steps:
  - id: M.Step.G2.Article44
    name: 第四条第四项性质条件
    kind: DETERMINE
    uses:
    - M.Rule.Article44
    reads:
    - M.StateNature.actual_dominance
    - M.StateNature.largest_shareholder
    - M.StateNature.qualified_investor
    - M.StateNature.state_ratio
    writes:
    - M.StateNature.article4_4
    depends_on:
    - M.Step.G2.StateNature
    on_missing: BLOCK
    description: 合格出资人、持股未超过50%、第一大股东和有证据的实际支配同时成立；超过50%另按相应条款判断。
    basis_ids:
    - K.R.07.NATURE
  - id: M.Step.G2.RelativeHolding
    name: 衔接国有相对控股口径
    kind: DETERMINE
    uses:
    - M.Rule.RelativeHolding
    reads:
    - M.StateNature.article4_4
    writes:
    - M.StateNature.relative_holding
    depends_on:
    - M.Step.G2.Article44
    on_missing: BLOCK
    description: 按已记录的用户口径从第四条第四项性质认定衔接国有相对控股；仍需另做12号令适用及风险判断。
    basis_ids:
    - K.R.07.NATURE
    - K.R.07.APPLY
  - id: M.Step.G2.StateApplicability
    name: 金融机构国企简化主体范围
    kind: DETERMINE
    uses:
    - M.Rule.StateApplicability
    reads:
    - M.StateNature.nature
    - M.StateNature.officially_verified
    - M.StateNature.relative_holding
    writes:
    - M.StateNature.cdd_branch_applicable
    depends_on:
    - M.Step.G2.RelativeHolding
    - M.Step.G2.StateNature
    on_missing: BLOCK
    description: 官方性质依据可靠后判断列明主体或已衔接相对控股范围；国有参股只可处理其国有资本部分，不能整户直接按法定代表人简化。
    basis_ids:
    - K.R.07
    - K.R.07.APPLY
    - K.R.EXT.GOV.15.STATE
  - id: M.Step.G2.StateSimplification
    name: 国企简化风险门控
    kind: DETERMINE
    uses:
    - M.Rule.StateSimplification
    reads:
    - M.Identification.data_doubt
    - M.Identification.matched_risk_measure
    - M.Identification.risk20_triggered
    - M.Identification.risk_assessment_complete
    - M.StateNature.cdd_branch_applicable
    writes:
    - M.Identification.simplification_allowed
    depends_on:
    - M.Step.G2.Risk
    - M.Step.G2.StateApplicability
    on_missing: BLOCK
    description: 性质与适用判断完成、风险评估充分且无阻断情形时才可以简化；结果表示允许，不表示必须自动采用。
    basis_ids:
    - K.R.07
    - K.R.07.RISK
    - K.R.EXT.GOV.15.STATE
  - id: M.Step.G2.StateNature
    name: 国有性质与实际支配证据判断
    kind: VERIFY
    uses:
    - M.Judgment.StateNature
    reads:
    - M.StateNature.evidence
    - M.StateNature.state_investor
    - M.StateNature.subject
    writes:
    - M.StateNature.actual_dominance
    - M.StateNature.largest_shareholder
    - M.StateNature.nature
    - M.StateNature.officially_verified
    - M.StateNature.qualified_investor
    depends_on: []
    on_missing: BLOCK
    description: 核对出资人资格、第一大股东和实际支配安排的具体证明；名录、集团证明或审计材料须对应主体、时点和证明事项。；超过50%的结构另核对相应条款；国资参股但无实际支配不能按标签认定控制。；性质结论供适用分支使用，尚不构成简化识别决定。
    basis_ids:
    - K.R.07
    - K.R.07.NATURE
    - K.R.07.APPLY
    - K.R.EXT.GOV.15.STATE
  - id: M.Step.G2.Risk
    name: 风险及措施匹配判断
    kind: VERIFY
    uses:
    - M.Judgment.Risk
    reads:
    - M.Identification.enhanced_reasons
    - M.Identification.evidence
    writes:
    - M.Identification.data_doubt
    - M.Identification.enhanced_measures
    - M.Identification.higher_risk
    - M.Identification.matched_risk_measure
    - M.Identification.risk20_triggered
    - M.Identification.risk_assessment_complete
    depends_on: []
    on_missing: BLOCK
    description: 充分评估客户洗钱和恐怖融资风险，逐项核对第二十条具体情形及信息准确性。；根据风险原因选择相匹配的加强或简化措施；简化是可选择措施，不是主体类别命中后必须执行。；风险触发本身不直接产生拒绝或终止结论。
    basis_ids:
    - K.R.07.RISK
    - K.R.14
    - K.R.15
    - K.R.EXT.GOV.14.STOP
    - K.R.EXT.GOV.15.SIMPLIFY
    - K.R.EXT.GOV.15.EXEMPT
  basis_ids:
  - K.R.07
  - K.R.07.NATURE
  - K.R.07.APPLY
  - K.R.07.RISK
  - K.R.EXT.GOV.15.STATE
- id: M.Process.G3
  name: 信托与资产管理产品
  question_ids:
  - K.Q.09
  trigger: 开始处理信托与资产管理产品时，固定主体、用途、业务时点和本机构责任。
  steps:
  - id: M.Step.G3.TrustFull
    name: 完整信托当事人识别
    kind: DETERMINE
    uses:
    - M.Rule.TrustFull
    reads:
    - M.ProductAssessment.trust_lookthrough_complete
    - M.ProductAssessment.trust_party_scope_complete
    writes:
    - M.ProductAssessment.full_trust_identification
    depends_on:
    - M.Step.G3.Products
    on_missing: BLOCK
    description: 完整纳入各类当事人及其他最终有效控制自然人，组织当事人继续穿透；具体受益人未定时记录范围，不能造人。
    basis_ids:
    - K.R.09
  - id: M.Step.G3.TrustSimplification
    name: 信托类型和风险分支
    kind: DETERMINE
    uses:
    - M.Rule.TrustSimplification
    reads:
    - M.Identification.data_doubt
    - M.Identification.risk20_triggered
    - M.ProductAssessment.low_risk
    - M.ProductAssessment.risk_assessment_complete
    - M.ProductAssessment.simple_structure
    - M.Subject.trust_kind
    writes:
    - M.ProductAssessment.simplify_allowed
    depends_on:
    - M.Step.G3.Products
    on_missing: BLOCK
    description: 只有其他资产服务信托在结构简单且风险较低时可以简化；财富管理、公益慈善、民事和外国信托完整识别。
    basis_ids:
    - K.R.09.TYPE
  - id: M.Step.G3.AssetSimplification
    name: 资管产品简化条件
    kind: DETERMINE
    uses:
    - M.Rule.AssetSimplification
    reads:
    - M.Identification.data_doubt
    - M.Identification.risk20_triggered
    - M.ProductAssessment.financial_manager
    - M.ProductAssessment.low_risk
    - M.ProductAssessment.manager_people_identified
    - M.ProductAssessment.public_offering
    - M.ProductAssessment.registered
    - M.ProductAssessment.risk_assessment_complete
    - M.ProductAssessment.service_in_scope
    writes:
    - M.ProductAssessment.simplify_allowed
    depends_on:
    - M.Step.G3.Products
    on_missing: BLOCK
    description: 金融机构管理或受托并处于相应服务场景，公开募集发行且依法登记，或其他低风险产品依具体条件可简化；实际管理自然人必须具体核实。
    basis_ids:
    - K.R.09.ASSET
  - id: M.Step.G3.ManagerReliance
    name: 是否可采信管理受托机构结果
    kind: DETERMINE
    uses:
    - M.Rule.ManagerReliance
    reads:
    - M.ProductAssessment.doubts
    - M.ProductAssessment.major_risk
    - M.ProductAssessment.manager_duties_effective
    - M.ProductAssessment.manager_system_sound
    - M.ProductAssessment.serious_violation
    - M.ProductAssessment.uncooperative
    writes:
    - M.ProductAssessment.reliance_allowed
    depends_on:
    - M.Step.G3.Products
    on_missing: BLOCK
    description: 须确信体系健全且有效履责；疑点需重新识别，不配合、严重违法或重大风险进入相应风险处理。
    basis_ids:
    - K.R.09.RELIANCE
  - id: M.Step.G3.Products
    name: 信托与资管条件及受托机构履职判断
    kind: VERIFY
    uses:
    - M.Judgment.Products
    reads:
    - M.ProductAssessment.evidence
    - M.ProductAssessment.manager
    - M.ProductAssessment.product
    - M.ProductAssessment.trust_parties
    writes:
    - M.ProductAssessment.doubts
    - M.ProductAssessment.low_risk
    - M.ProductAssessment.manager_duties_effective
    - M.ProductAssessment.manager_people_identified
    - M.ProductAssessment.manager_system_sound
    - M.ProductAssessment.risk_assessment_complete
    - M.ProductAssessment.simple_structure
    - M.ProductAssessment.trust_lookthrough_complete
    - M.ProductAssessment.trust_party_scope_complete
    depends_on: []
    on_missing: BLOCK
    description: 核实信托业务类型、合同、募集发行方式、登记、管理受托机构身份、结构和风险；简化分支不得互相替代。；完整识别所需各类当事人及最终有效控制人；组织当事人继续穿透，未确定受益人记录范围。；采信须确信管理方制度健全且有效履责；疑点重识别，不配合或严重违法重大风险另作风险措施。；实际管理自然人的多人选择口径未决时，不能以管理公司法定代表人替代。
    basis_ids:
    - K.R.09
    - K.R.09.TYPE
    - K.R.09.ASSET
    - K.R.09.RELIANCE
  basis_ids:
  - K.R.09
  - K.R.09.TYPE
  - K.R.09.ASSET
  - K.R.09.RELIANCE
- id: M.Process.G4
  name: 时间、期限与持续复核
  question_ids:
  - K.Q.10
  - K.Q.11
  - K.Q.11.HISTORY
  - K.Q.11.START
  - K.Q.12
  - K.Q.16
  trigger: 开始处理时间、期限与持续复核时，固定主体、用途、业务时点和本机构责任。
  steps:
  - id: M.Step.G4.Formation
    name: 当前总体形成日期
    kind: DETERMINE
    uses:
    - M.Rule.Formation
    reads:
    - M.Identification.subject
    - M.PersonAssessment.as_of
    - M.PersonAssessment.continuity_verified
    - M.PersonAssessment.history
    - M.PersonAssessment.history_complete
    - M.PersonAssessment.person
    writes:
    - M.PersonAssessment.formation_date
    depends_on:
    - M.Step.G4.Continuity
    on_missing: BLOCK
    description: 从已证明的关系历史取包含当前判断时点的最近连续达标区间起点；历史中断保留，类型切换但总体连续不重置日期。
    basis_ids:
    - K.R.11
    - K.R.11.HISTORY
  - id: M.Step.G4.FilingDue
    name: 备案及更新期限
    kind: DETERMINE
    uses:
    - M.Rule.FilingDue
    reads:
    - M.Filing.trigger
    - M.Filing.trigger_date
    writes:
    - M.Filing.due_date
    depends_on: []
    on_missing: BLOCK
    description: 线上设立同步办理，现场设立、变化或免报条件失效起30日；存量备案使用明示截止日，均不是日期差异容差。
    basis_ids:
    - K.R.12
    - K.R.EXT.GOV.12.FILING
  - id: M.Step.G4.LegacyDeferral
    name: 存量客户激活例外
    kind: DETERMINE
    uses:
    - M.Rule.LegacyDeferral
    reads:
    - M.Followup.activated
    - M.Followup.higher_risk
    - M.Followup.inactive_or_restricted
    - M.Followup.legacy_customer
    writes:
    - M.Followup.deferral_allowed
    depends_on: []
    on_missing: BLOCK
    description: 不动或严格限制的存量客户可延至激活或办理业务；不是永久免除，状态不明不得套用。
    basis_ids:
    - K.R.EXT.GOV.12.LEGACY_CDD
  - id: M.Step.G4.LegacyDue
    name: 存量客户补齐期限
    kind: DETERMINE
    uses:
    - M.Rule.LegacyDue
    reads:
    - M.Followup.activated
    - M.Followup.higher_risk
    - M.Followup.inactive_or_restricted
    - M.Followup.legacy_customer
    - M.Followup.trigger_date
    writes:
    - M.Followup.due_date
    depends_on: []
    on_missing: BLOCK
    description: 风险较高及以上自制度施行起6个月，其他存量2年；不动或严格限制者激活或办理时恢复补齐义务。
    basis_ids:
    - K.R.12
    - K.R.EXT.GOV.12.LEGACY_CDD
  - id: M.Step.G4.ReviewTrigger
    name: 变更事件触发复核
    kind: DETERMINE
    uses:
    - M.Rule.ReviewTrigger
    reads:
    - M.Followup.may_affect_ownership
    writes:
    - M.Followup.review_required
    depends_on: []
    on_missing: BLOCK
    description: 可能影响受益所有权的事件即启动审核，核实后决定是否更新；加强情形可提高频率，但没有统一固定周期时不编造。
    basis_ids:
    - K.R.16
    - K.R.EXT.GOV.16.FREQUENCY
  - id: M.Step.G4.EffectiveDate
    name: 法律关系实际生效日期判断
    kind: VERIFY
    uses:
    - M.Judgment.EffectiveDate
    reads:
    - M.PersonAssessment.basis_evidence
    writes:
    - M.PersonAssessment.date_reason
    - M.PersonAssessment.legal_start
    depends_on: []
    on_missing: BLOCK
    description: 逐件核对合同、章程、决议或权利文件的生效约定及条件是否实际满足。；签署、提交、录入、获知或查询日期不得自动代替法律关系实际生效日期。
    basis_ids:
    - K.R.11
    - K.R.11.START
    - K.R.EXT.GOV.10.FORMATION
  - id: M.Step.G4.Continuity
    name: 历史完整性和总体资格连续判断
    kind: VERIFY
    uses:
    - M.Judgment.Continuity
    reads:
    - M.PersonAssessment.basis_evidence
    - M.PersonAssessment.history
    writes:
    - M.PersonAssessment.continuity_verified
    - M.PersonAssessment.date_reason
    - M.PersonAssessment.history_complete
    depends_on: []
    on_missing: BLOCK
    description: 按实际生效的关系变化重建各段历史，核对真实中断和未知终止。；关系类型切换但总体资格始终满足时延续原日期；存在真实空档则保留退出和重新达标。；备案历史用于佐证变化，备案操作时点不能直接充当关系生效时点。
    basis_ids:
    - K.R.11
    - K.R.11.HISTORY
    - K.R.23.HISTORY
  basis_ids:
  - K.R.11
  - K.R.11.START
  - K.R.11.HISTORY
  - K.R.12
  - K.R.16
  - K.R.EXT.GOV.10.FORMATION
  - K.R.EXT.GOV.12.FILING
  - K.R.EXT.GOV.12.LEGACY_CDD
  - K.R.EXT.GOV.16.FREQUENCY
- id: M.Process.G5
  name: 证据、风险与措施
  question_ids:
  - K.Q.13
  - K.Q.14
  - K.Q.15
  trigger: 开始处理证据、风险与措施时，固定主体、用途、业务时点和本机构责任。
  steps:
  - id: M.Step.G5.FilingExemption
    name: 承诺免报条件
    kind: DETERMINE
    uses:
    - M.Rule.FilingExemption
    reads:
    - M.Filing.all_natural_holders
    - M.Filing.as_of
    - M.Filing.capital_cny
    - M.Filing.no_external_beneficiary
    - M.Filing.no_other_control_benefit
    - M.Filing.promise_truthful
    - M.Subject.kind
    writes:
    - M.Filing.promise_exempt
    depends_on: []
    on_missing: BLOCK
    description: 四项事实同时满足并真实承诺才可免报；外国公司及其分支不适用，外币折算不明时不生成人民币金额。
    basis_ids:
    - K.R.02
    - K.R.EXT.GOV.15.FILING_EXEMPT
  - id: M.Step.G5.RefuseOrEnd
    name: 加强后是否可拒绝或终止
    kind: DETERMINE
    uses:
    - M.Rule.RefuseOrEnd
    reads:
    - M.Identification.enhanced_measures_completed
    - M.Identification.residual_risk_manageable
    writes:
    - M.Identification.refuse_or_end
    depends_on:
    - M.Step.G5.RemainingRisk
    on_missing: BLOCK
    description: 加强措施后风险仍超出管理能力才进入拒绝或终止；触发加强识别本身不能直接退出。
    basis_ids:
    - K.R.14
    - K.R.EXT.GOV.14.STOP
  - id: M.Step.G5.CddExemption
    name: 列明主体免识别条件
    kind: DETERMINE
    uses:
    - M.Rule.CddExemption
    reads:
    - M.Identification.category_verified
    - M.Identification.data_doubt
    - M.Identification.exemption_category
    - M.Identification.risk20_triggered
    writes:
    - M.Identification.exemption_allowed
    depends_on:
    - M.Step.G5.Authority
    - M.Step.G5.Risk
    on_missing: BLOCK
    description: 只使用第十条封闭类别及已有明确依据的人民银行另行规定；资格不明或第二十条情形阻断免识别。
    basis_ids:
    - K.R.15
    - K.R.EXT.GOV.15.EXEMPT
  - id: M.Step.G5.SimplificationMeasure
    name: 按具体主体分支选择措施
    kind: DETERMINE
    uses:
    - M.Rule.SimplificationMeasure
    reads:
    - M.Identification.category_verified
    - M.Identification.data_doubt
    - M.Identification.higher_risk
    - M.Identification.matched_risk_measure
    - M.Identification.risk20_triggered
    - M.Identification.risk_assessment_complete
    - M.Identification.simplification_category
    writes:
    - M.Identification.simplification_measure
    depends_on:
    - M.Step.G5.Authority
    - M.Step.G5.Risk
    on_missing: BLOCK
    description: 按主体具体条款选择负责人、投资人或其他人员；不得跨分支概括，国企仍须完整性质、适用和风险链条，信托资管另按其条件。
    basis_ids:
    - K.R.15
    - K.R.EXT.GOV.15.SIMPLIFY
  - id: M.Step.G5.QueryAfterIdentification
    name: 备案主体查询核对前提
    kind: DETERMINE
    uses:
    - M.Rule.QueryAfterIdentification
    reads:
    - M.Identification.filing_applicable
    - M.Identification.identity_verified
    - M.Identification.rights_verified
    writes:
    - M.Identification.refresh_query_required
    depends_on:
    - M.Step.G5.IdentityRights
    on_missing: BLOCK
    description: 独立识别并核实身份和权利后，对备案主体查询核对；查询故障与未备案不是同一种事实。
    basis_ids:
    - K.R.13
    - K.R.17
    - K.R.EXT.GOV.13.VERIFY
  - id: M.Step.G5.IdentityRights
    name: 核实身份、权利及结构证据
    kind: VERIFY
    uses:
    - M.Judgment.IdentityRights
    reads:
    - M.Identification.evidence
    - M.Identification.rights
    - M.Identification.subject
    writes:
    - M.Identification.identity_verified
    - M.Identification.records_complete
    - M.Identification.rights_verified
    - M.Identification.structure_complete
    depends_on: []
    on_missing: BLOCK
    description: 按主体类型获取能解释所有权和控制结构的相符资料，逐层到自然人；疑点须多来源印证。；身份优先核对可靠官方信息，无法时补证件和其他资料；权利另以章程、协议、股东名册及实际行使记录核实。；分别核对备案和金融机构场景的信息集合，不把BOMIS或客户声明当作独立识别的替代。
    basis_ids:
    - K.R.10
    - K.R.13
    - K.R.EXT.GOV.13.IDENTIFY
    - K.R.EXT.GOV.13.VERIFY
  - id: M.Step.G5.Risk
    name: 风险及措施匹配判断
    kind: VERIFY
    uses:
    - M.Judgment.Risk
    reads:
    - M.Identification.enhanced_reasons
    - M.Identification.evidence
    writes:
    - M.Identification.data_doubt
    - M.Identification.enhanced_measures
    - M.Identification.higher_risk
    - M.Identification.matched_risk_measure
    - M.Identification.risk20_triggered
    - M.Identification.risk_assessment_complete
    depends_on: []
    on_missing: BLOCK
    description: 充分评估客户洗钱和恐怖融资风险，逐项核对第二十条具体情形及信息准确性。；根据风险原因选择相匹配的加强或简化措施；简化是可选择措施，不是主体类别命中后必须执行。；风险触发本身不直接产生拒绝或终止结论。
    basis_ids:
    - K.R.07.RISK
    - K.R.14
    - K.R.15
    - K.R.EXT.GOV.14.STOP
    - K.R.EXT.GOV.15.SIMPLIFY
    - K.R.EXT.GOV.15.EXEMPT
  - id: M.Step.G5.RemainingRisk
    name: 加强措施后的剩余风险判断
    kind: VERIFY
    uses:
    - M.Judgment.RemainingRisk
    reads:
    - M.Identification.enhanced_measures
    - M.Identification.evidence
    writes:
    - M.Identification.enhanced_measures_completed
    - M.Identification.residual_risk_manageable
    - M.Identification.restrict_needed
    depends_on:
    - M.Step.G5.Risk
    on_missing: BLOCK
    description: 先核对加强措施已实际实施，再判断剩余风险是否在本机构管理能力内。；需要进一步管理可施加合理限制；仅风险超出管理能力时才进入拒绝或终止。
    basis_ids:
    - K.R.14
    - K.R.EXT.GOV.14.STOP
  - id: M.Step.G5.Authority
    name: 主体分类、用途授权和责任适用核查
    kind: VERIFY
    uses:
    - M.Judgment.Authority
    reads:
    - M.Access.purpose
    - M.Identification.evidence
    - M.Identification.subject
    writes:
    - M.Access.institution_authorized
    - M.Access.lawful_purpose
    - M.Access.operator_authorized
    - M.Identification.category_verified
    depends_on: []
    on_missing: BLOCK
    description: 核对主体登记类别、所引用条文和法定用途，免识别或简化不得由相似名称扩张。；具体查询须有适用机构权限及经办授权，声明和返回方式须符合对应条件，后续使用限于授权用途并保密。；处罚适用所需上位法不齐时只形成责任风险和补充清单，不宣称已完整确定处罚。
    basis_ids:
    - K.R.01
    - K.R.20
    - K.R.21
    - K.R.EXT.GOV.20.ACCESS
    - K.R.EXT.GOV.21.LIABILITY
    - K.R.EXT.GOV.15.EXEMPT
    - K.R.EXT.GOV.15.SIMPLIFY
  basis_ids:
  - K.R.13
  - K.R.14
  - K.R.15
  - K.R.EXT.GOV.13.IDENTIFY
  - K.R.EXT.GOV.13.VERIFY
  - K.R.EXT.GOV.14.STOP
  - K.R.EXT.GOV.15.EXEMPT
  - K.R.EXT.GOV.15.SIMPLIFY
  - K.R.EXT.GOV.15.FILING_EXEMPT
- id: M.Process.G6
  name: 查询、差异与闭环
  question_ids:
  - K.Q.17
  - K.Q.18
  - K.Q.18.DATES
  - K.Q.18.PENDING
  - K.Q.19
  - K.Q.19.CLOSE
  - K.Q.19.CORRECT
  trigger: 开始处理查询、差异与闭环时，固定主体、用途、业务时点和本机构责任。
  steps:
  - id: M.Step.G6.QueryAfterIdentification
    name: 备案主体查询核对前提
    kind: DETERMINE
    uses:
    - M.Rule.QueryAfterIdentification
    reads:
    - M.Identification.filing_applicable
    - M.Identification.identity_verified
    - M.Identification.rights_verified
    writes:
    - M.Identification.refresh_query_required
    depends_on: []
    on_missing: BLOCK
    description: 独立识别并核实身份和权利后，对备案主体查询核对；查询故障与未备案不是同一种事实。
    basis_ids:
    - K.R.13
    - K.R.17
    - K.R.EXT.GOV.13.VERIFY
  - id: M.Step.G6.DateYearMonth
    name: 关系日期年月比较
    kind: DETERMINE
    uses:
    - M.Rule.DateYearMonth
    reads:
    - M.Difference.filing_date
    - M.Difference.institution_date
    writes:
    - M.Difference.year_month_mismatch
    depends_on: []
    on_missing: BLOCK
    description: 年月差异单独作为重大分支检查；同月日差还需判断是否影响认定及其他重大情形。
    basis_ids:
    - K.R.18
    - K.R.18.DATES
  - id: M.Step.G6.MaterialDifference
    name: 差异重大性判断
    kind: DETERMINE
    uses:
    - M.Rule.MaterialDifference
    reads:
    - M.Difference.affects_ubo
    - M.Difference.key_rights_mismatch
    - M.Difference.other_major_branch
    - M.Difference.people_mismatch
    - M.Difference.year_month_mismatch
    writes:
    - M.Difference.material
    depends_on:
    - M.Step.G6.DateYearMonth
    - M.Step.G6.DifferenceCause
    on_missing: BLOCK
    description: 列明的重大分支任一成立即重大，日期年月与是否影响认定独立判断；缺失事实不作无差异。
    basis_ids:
    - K.R.18
    - K.R.18.DATES
  - id: M.Step.G6.UpdateDue
    name: 近期变化的法定更新截止
    kind: DETERMINE
    uses:
    - M.Rule.UpdateDue
    reads:
    - M.Difference.actual_change_date
    writes:
    - M.Difference.update_due
    depends_on: []
    on_missing: BLOCK
    description: 30日是变化后的备案更新期限；须证明真实变化起算日。
    basis_ids:
    - K.R.18.PENDING
  - id: M.Step.G6.TimingPending
    name: 时点性待更新标记
    kind: DETERMINE
    uses:
    - M.Rule.TimingPending
    reads:
    - M.Difference.actual_change_date
    - M.Difference.as_of
    - M.Difference.customer_corrected
    - M.Difference.update_due
    writes:
    - M.Difference.timing_pending
    depends_on:
    - M.Step.G6.DifferenceCause
    - M.Step.G6.UpdateDue
    on_missing: BLOCK
    description: 近期变化尚处更新期限且尚未更正时单独标记待更新；重大性与报告义务继续独立判断，跟踪责任和升级口径仍待确认。
    basis_ids:
    - K.R.18
    - K.R.18.PENDING
  - id: M.Step.G6.ReportRequired
    name: 差异报告义务判断
    kind: DETERMINE
    uses:
    - M.Rule.ReportRequired
    reads:
    - M.Difference.cause
    - M.Difference.material
    writes:
    - M.Difference.report_required
    depends_on:
    - M.Step.G6.DifferenceCause
    - M.Step.G6.MaterialDifference
    on_missing: BLOCK
    description: 经核实备案错误且重大时进入报告；机构识别错误先更正本机构，非重大差异记录并提示。
    basis_ids:
    - K.R.19
    - K.R.19.CORRECT
  - id: M.Step.G6.CorrectionAction
    name: 按原因采取差异处置
    kind: DETERMINE
    uses:
    - M.Rule.CorrectionAction
    reads:
    - M.Difference.cause
    - M.Difference.material
    writes:
    - M.Difference.correction_action
    depends_on:
    - M.Step.G6.DifferenceCause
    - M.Step.G6.MaterialDifference
    on_missing: BLOCK
    description: 成因、重大性和时点标记分别保存，不因处于30日内跳过核实。
    basis_ids:
    - K.R.19
    - K.R.19.CORRECT
  - id: M.Step.G6.CloseDifference
    name: 实际更正且复核一致后闭环
    kind: DETERMINE
    uses:
    - M.Rule.CloseDifference
    reads:
    - M.Difference.customer_corrected
    - M.Difference.recheck_consistent
    writes:
    - M.Difference.closure_allowed
    depends_on:
    - M.Step.G6.DifferenceCause
    on_missing: BLOCK
    description: 已解决差异须实际更正且重新核验或查询复核一致；承诺、更正材料提交或报告办结均不能单独关闭。
    basis_ids:
    - K.R.19
    - K.R.19.CLOSE
  - id: M.Step.G6.DifferenceCause
    name: 差异原因和更正后复核
    kind: VERIFY
    uses:
    - M.Judgment.DifferenceCause
    reads:
    - M.Difference.correction_evidence
    - M.Difference.filing_value
    - M.Difference.institution_value
    - M.Difference.recheck_evidence
    writes:
    - M.Difference.affects_ubo
    - M.Difference.cause
    - M.Difference.customer_corrected
    - M.Difference.reason
    - M.Difference.recheck_consistent
    depends_on: []
    on_missing: BLOCK
    description: 先与客户沟通核实差异成因，区分机构错误、备案错误和近期变化。；核实客户已经实际更正，并用重新查询或核验的结果复核一致；承诺或报告办结不替代这两项事实。；日期年月差异与影响认定分别记录；近期更新期限标记不覆盖重大性和报告义务。
    basis_ids:
    - K.R.17
    - K.R.18
    - K.R.19
    - K.R.19.CORRECT
    - K.R.19.CLOSE
  - id: M.Step.G6.Difference
    name: 差异实质处置
    kind: UPDATE
    uses:
    - M.Machine.Difference
    reads:
    - M.Difference.state
    writes:
    - M.Difference.state
    depends_on: []
    on_missing: BLOCK
    description: 按实际业务反馈及条件计算允许的状态变化；不写外部系统。
    basis_ids:
    - K.R.19
    - K.R.19.CLOSE
  basis_ids:
  - K.R.17
  - K.R.18
  - K.R.18.DATES
  - K.R.18.PENDING
  - K.R.19
  - K.R.19.CORRECT
  - K.R.19.CLOSE
- id: M.Process.G7
