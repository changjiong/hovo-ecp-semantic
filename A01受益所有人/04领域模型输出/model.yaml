      max: 1
  - name: effective
    label: 已有效履行识别义务
    binding: M.ProductAssessment.manager_duties_effective
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: doubt
    label: 所得信息存在疑点
    binding: M.ProductAssessment.doubts
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: uncooperative
    label: 管理方不配合
    binding: M.ProductAssessment.uncooperative
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: violation
    label: 存在严重违法情形
    binding: M.ProductAssessment.serious_violation
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: major
    label: 存在重大风险
    binding: M.ProductAssessment.major_risk
    type: Boolean
    cardinality:
      min: 0
      max: 1
  result:
    type: Boolean
    cardinality:
      min: 0
      max: 1
  expression:
    op: and
    args:
    - input: sound
    - input: effective
    - op: not
      args:
      - input: doubt
    - op: not
      args:
      - input: uncooperative
    - op: not
      args:
      - input: violation
    - op: not
      args:
      - input: major
  on_unknown: PROPAGATE
  basis_ids:
  - K.R.09.RELIANCE
  question_ids:
  - K.Q.09
  depends_on: []
  result_binding: M.ProductAssessment.reliance_allowed
  business_meaning: 须确信体系健全且有效履责；疑点需重新识别，不配合、严重违法或重大风险进入相应风险处理。
- id: M.Rule.Formation
  name: 当前总体形成日期
  description: 从已证明的关系历史取包含当前判断时点的最近连续达标区间起点；历史中断保留，类型切换但总体连续不重置日期。
  inputs:
  - name: history
    label: 已核实的历史受益所有权关系
    binding: M.PersonAssessment.history
    type: Ref
    target: M.BeneficialOwnership
    cardinality:
      min: 0
      max: null
  - name: date
    label: 本项判断日期
    binding: M.PersonAssessment.as_of
    type: Date
    cardinality:
      min: 0
      max: 1
  - name: complete
    label: 本人的历史关系已完整核实
    binding: M.PersonAssessment.history_complete
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: continuity
    label: 本人的总体资格连续性已核实
    binding: M.PersonAssessment.continuity_verified
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: person
    label: 本项判断所涉自然人
    binding: M.PersonAssessment.person
    type: Ref
    target: M.Person
    cardinality:
      min: 1
      max: 1
  - name: subject
    label: 被识别主体
    binding: M.Identification.subject
    type: Ref
    target: M.Subject
    cardinality:
      min: 1
      max: 1
  result:
    type: Date
    cardinality:
      min: 0
      max: 1
  expression:
    op: current_interval_start
    args:
    - op: intervals_of
      args:
      - query:
          from:
            input: history
          as: relation
          where:
            op: and
            args:
            - op: eq
              args:
              - op: identity_key
                args:
                - field:
                    of:
                      input: relation
                    name: person
              - op: identity_key
                args:
                - input: person
            - op: eq
              args:
              - op: identity_key
                args:
                - field:
                    of:
                      input: relation
                    name: subject
              - op: identity_key
                args:
                - input: subject
          select:
            input: relation
      - literal:
          type: Text
          value: start
      - literal:
          type: Text
          value: end
      - literal:
          type: Text
          value: end_status
    - input: date
    - input: complete
    - input: continuity
  on_unknown: PROPAGATE
  basis_ids:
