  - name: ratio
    label: 同一自然人最终股权或合伙权益比例
    binding: M.PersonAssessment.equity_ratio
    type: Decimal
    cardinality:
      min: 0
      max: 1
  result:
    type: Boolean
    cardinality:
      min: 0
      max: 1
  expression:
    op: gte
    args:
    - input: ratio
    - literal:
        type: Decimal
        value: 0.25
  on_unknown: PROPAGATE
