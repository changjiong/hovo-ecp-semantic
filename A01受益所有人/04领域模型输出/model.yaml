- question_id: K.Q.10
  question: 备案主体与金融机构分别需要记录哪些受益所有人身份信息、权利状况和时间信息？
  answer: 备案与金融机构信息集合分开，形成日绑定生效事件。 事实需求包括办理场景、受益所有人自然人身份、满足的识别标准、权利关系类型、比例或控制方式、关系生效和终止依据。备案主体依3号令第十一条填报姓名、性别、国籍、出生日期、地址、联系方式、证件信息及权利关系类型和形成终止日期，并按标准补权益比例、收益权表决权比例或控制方式。金融机构依12号令第十八条识别留存身份信息和权利状况；透明度较高且信息披露充分的特定客户适用较少身份要素，但该分支不能反向缩减备案信息。形成日期不是录入日，而是最终拥有、实际控制或最终获益的法律关系生效时间，应回到章程、合伙协议、股东决议或权利转让协议。缺少生效文件时不能编造日期，也不能用发现日替代。
