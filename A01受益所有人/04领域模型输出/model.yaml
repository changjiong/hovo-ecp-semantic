    preconditions:
      source_text: 仅在同一自然人未满足最终权益≥25%的标准一前提下，进一步判断标准二与三的适用；权益满足标准一者不重复归类标准二。
      model_refs:
      - M.CandidateAssessment.meets_standard1
      explanation: 仅承接自然人识别所需的稳定事实或判断；备案、机构操作和风险治理口径仍留在固定领域知识。
      status: FORMALIZED
    conditions:
      source_text: 先判是否已按最终权益≥25%符合标准一；未达者分别核对收益分配和表决权的有效来源、期限及比例，任何一项最终享有≥25%即按标准二；仅该人未满足标准一且同时有可证实实际控制时才须同时记录标准二和标准三关系，不将经济收益、表决委托和股权混为一谈。
      model_refs:
      - M.MeetsBenefitVoteThreshold.expression
      - M.ReviewCandidateEvidence.criteria
      explanation: 仅承接自然人识别所需的稳定事实或判断；备案、机构操作和风险治理口径仍留在固定领域知识。
      status: MIXED
    result:
      source_text: 未按权益标准入选但最终收益或表决权任一达到25%（含本数）的自然人，按标准二识别，控制关系另记。
      model_refs:
      - M.CandidateAssessment.meets_standard2
      - M.UBOQualification.qualification_basis
      explanation: 仅承接自然人识别所需的稳定事实或判断；备案、机构操作和风险治理口径仍留在固定领域知识。
      status: FORMALIZED
    exceptions:
      source_text: 只知股东原始比例、获利转账或委托意向不证明最终收益/表决比例；收益合同未生效或授权过期时不能按25%认定。
      model_refs:
      - M.OtherRight.right_kind
      - M.OtherRight.end_status
      - M.ReviewCandidateEvidence.criteria
      explanation: 仅承接自然人识别所需的稳定事实或判断；备案、机构操作和风险治理口径仍留在固定领域知识。
      status: MANUAL
    missing_evidence:
      source_text: 收益分配/表决权协议、章程、可委托权种、有效期、分红凭证或决议/投票记录、受让人与对象对应。
      model_refs:
      - M.OtherRight.evidence
      - M.ReviewCandidateEvidence.criteria
      explanation: 仅承接自然人识别所需的稳定事实或判断；备案、机构操作和风险治理口径仍留在固定领域知识。
      status: FORMALIZED
    effective_period:
      source_text: 以各权利实际生效及终止日判断；既有标准一者不重复套仅限未达标准一的标准二。
      model_refs:
      - M.OtherRight.effective_from
      - M.OtherRight.end_status
      explanation: 仅承接自然人识别所需的稳定事实或判断；备案、机构操作和风险治理口径仍留在固定领域知识。
      status: FORMALIZED
