- question_id: K.Q.04
  question: 谁按收益权或表决权标准成为受益所有人？
  answer: 收益权和表决权分别聚合、阈值判断并与实际控制事实并存。 标准二解决名义股权与实际获益、投票权分离的问题。对每个候选自然人先判断其是否已满足标准一；只有该自然人未满足标准一，才进入标准二。随后分别查明其最终享有的股权或合伙权益收益权比例和表决权比例，包括代理持股、收益权转让、投票权委托和其他协议安排。收益权是取得股权或合伙权益分红、增值等收益的权利，不等同于一般交易收入或劳动报酬；表决权是对主体治理事项行使投票的权利。收益权或表决权任一项达到或超过25%，该自然人即按标准二成为受益所有人，两项比例分别保留。若同一自然人的收益权和表决权安排同时使其实际控制主体，应同时记录标准二和标准三；若其已经按标准一达标，则按标准一记录该人的关系，但仍须保留支持判断的协议证据。名义持股比例不能替代权利归属，口头陈述或协议缺页不能支撑最终权利比例。
