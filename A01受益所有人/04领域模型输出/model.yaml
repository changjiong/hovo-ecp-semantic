  "content_version": "2026-09-28.business-v1.0.0.draft.1",
  "name": "A01受益所有人业务领域模型",
  "domain_name": "受益所有人识别",
  "domain_purpose": "以纯业务视角表达自然人、组织、分支、信托、资管产品之间的权益、收益、表决、控制、角色和有效时间关系，以及据此形成受益所有人人选的稳定业务判断；备案流程、BOMIS差异报告、AML风险治理和机构审批仅作为外部上下文或范围边界。",
