- question_id: K.Q.02
  question: 备案主体能否承诺免报？
  answer: 四项并列条件、承诺、失效事件与30日期限。 承诺免报是3号令下减少备案填报的分支，不是免于识别受益所有人，也不是12号令第十条所称金融机构免于识别。办理时按四个条件逐项核对，且四项必须同时成立：注册资本或出资额不超过1000万元人民币（等于1000万元也满足；外币须为等值金额）；股东或合伙人全部为自然人；不存在股东、合伙人以外的自然人实际控制主体或从主体获取收益；不存在通过股权、合伙权益以外的方式实施控制或获取收益。第三项检查“谁在股东、合伙人之外”，第四项检查“是否存在股权、合伙权益之外的控制或获益安排”，不能合并成只看股东名册的一项。符合者须作出真实承诺后才能免于备案；不符合、承诺内容不实或后来不再符合的，不能停留在免报状态，后者应自条件失效之日起30日内备案。外国公司及其分支机构不适用该承诺免报分支，其在本国享有的申报豁免也不适用于中国。即使企业完成了承诺免报，金融机构为其办理客户尽调时仍按12号令识别核实；金融机构是否可免于识别须另按12号令第十条判断。限定材料没有规定外币折算所用汇率和日期，外币资本接近边界时不得自定。
