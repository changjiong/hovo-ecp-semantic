issues:
- id: M.Gap.EvidenceConflict
  kind: MODEL_GAP
  statement: 具体客户的代持效力、最终权利归属或实际控制证据可能冲突；未取得并核对案件材料前，不确认受影响自然人及关系形成时点。
  affects:
  - ISSUE.A01.KF.EVIDENCE_CONFLICT
  - RULE.A01.KF.NOMINEE
