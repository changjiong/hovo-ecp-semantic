- question_id: K.Q.21
  question: 3号令和12号令何时生效、如何过渡，哪些违法类型对应何种整改或责任？
  answer: 行为时点选版本，再映射违法类型和法务复核。 3号令自2024年11月1日施行，既有备案主体过渡至2025年11月1日前；未按规定备案按企业登记管理行政法规处理，备案不准确经责令仍拒不改正可处5万元以下罚款。12号令自2026年1月20日施行，旧235号和164号文件同时废止，不一致时按12号令；存量金融机构客户按第三十九条分6个月、2年及不动户例外治理。金融机构材料可靠性充分性明显不足、理由明显不合理、未持续更新、未加强、未查询核对或未按时完成等，可责令限改、警告或处20万元以下罚款；未开展或未实质开展、简化豁免与风险明显不匹配等严重情形处20万元以上200万元以下罚款。风险管理、差异反馈和内控缺陷另有责任条款；高质量差异报告、协助准确备案更新、持续准确识别复杂情形等只能作为从轻减轻因素，不免除基础义务。具体执法仍依被引用的反洗钱法及企业登记行政法规，本次材料未包含这些全文。
