  facets:
    scope:
      source_text: 公司、合伙企业、法人及非法人组织的直接和间接股权、股份或合伙权益；外国公司分支按所属外国公司计算。
      model_refs:
      - M.Process.G1.trigger
      explanation: 流程固定主体、用途和判断时点，并按该规则的适用对象选择对应机制。
      status: FORMALIZED
    preconditions:
      source_text: 固定判断时点，取得完整持有链、每层比例和权益类型，穿透到自然人，并确认比例可归属于同一自然人。
      model_refs:
      - M.Identification.acyclic
      - M.Identification.rights
      - M.Identification.structure_complete
      - M.Identification.subject
      - M.PersonAssessment.as_of
      - M.PersonAssessment.equity_ratio
      - M.PersonAssessment.known_equity_lower_bound
      - M.PersonAssessment.known_equity_paths
      - M.PersonAssessment.path_products
      - M.PersonAssessment.person
      - M.PersonAssessment.standard1
      - M.PersonAssessment.standard2
      - M.PersonAssessment.standard3
      explanation: 这些输入逐项承载前提事实；未核实资料保持未知，由所列机制暂停依赖判断。
      status: FORMALIZED
    conditions:
      source_text: 逐路径相乘，同一自然人多路径相加；最终拥有比例达到或超过25%即达标，25%包含在内。逐人判断并保留全部达标者。
      model_refs:
      - M.Constraint.RightHolder.expression
      - M.Constraint.RightParty.expression
      - M.Constraint.RightRatio.expression
      - M.Constraint.RightTarget.expression
      - M.Rule.EquityPaths.expression
      - M.Rule.EquityTotal.expression
      - M.Rule.KnownEquityLowerBound.expression
      - M.Rule.KnownEquityPaths.expression
      - M.Rule.KnownStandard1Candidate.expression
      - M.Rule.PersonQualified.expression
      - M.Rule.Standard1.expression
      - M.Rule.UseStandard2.expression
