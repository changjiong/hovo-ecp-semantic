- question_id: K.Q.17
  question: 如何查询核对备案信息，查不到信息时怎么办？
  answer: 查询故障、免报、未备案和差异四类状态分开。 先核实客户组织形式，确认其是否属于备案范围，再使用机构自行识别出的受益所有人资料进行查询核对。查询结果要回答人员、身份和权利信息是否一致，不能把系统有记录等同于识别正确。查不到时继续区分：不在备案范围、符合承诺免报、确实应备案但未备案，或仅为权限、流水失效、系统失败。只有事实支持应备案未备案时，进入提示客户备案、仍未备案再报告的分支；技术失败和免报不能直接判成违法未备案。查询存在差异则转入重大性、沟通更正和报告处理。
