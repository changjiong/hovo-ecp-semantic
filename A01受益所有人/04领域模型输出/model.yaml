- knowledge_rule_id: RULE.A01.KF.IDENTITY
  question_ids:
  - Q.A01.S56
  - Q.A01.S57
  model_ids:
  - M.NaturalPerson
  - M.Evidence
  - M.CandidateAssessment
  - M.ReviewCandidateEvidence
  status: PARTIAL
  gap_ids:
  - M.Gap.ProposedPolicy
  facets:
    scope:
      source_text: 机构一般客户身份与权利状况、经官方验证高透明度客户身份字段例外；备案字段另按2024年第3号令第十一条。
      model_refs:
      - M.NaturalPerson
      - M.CandidateAssessment
      explanation: 仅承接自然人识别所需的稳定事实或判断；备案、机构操作和风险治理口径仍留在固定领域知识。
      status: FORMALIZED
    preconditions:
      source_text: 一般非自然人客户的机构受益所有人识别与备案填报字段分开；机构透明客户具有第十八条特定较少身份字段例外，须先有官方透明性质核验证据。
      model_refs:
      - M.CandidateAssessment.target_organization
      - M.CandidateAssessment.as_of
      explanation: 仅承接自然人识别所需的稳定事实或判断；备案、机构操作和风险治理口径仍留在固定领域知识。
      status: FORMALIZED
    conditions:
      source_text: 区分识别谁、为何及何时有权：一般客户留存自然人姓名、性别、国籍、出生日期、身份证明类别号码与有效期限、权利类型、比例/控制方式和形成终止时间；仅对上市及经官方核实的特定高透明国企客户，可按第十八条至少留姓名、性别、国籍、出生年月及可识别身份照片；身份优先官方渠道，不能用时身份证件及补充材料；权利以客户资料为基础并按风险核对官方、公开、机构发现信息。确属低风险才可采信客户权利信息；部分佐证足够时记录取舍理由。另外，备案主体按照2024年第3号令第十一条逐人填报经常居住地或工作单位地址、联系方式，及证件有效期限；该备案字段不与机构一般识别留存字段混同。
      model_refs:
      - M.ReviewCandidateEvidence.criteria
      explanation: 仅承接自然人识别所需的稳定事实或判断；备案、机构操作和风险治理口径仍留在固定领域知识。
      status: MANUAL
    result:
      source_text: 逐人留存机构要求的身份、权利类型、比例或控制方式及有效时间，以风险相称可靠来源完成合理核实；备案另按第3号令第十一条填字段。
      model_refs:
      - M.CandidateAssessment.assessment_state
      - M.IdentificationConclusion
      explanation: 仅承接自然人识别所需的稳定事实或判断；备案、机构操作和风险治理口径仍留在固定领域知识。
      status: FORMALIZED
    exceptions:
      source_text: 仅客户自报、第三方股权比例或身份证复印件在可得官方独立渠道且有冲突时不足；信息字段齐全不代表权利已核实。
      model_refs:
      - M.Evidence.verification_state
      - M.ReviewCandidateEvidence.criteria
      explanation: 仅承接自然人识别所需的稳定事实或判断；备案、机构操作和风险治理口径仍留在固定领域知识。
      status: MANUAL
    missing_evidence:
      source_text: 登记章程/合伙协议、股东董事及管理名单、有效身份件与官方核验、权利文件、日期、交叉核实及风险取舍记录。
      model_refs:
      - M.Evidence
      - M.ReviewCandidateEvidence.required_evidence
      explanation: 仅承接自然人识别所需的稳定事实或判断；备案、机构操作和风险治理口径仍留在固定领域知识。
      status: FORMALIZED
    effective_period:
      source_text: 资料与权利状态必须同一适用时点；缺生效日时不可自动填默认日。
      model_refs:
      - M.CandidateAssessment.as_of
      - M.OwnershipLink.effective_from
      explanation: 仅承接自然人识别所需的稳定事实或判断；备案、机构操作和风险治理口径仍留在固定领域知识。
      status: FORMALIZED
  modeling_classification:
  - CORE_STRUCTURE
  - DOMAIN_DECISION
  reason: 现实自然人身份、权利事实和各自证据必须分离；身份同一性及证据可靠性决定候选结论能否成立，字段齐全并不充分。
