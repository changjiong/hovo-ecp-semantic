- question_id: K.Q.22
  question: 备案人员如何按所在地指引完成填报？
  answer: 所在地、主体类别、登录、人员关系录入和回执。 办理前先完成业务判断：确认主体类型、全部受益所有人、身份与权利信息；页面选择只是落实已有判断。北京提供开办/变更同步办理及存量企业入口；深圳分别组织公司、合伙企业和外国公司分支机构流程，登录资格及界面步骤仅按本地指引说明。符合承诺免报或国有公司备案条件的走相应路径；自行填报时逐人登记，可一人包含多项关系，也可多名人员。填完检查人员是否漏报、关系日期是否有依据，再提交并保存办理结果。材料中的截图、页面名称和登录方式是提供文件的操作说明，不宣称已核验2026年9月线上界面。
