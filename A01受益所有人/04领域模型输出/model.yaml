- question_id: K.Q.08
  question: 分支机构的受益所有人如何识别？
  answer: 国内沿用/复用与外国公司穿透+高管叠加。 先判断分支所属主体是国内法人、非法人组织还是外国公司，并把备案与金融机构识别分开。第二版备案指南说明，境内公司、合伙企业的分支机构当前暂无需单独备案；但在金融机构客户尽调中，12号令要求国内分支机构一般沿用其所属法人或非法人组织的受益所有人。只有所属主体本身已经是该金融机构客户，且该机构已按规定完成客户尽调时，才可以重复利用已有受益所有人信息；所属主体不是本机构客户或尽调未完成时，不能把“沿用”误写成无条件复用。外国公司分支机构则有叠加规则：按标准一至三（无人满足时含兜底）识别所属外国公司的受益所有人，同时纳入分支机构高级管理人员。3号令用于备案，第二版指南将操作要求明确为至少一名最高层级高级管理人员；12号令用于金融机构识别，明确至少一名分支机构高级管理人员。外国公司在本国享有的受益所有人申报豁免不适用于中国。应取得外国公司身份、章程、股东和高管资料，以及分支营业执照和高管信息；缺少所属外国公司结构时，不能只报分支负责人结束穿透。
