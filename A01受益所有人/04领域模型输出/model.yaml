- question_id: K.Q.09
  question: 信托和资产管理产品如何识别受益所有人？
  answer: 信托当事人、最终控制、产品简化和材料采信。 信托和资产管理产品不是简单套用公司股东清单。对信托，先列出委托人、受托人、受益人和监察人（如有），再识别对信托行使最终有效控制的其他自然人；任一信托当事人为非自然人时，须逐一、逐层追溯到对信托行使最终有效控制的自然人。最终有效控制包括处分信托财产、决定投资或分配方案、变更或终止信托、变更受益人或其条件、任命或变更受托人。未列出具体受益人时应记录受益人范围或潜在受益人类别，不能虚构具体姓名。财富管理服务信托、公益慈善信托、民事信托和外国信托按上述完整口径识别；财富管理服务信托以外的其他资产服务信托只有在所有权和控制权结构简单且洗钱和恐怖融资风险较低时才可简化。投资顾问、律师、会计师等专业服务人员须获取留存基本信息，但仅凭受聘身份不自动成为受益所有人。对资产管理信托等资管产品，应基于风险、结合具体产品参照第八条识别。以金融机构为管理人或受托人、公开募集或发行且依法备案或登记的产品，在提供资金托管等金融服务时可简化，将管理产品的自然人认定为受益所有人；其他产品须先充分评估风险，低风险企业年金、职业年金等也可简化。信托公司提供的结果只有在接收机构能够确信其反洗钱体系健全且有效履责时才可采信；有明显疑点或识别瑕疵应要求重新识别，拒不提供、严重违法、重大风险或体系性缺陷时采取风险管理措施。多人团队或委员会下“管理资产管理产品的自然人”，按2026-09-18用户已答口径取产品合同或管理职责文件指定的投资主办人（产品经理）并记录职责依据；不得自行以管理机构法定代表人或任一经办人替代（knowledge 2.2.0）。
