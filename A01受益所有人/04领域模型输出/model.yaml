  - K.Q.19.CORRECT
  issue_ids: []
  on_missing: BLOCK
  basis_ids:
  - K.R.17
  - K.R.18
  - K.R.19
  - K.R.19.CORRECT
  - K.R.19.CLOSE
  nature: BUSINESS_DISCRETION
  criteria:
  - 先与客户沟通核实差异成因，区分机构错误、备案错误和近期变化。
  - 核实客户已经实际更正，并用重新查询或核验的结果复核一致；承诺或报告办结不替代这两项事实。
  - 日期年月差异与影响认定分别记录；近期更新期限标记不覆盖重大性和报告义务。
  record_fields:
  - M.Difference.cause
  - M.Difference.affects_ubo
  - M.Difference.customer_corrected
  - M.Difference.recheck_consistent
  - M.Difference.reason
  review_requirements: 核对主体、人员、字段、关系时间和原请求关联；存在身份匹配或事实疑点继续补证，不虚构一致。
- id: M.Judgment.Authority
  name: 主体分类、用途授权和责任适用核查
  description: 核对主体登记类别、所引用条文和法定用途，免识别或简化不得由相似名称扩张。；具体查询须有适用机构权限及经办授权，声明和返回方式须符合对应条件，后续使用限于授权用途并保密。；处罚适用所需上位法不齐时只形成责任风险和补充清单，不宣称已完整确定处罚。
