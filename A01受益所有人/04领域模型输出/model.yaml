rule_coverage:
- knowledge_rule_id: K.R.01
  question_ids:
  - K.Q.01
  model_ids:
  - M.Rule.FilingScope
  - M.Rule.CddScope
  - M.Judgment.Authority
  status: PARTIAL
  gap_ids:
  - M.Gap.SEMANTIC_REVIEW
  - M.Gap.REV.IDENTITY.MISSING_ORDER11
  facets:
    scope:
      source_text: 截至2026-09-15的中国境内受益所有人备案办理，以及12号令下金融机构对非自然人客户的受益所有人识别核实。
      model_refs:
      - M.Process.G1.trigger
      explanation: 流程固定主体、用途和判断时点，并按该规则的适用对象选择对应机制。
      status: FORMALIZED
    preconditions:
      source_text: 取得主体登记身份和组织形式、业务关系、承办机构是否属于客户尽调义务机构、适用时点。
      model_refs:
      - M.Access.purpose
      - M.Identification.as_of
      - M.Identification.business_relation
      - M.Identification.evidence
      - M.Identification.institution_in_scope
      - M.Identification.subject
      - M.Subject.kind
      explanation: 这些输入逐项承载前提事实；未核实资料保持未知，由所列机制暂停依赖判断。
      status: FORMALIZED
    conditions:
      source_text: 分别判断3号令备案主体范围和12号令非自然人客户识别范围；公司、合伙企业、外国公司分支机构进入备案判断，金融机构对非自然人客户进入识别核实，个体工商户从两项本专项要求中排除。
      model_refs:
      - M.Judgment.Authority.criteria
      - M.Rule.CddScope.expression
      - M.Rule.FilingScope.expression
      explanation: 由判断备案适用范围、判断金融机构识别适用范围、主体分类、用途授权和责任适用核查共同表达条件，人工证据准则与可计算判断分开。
      status: MIXED
    result:
      source_text: 输出备案适用、金融机构识别适用、两者均适用或本专项均不适用四类结果，并注明责任主体；当前暂无需备案的其他非自然人客户仍可进入金融机构识别。
      model_refs:
      - M.Access.institution_authorized
      - M.Access.lawful_purpose
      - M.Access.operator_authorized
      - M.Identification.category_verified
      - M.Identification.cdd_applicable
      - M.Identification.filing_applicable
      explanation: 判断结果落到这些业务字段；流程和状态仍区分请求、反馈与实质业务结论。
      status: FORMALIZED
    exceptions:
      source_text: 第二版指南所述“暂无需备案”属于当前办理范围说明；信托、资管、分支和12号令第十、十一条主体另走专门分支。
      model_refs:
      - M.Judgment.Authority.criteria
      - M.Rule.CddScope.expression
      - M.Rule.FilingScope.expression
      explanation: 第二版指南所述“暂无需备案”属于当前办理范围说明；信托、资管、分支和12号令第十、十一条主体另走专门分支。 对应规则分支、证据准则和未决事项共同限制可得结论。
      status: FORMALIZED
    missing_evidence:
      source_text: 组织形式或业务关系未知时不分流；缺2025年第11号令时不能穷举义务机构，补充该令后再封闭机构清单。
      model_refs:
      - M.Judgment.Authority.on_missing
      - M.Rule.CddScope.on_unknown
      - M.Rule.FilingScope.on_unknown
      explanation: 组织形式或业务关系未知时不分流；缺2025年第11号令时不能穷举义务机构，补充该令后再封闭机构清单。 缺证不得用默认值补足。
      status: FORMALIZED
    effective_period:
      source_text: 3号令自2024-11-01施行；12号令自2026-01-20施行；第二版备案指南日期为2026-01。本规则按2026-09-15在限定材料内整理。
      model_refs:
      - M.Identification.as_of
      explanation: 3号令自2024-11-01施行；12号令自2026-01-20施行；第二版备案指南日期为2026-01。本规则按2026-09-15在限定材料内整理。 先固定业务时点和适用版本，不把请求或记录时间替代实际生效。
      status: FORMALIZED
- knowledge_rule_id: K.R.02
  question_ids:
  - K.Q.02
  model_ids:
  - M.Rule.FilingExemption
  status: PARTIAL
  gap_ids:
  - M.Gap.SEMANTIC_REVIEW
  - M.Gap.REV.IDENTITY.FX_EQUIV
  facets:
    scope:
      source_text: 3号令备案主体中的公司、合伙企业承诺免报判断；不包括金融机构是否免于识别。
      model_refs:
      - M.Process.G1.trigger
      explanation: 流程固定主体、用途和判断时点，并按该规则的适用对象选择对应机制。
      status: FORMALIZED
    preconditions:
      source_text: 取得注册资本或出资额及币种、全体股东合伙人名册、代持和协议安排、控制与收益事实，并确认不是外国公司分支机构。
      model_refs:
      - M.Filing.all_natural_holders
      - M.Filing.as_of
      - M.Filing.capital_cny
      - M.Filing.no_external_beneficiary
      - M.Filing.no_other_control_benefit
      - M.Filing.promise_truthful
      - M.Subject.kind
      explanation: 这些输入逐项承载前提事实；未核实资料保持未知，由所列机制暂停依赖判断。
      status: FORMALIZED
    conditions:
      source_text: 资本或出资额不超过1000万元等值、股东合伙人全为自然人、无股东合伙人外自然人控制或获益、无股权合伙权益外控制或获益，四项同时成立且主体作出真实承诺。
      model_refs:
      - M.Rule.FilingExemption.expression
      explanation: 由承诺免报条件共同表达条件，人工证据准则与可计算判断分开。
      status: FORMALIZED
    result:
      source_text: 可承诺免于提交具体备案信息；任一条件不成立则自行填报；后来失去条件时自失效之日起30日内备案。
      model_refs:
      - M.Filing.promise_exempt
      explanation: 判断结果落到这些业务字段；流程和状态仍区分请求、反馈与实质业务结论。
      status: FORMALIZED
    exceptions:
      source_text: 外国公司及其分支机构不适用；承诺免报不免除金融机构按12号令识别核实，也不同于12号令第十条免于识别。
      model_refs:
      - M.Rule.FilingExemption.expression
      explanation: 外国公司及其分支机构不适用；承诺免报不免除金融机构按12号令识别核实，也不同于12号令第十条免于识别。 对应规则分支、证据准则和未决事项共同限制可得结论。
      status: FORMALIZED
    missing_evidence:
      source_text: 任一事实缺失即不得承诺；外币接近边界且缺折算依据时暂停结论并补充主管认可的折算时点和汇率。
      model_refs:
      - M.Rule.FilingExemption.on_unknown
      explanation: 任一事实缺失即不得承诺；外币接近边界且缺折算依据时暂停结论并补充主管认可的折算时点和汇率。 缺证不得用默认值补足。
      status: FORMALIZED
    effective_period:
      source_text: 3号令自2024-11-01施行；第二版备案指南按2026-01版本用于解释。本规则按2026-09-15整理。
      model_refs:
      - M.Filing.as_of
      explanation: 3号令自2024-11-01施行；第二版备案指南按2026-01版本用于解释。本规则按2026-09-15整理。 先固定业务时点和适用版本，不把请求或记录时间替代实际生效。
      status: FORMALIZED
