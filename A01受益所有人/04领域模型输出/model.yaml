- question_id: K.Q.06
  question: 三项标准均无人满足时如何处理？
  answer: 前三项均明确无人满足才允许进入兜底。 兜底只在通过充分证据检查后，能够判断确实不存在标准一、二、三三种情形时使用；“没有人满足”与“材料不全所以无法确认”是两种不同状态。先完成所有权穿透和比例计算，再检查收益权、表决权安排和实际控制事实。只有三类结果均为无人满足，才从主体中负责日常经营管理的人员里确定受益所有人。第二版指南要求至少备案一名最高层级的日常经营管理人员：公司可以是法定代表人、董事长、董事、经理或章程规定的其他日常经营管理人员；合伙企业可以是执行合伙事务的自然人，包括执行事务合伙人或其自然人代表，以及合伙协议规定的其他人员。该人员是法定兜底识别对象，不代表其因此成为公司的实际控制人。若已有一名自然人恰好达到25%，或存在标准二、三人员，就不能用管理人员替换该人员；仍应识别全部符合标准的人。若多名人员处于同一最高管理层级，按公司章程（合伙企业按合伙协议）规定的层级顺位取第一顺位并记录依据（2026-09-18用户已答口径；knowledge 2.2.0）。
