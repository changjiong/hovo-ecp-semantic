  question: 实时或批量核验何时才算取得业务结果？
  answer: 初步接收、逐户业务反馈、批量夜间结果。 先选择实时或夜间批量，确认每日可用额度。发送后先观察初步校验是否成功，再等待对应业务反馈；批量须分清首条反馈与批处理结果，逐主体关联原核验流水。收到反馈后还要检查具体核验结论及错误信息，不能把传输成功或批次被接收统一写成全部一致。
