- question_id: K.Q.16
  question: 业务关系存续期间出现哪些事件应审核或更新受益所有人信息，复核频率如何确定？
  answer: 事件触发复核与内部频率政策分开。 金融机构应持续关注客户整体状况和交易。股权、合伙权益、收益权、表决权或控制权重大变化可能影响受益所有权，法定代表人、董事或高管重大变化可能产生影响，信托当事人变化，持续尽调中确需再次识别核实，或其他可能影响受益所有权的情形，均触发审核；只有审核显示需要时才更新正式信息。第二十一条允许对加强情形提高审核更新频率，但本次7份权威输入没有给出适用于全部客户的固定周期，不能自定季度或年度频率。备案主体的信息变化另受3号令30日更新义务约束。金融机构未按规定在存续期间审核或更新会落入法律责任条款。
