- id: M.Rule.ReportContent
  name: 按报告类别检查内容和操作
  description: 四类报备、两类补充、三类审批和确认无差异按各自条件处理；新增修改删除的原新人员边界明确，非重大接口报备实施口径未确认时不发送。
  inputs:
  - name: subtype
    label: 接口具体报告类型
    binding: M.DifferenceReport.subtype
    type: Enum
    values:
    - 非重大差异报备
    - 机构自行更正
    - 主体自行备案
    - 主体自行更正
    - 主体信息补充
    - 经营主体未备案
    - 信息获取完整
    - 部分信息缺失
    - 客户身份存疑
    - 确认无差异
    cardinality:
      min: 0
      max: 1
  - name: operation
    label: 本次报文操作
    binding: M.DifferenceReport.operation
    type: Enum
    values:
    - 新增人员
    - 修改人员
    - 删除人员
    - 主体填报类型
    - 不提交人员变更
    cardinality:
      min: 0
      max: 1
  - name: code
    label: 主体代码齐备
    binding: M.DifferenceReport.subject_code_present
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: analysis
    label: 分析报告齐备
    binding: M.DifferenceReport.analysis_present
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: support
    label: 佐证材料齐备
    binding: M.DifferenceReport.support_present
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: old
    label: 原人员信息齐备
    binding: M.DifferenceReport.old_person_present
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: new
    label: 新人员信息齐备
    binding: M.DifferenceReport.new_person_present
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: new_name
    label: 新增人员姓名齐备
    binding: M.DifferenceReport.new_person_name_present
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: org_change
    label: 提交企业信息变更
    binding: M.DifferenceReport.organization_change
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: person_change
    label: 提交人员变更
    binding: M.DifferenceReport.person_change
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: nonmajor_policy
    label: 非重大接口报备实施口径已确认
    binding: M.DifferenceReport.nonmajor_policy_confirmed
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: consistent
    label: 核验结果一致
    binding: M.DifferenceReport.verification_consistent
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: in_system
    label: 主体在系统中
    binding: M.DifferenceReport.subject_in_system
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: empty
    label: 系统中人员为空
    binding: M.DifferenceReport.system_people_empty
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: promise_state
    label: 承诺免报或国有公司对应条件成立
    binding: M.DifferenceReport.promise_or_state_condition
    type: Boolean
    cardinality:
      min: 0
      max: 1
  result:
    type: Boolean
    cardinality:
      min: 0
      max: 1
  expression:
    op: if
    args:
    - op: eq
      args:
      - input: subtype
      - literal:
          type: Text
          value: 客户身份存疑
    - op: and
      args:
      - op: and
        args:
        - input: code
        - input: analysis
        - input: support
      - op: not
        args:
        - input: org_change
      - op: not
        args:
        - input: person_change
    - op: if
      args:
      - op: eq
        args:
        - input: subtype
        - literal:
            type: Text
            value: 部分信息缺失
      - op: and
        args:
        - op: and
          args:
          - input: code
          - input: analysis
          - input: support
        - op: eq
          args:
          - input: operation
          - literal:
              type: Text
              value: 新增人员
        - input: new_name
        - op: not
          args:
          - input: org_change
      - op: if
        args:
        - op: eq
          args:
          - input: subtype
          - literal:
              type: Text
              value: 信息获取完整
        - op: and
          args:
          - op: and
            args:
            - input: code
            - input: analysis
            - input: support
          - op: or
            args:
            - op: and
              args:
              - op: eq
                args:
                - input: operation
                - literal:
                    type: Text
                    value: 新增人员
              - input: new
            - op: and
              args:
              - op: eq
                args:
                - input: operation
                - literal:
                    type: Text
                    value: 修改人员
              - input: old
              - input: new
            - op: and
              args:
              - op: eq
                args:
                - input: operation
                - literal:
                    type: Text
                    value: 删除人员
              - input: old
              - op: not
                args:
                - input: new
            - op: eq
              args:
              - input: operation
              - literal:
                  type: Text
                  value: 主体填报类型
        - op: if
          args:
          - op: contains
            args:
            - op: list
              args:
              - literal:
                  type: Text
                  value: 机构自行更正
              - literal:
                  type: Text
                  value: 主体自行备案
              - literal:
                  type: Text
                  value: 主体自行更正
            - input: subtype
          - op: and
            args:
            - input: code
            - op: not
              args:
              - input: org_change
            - op: not
              args:
              - input: person_change
          - op: if
            args:
            - op: eq
              args:
              - input: subtype
              - literal:
                  type: Text
                  value: 非重大差异报备
            - op: and
              args:
              - input: code
              - input: analysis
              - input: nonmajor_policy
            - op: if
              args:
              - op: eq
                args:
                - input: subtype
                - literal:
                    type: Text
                    value: 确认无差异
              - op: and
                args:
                - input: code
                - input: consistent
                - op: not
                  args:
                  - input: org_change
                - op: not
                  args:
                  - input: person_change
              - op: if
                args:
                - op: eq
                  args:
                  - input: subtype
                  - literal:
                      type: Text
                      value: 主体信息补充
                - op: and
                  args:
                  - input: in_system
                  - input: empty
                  - input: promise_state
                  - input: code
                  - input: new
                  - op: eq
                    args:
                    - input: operation
                    - literal:
                        type: Text
                        value: 新增人员
                - op: and
                  args:
                  - op: not
                    args:
                    - input: in_system
                  - input: code
                  - input: new
                  - op: eq
                    args:
                    - input: operation
                    - literal:
                        type: Text
                        value: 新增人员
  on_unknown: PROPAGATE
  basis_ids:
  - K.R.24
  - K.R.24.REPORT
  question_ids:
  - K.Q.24
  - K.Q.24.REPORT
  depends_on: []
  result_binding: M.DifferenceReport.required_content_complete
  business_meaning: 四类报备、两类补充、三类审批和确认无差异按各自条件处理；新增修改删除的原新人员边界明确，非重大接口报备实施口径未确认时不发送。
- id: M.Rule.ReportSubmit
  name: 差异报告提交前提
  description: 具体报告类型适用、对应内容齐备及应附文件已可用后提交；人员身份存疑不能用编造身份补齐。
  inputs:
  - name: supported
    label: 具体类型与当前接口允许范围一致
    binding: M.DifferenceReport.type_supported
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: content
    label: 具体类型所需内容齐备
    binding: M.DifferenceReport.required_content_complete
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: attachments
    label: 应附文件已取得可用标识
    binding: M.DifferenceReport.attachments_usable
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: subtype
    label: 接口具体报告类型
    binding: M.DifferenceReport.subtype
    type: Enum
    values:
    - 非重大差异报备
    - 机构自行更正
    - 主体自行备案
    - 主体自行更正
    - 主体信息补充
    - 经营主体未备案
    - 信息获取完整
    - 部分信息缺失
    - 客户身份存疑
    - 确认无差异
    cardinality:
      min: 0
      max: 1
  result:
    type: Boolean
    cardinality:
      min: 0
      max: 1
  expression:
    op: and
    args:
    - input: supported
    - input: content
    - op: or
      args:
      - op: contains
        args:
        - op: list
          args:
          - literal:
              type: Text
              value: 机构自行更正
          - literal:
              type: Text
              value: 主体自行备案
          - literal:
              type: Text
              value: 主体自行更正
          - literal:
              type: Text
              value: 确认无差异
        - input: subtype
      - input: attachments
  on_unknown: PROPAGATE
  basis_ids:
  - K.R.24
  - K.R.24.REPORT
  question_ids:
  - K.Q.24
  - K.Q.24.REPORT
  depends_on:
  - M.Rule.ReportContent
  result_binding: M.DifferenceReport.submit_allowed
  business_meaning: 具体报告类型适用、对应内容齐备及应附文件已可用后提交；人员身份存疑不能用编造身份补齐。
- id: M.Rule.CaseQuery
  name: 案例编号取得后查询审批
  description: 取得申请首反馈和案例编号后才查询审批，编号不是批准结论。
  inputs:
  - name: condition
    label: 申请条件已核实符合
    binding: M.BomisCase.conditions_met
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: first
    label: 首个反馈已收到
    binding: M.BomisCase.initial_feedback
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: number
    label: 案例编号已收到
    binding: M.BomisCase.number_received
    type: Boolean
    cardinality:
      min: 0
      max: 1
  result:
    type: Boolean
    cardinality:
      min: 0
      max: 1
  expression:
    op: and
    args:
    - input: condition
    - input: first
    - input: number
  on_unknown: PROPAGATE
  basis_ids:
  - K.R.24.CASE
  question_ids:
  - K.Q.24.CASE
  depends_on: []
  result_binding: M.BomisCase.may_query_approval
  business_meaning: 取得申请首反馈和案例编号后才查询审批，编号不是批准结论。
- id: M.Rule.ParameterContinuity
  name: 参数通知连续性
  description: 后续通知序号须接续已采用序号；首次必须核实完整快照，不能把缺期通知当完整参数。
  inputs:
  - name: current
    label: 本次通知序号
    binding: M.Parameters.sequence
    type: Integer
    cardinality:
      min: 1
      max: 1
  - name: previous
    label: 已采用的前次通知序号
    binding: M.Parameters.previous_sequence
    type: Integer
    cardinality:
      min: 0
      max: 1
  - name: initial
    label: 首次完整参数快照已核实
    binding: M.Parameters.initial_snapshot_verified
    type: Boolean
    cardinality:
      min: 0
      max: 1
  result:
    type: Boolean
    cardinality:
      min: 0
      max: 1
  expression:
    op: or
    args:
    - input: initial
    - op: eq
      args:
      - input: current
      - op: add
        args:
        - input: previous
        - literal:
            type: Integer
            value: 1
  on_unknown: PROPAGATE
  basis_ids:
  - K.R.24.PARAM
  question_ids:
  - K.Q.24.PARAM
  depends_on: []
  result_binding: M.Parameters.sequence_continuous
  business_meaning: 后续通知序号须接续已采用序号；首次必须核实完整快照，不能把缺期通知当完整参数。
- id: M.Rule.ParameterResend
  name: 参数缺期请求补发
  description: 发现缺期请求补发；连续性未知时保留待核实，不猜测可用参数。
  inputs:
  - name: continuous
    label: 通知序号连续
    binding: M.Parameters.sequence_continuous
    type: Boolean
    cardinality:
      min: 0
      max: 1
  result:
    type: Boolean
    cardinality:
      min: 0
      max: 1
  expression:
    op: not
    args:
    - input: continuous
  on_unknown: PROPAGATE
  basis_ids:
  - K.R.24.PARAM
  question_ids:
  - K.Q.24.PARAM
  depends_on:
  - M.Rule.ParameterContinuity
  result_binding: M.Parameters.resend_needed
  business_meaning: 发现缺期请求补发；连续性未知时保留待核实，不猜测可用参数。
- id: M.Rule.ParameterSend
  name: 参数完整且业务受理才发送
  description: 仅在参数完整和业务处于受理状态时发起请求。
  inputs:
  - name: continuous
    label: 通知序号连续
    binding: M.Parameters.sequence_continuous
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: accepting
    label: 业务处于受理状态
    binding: M.Parameters.business_accepting
    type: Boolean
    cardinality:
      min: 0
      max: 1
  result:
    type: Boolean
    cardinality:
      min: 0
      max: 1
  expression:
    op: and
    args:
    - input: continuous
    - input: accepting
  on_unknown: PROPAGATE
  basis_ids:
  - K.R.24.PARAM
  question_ids:
  - K.Q.24.PARAM
  depends_on:
  - M.Rule.ParameterContinuity
  result_binding: M.Parameters.send_allowed
  business_meaning: 仅在参数完整和业务处于受理状态时发起请求。
- id: M.Rule.FileUsable
  name: 附件取得实际应答后可用
  description: 真实上传业务应答对应本次传输且返回文件标识后才可关联；同步异步错误与待返回分别记录。
  inputs:
  - name: received
    label: 实际上传业务应答已收到
    binding: M.FileTransfer.response_received
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: matched
    label: 应答对应本次传输
    binding: M.FileTransfer.response_matched
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: id
    label: 已取得真实文件标识
    binding: M.FileTransfer.file_id_received
    type: Boolean
    cardinality:
      min: 0
      max: 1
  result:
    type: Boolean
    cardinality:
      min: 0
      max: 1
  expression:
    op: and
    args:
    - input: received
    - input: matched
    - input: id
  on_unknown: PROPAGATE
  basis_ids:
  - K.R.24.FILE
  question_ids:
  - K.Q.24.FILE
  depends_on: []
  result_binding: M.FileTransfer.usable
  business_meaning: 真实上传业务应答对应本次传输且返回文件标识后才可关联；同步异步错误与待返回分别记录。
- id: M.Rule.KnownEquityPaths
  name: 保留已证明的股权路径
  description: 只取身份、比例和有效期已有证明的路径，保留已知正向依据；不能据此宣称结构或名单完整。
  inputs:
  - name: rights
    label: 同一时点核实的直接权益集合
    binding: M.Identification.rights
    type: Ref
    target: M.Right
    cardinality:
      min: 0
      max: null
  - name: date
    label: 本项判断日期
    binding: M.PersonAssessment.as_of
    type: Date
    cardinality:
      min: 0
      max: 1
  - name: person
    label: 本项判断所涉自然人
    binding: M.PersonAssessment.person
    type: Ref
    target: M.Person
    cardinality:
      min: 1
      max: 1
  - name: subject
    label: 被识别主体
    binding: M.Identification.subject
    type: Ref
    target: M.Subject
    cardinality:
      min: 1
      max: 1
  result:
    type: Decimal
    cardinality:
      min: 0
      max: null
  expression:
    op: dag_path_products
    args:
    - query:
        from:
          input: rights
        as: known_edge
        where:
          op: and
          args:
          - op: is_known
            args:
            - input: known_edge
          - op: is_known
            args:
            - field:
                of:
                  input: known_edge
                name: holder_key
          - op: is_known
            args:
            - field:
                of:
                  input: known_edge
                name: target_key
          - op: is_known
            args:
            - field:
                of:
                  input: known_edge
                name: ratio
          - op: contains
            args:
            - op: list
              args:
              - literal:
                  type: Text
                  value: 股权
              - literal:
                  type: Text
                  value: 合伙权益
            - field:
                of:
                  input: known_edge
                name: right_kind
          - op: and
            args:
            - op: lte
              args:
              - field:
                  of:
                    input: known_edge
                  name: start
              - input: date
            - op: or
              args:
              - op: eq
                args:
                - field:
                    of:
                      input: known_edge
                    name: end_status
                - literal:
                    type: Text
                    value: OPEN
              - op: and
                args:
                - op: eq
                  args:
                  - field:
                      of:
                        input: known_edge
                      name: end_status
                  - literal:
                      type: Text
                      value: KNOWN
                - op: is_known
                  args:
                  - field:
                      of:
                        input: known_edge
                      name: end
                - op: gt
                  args:
                  - field:
                      of:
                        input: known_edge
                      name: end
                  - input: date
        select:
          input: known_edge
    - op: identity_key
      args:
      - input: person
    - op: identity_key
      args:
      - input: subject
    - literal:
        type: Text
        value: holder_key
    - literal:
        type: Text
        value: target_key
    - literal:
        type: Text
        value: ratio
  on_unknown: PROPAGATE
  basis_ids:
  - K.R.03
  question_ids:
  - K.Q.03
  depends_on: []
  result_binding: M.PersonAssessment.known_equity_paths
  business_meaning: 只取身份、比例和有效期已有证明的路径，保留已知正向依据；不能据此宣称结构或名单完整。
- id: M.Rule.KnownEquityLowerBound
  name: 已知股权路径形成下界
  description: 对已证明路径求和作为下界，不把尚未证明的部分填成零或称为最终总比例。
  inputs:
  - name: paths
    label: 已证明有效的股权路径乘积
    binding: M.PersonAssessment.known_equity_paths
    type: Decimal
    cardinality:
      min: 0
      max: null
  result:
    type: Decimal
    cardinality:
      min: 0
      max: 1
  expression:
    op: sum
    args:
    - input: paths
  on_unknown: PROPAGATE
  basis_ids:
  - K.R.03
  question_ids:
  - K.Q.03
  depends_on:
  - M.Rule.KnownEquityPaths
  result_binding: M.PersonAssessment.known_equity_lower_bound
  business_meaning: 对已证明路径求和作为下界，不把尚未证明的部分填成零或称为最终总比例。
- id: M.Rule.KnownStandard1Candidate
  name: 不完整结构中的已知达标候选
  description: 已有证据下界达到25%可记录该人的候选并核实；整体名单和最终总比例仍受结构完整性限制。
  inputs:
  - name: lower
    label: 已证明股权比例下界
    binding: M.PersonAssessment.known_equity_lower_bound
    type: Decimal
    cardinality:
      min: 0
      max: 1
  result:
    type: Boolean
    cardinality:
      min: 0
      max: 1
  expression:
    op: gte
    args:
    - input: lower
    - literal:
        type: Decimal
        value: 0.25
  on_unknown: PROPAGATE
  basis_ids:
  - K.R.03
  question_ids:
  - K.Q.03
  depends_on:
  - M.Rule.KnownEquityLowerBound
  result_binding: M.PersonAssessment.standard1_candidate
  business_meaning: 已有证据下界达到25%可记录该人的候选并核实；整体名单和最终总比例仍受结构完整性限制。
- id: M.Rule.Reverification
  name: 失效流水重新核验
  description: 核验流水失效时重新核验后查询；保存原请求和失效反馈，不能重用旧流水。
  inputs:
  - name: valid
    label: 核验流水在本次查询时仍有效
    binding: M.Query.verification_valid
    type: Boolean
    cardinality:
      min: 0
      max: 1
  result:
    type: Boolean
    cardinality:
      min: 0
      max: 1
  expression:
    op: not
    args:
    - input: valid
  on_unknown: PROPAGATE
  basis_ids:
  - K.R.23.CURRENT
  question_ids:
  - K.Q.23.CURRENT
