      - M.ControlArrangement.effective_from
      - M.ControlArrangement.end_status
      explanation: 仅承接自然人识别所需的稳定事实或判断；备案、机构操作和风险治理口径仍留在固定领域知识。
      status: FORMALIZED
  modeling_classification:
  - CORE_STRUCTURE
  - DOMAIN_DECISION
  reason: 控制安排的权限、作用、共同机制和有效期间是稳定事实；是否构成实际控制属于需要证据裁定的领域判断。
