    kind: DETERMINE
    uses:
    - M.Rule.ReportSubmit
    reads:
    - M.DifferenceReport.attachments_usable
    - M.DifferenceReport.required_content_complete
    - M.DifferenceReport.subtype
    - M.DifferenceReport.type_supported
    writes:
    - M.DifferenceReport.submit_allowed
    depends_on:
    - M.Step.G9.ReportContent
    on_missing: BLOCK
    description: 具体报告类型适用、对应内容齐备及应附文件已可用后提交；人员身份存疑不能用编造身份补齐。
    basis_ids:
    - K.R.24
    - K.R.24.REPORT
  - id: M.Step.G9.CaseQuery
    name: 案例编号取得后查询审批
    kind: DETERMINE
    uses:
    - M.Rule.CaseQuery
    reads:
    - M.BomisCase.conditions_met
    - M.BomisCase.initial_feedback
    - M.BomisCase.number_received
    writes:
    - M.BomisCase.may_query_approval
    depends_on: []
    on_missing: BLOCK
    description: 取得申请首反馈和案例编号后才查询审批，编号不是批准结论。
    basis_ids:
    - K.R.24.CASE
  - id: M.Step.G9.ParameterContinuity
    name: 参数通知连续性
    kind: DETERMINE
    uses:
    - M.Rule.ParameterContinuity
    reads:
    - M.Parameters.initial_snapshot_verified
    - M.Parameters.previous_sequence
    - M.Parameters.sequence
    writes:
    - M.Parameters.sequence_continuous
    depends_on: []
    on_missing: BLOCK
    description: 后续通知序号须接续已采用序号；首次必须核实完整快照，不能把缺期通知当完整参数。
    basis_ids:
    - K.R.24.PARAM
  - id: M.Step.G9.ParameterResend
    name: 参数缺期请求补发
    kind: DETERMINE
    uses:
    - M.Rule.ParameterResend
    reads:
    - M.Parameters.sequence_continuous
    writes:
    - M.Parameters.resend_needed
    depends_on:
    - M.Step.G9.ParameterContinuity
    on_missing: BLOCK
    description: 发现缺期请求补发；连续性未知时保留待核实，不猜测可用参数。
    basis_ids:
    - K.R.24.PARAM
  - id: M.Step.G9.ParameterSend
    name: 参数完整且业务受理才发送
    kind: DETERMINE
    uses:
    - M.Rule.ParameterSend
    reads:
    - M.Parameters.business_accepting
    - M.Parameters.sequence_continuous
    writes:
    - M.Parameters.send_allowed
    depends_on:
    - M.Step.G9.ParameterContinuity
    on_missing: BLOCK
    description: 仅在参数完整和业务处于受理状态时发起请求。
    basis_ids:
    - K.R.24.PARAM
  - id: M.Step.G9.FileUsable
    name: 附件取得实际应答后可用
    kind: DETERMINE
    uses:
    - M.Rule.FileUsable
    reads:
    - M.FileTransfer.file_id_received
    - M.FileTransfer.response_matched
    - M.FileTransfer.response_received
    writes:
    - M.FileTransfer.usable
    depends_on: []
    on_missing: BLOCK
    description: 真实上传业务应答对应本次传输且返回文件标识后才可关联；同步异步错误与待返回分别记录。
    basis_ids:
    - K.R.24.FILE
  - id: M.Step.G9.Reverification
    name: 失效流水重新核验
    kind: DETERMINE
    uses:
    - M.Rule.Reverification
    reads:
    - M.Query.verification_valid
    writes:
    - M.Query.reverification_required
    depends_on: []
    on_missing: BLOCK
    description: 核验流水失效时重新核验后查询；保存原请求和失效反馈，不能重用旧流水。
    basis_ids:
    - K.R.23.CURRENT
  - id: M.Step.G9.Continuity
    name: 历史完整性和总体资格连续判断
    kind: VERIFY
    uses:
    - M.Judgment.Continuity
