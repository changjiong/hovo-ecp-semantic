- question_id: K.Q.05
  question: 谁通过单独或联合实际控制成为受益所有人？
  answer: 权力来源、实际行使、单独联合与标准三结论分开。 标准三同样以候选自然人未满足标准一为前提，但它不是百分比测试。先取得章程、投票或一致行动协议、任免和决策记录、财务授权、资产和资金支配记录等，再判断该自然人是否单独或者与他人联合，能够持续、实质地支配主体的人事、重大经营管理决策、财务收支、重要资产或主要资金。协议约定和关系密切的人是可能的控制方式或线索；亲属、朋友、同学或上下级关系本身不等于已经实施实际控制，必须与表决安排、真实任免、决策或财物支配事实相互印证。持股很低或不持股不排除实际控制，例如有限合伙普通合伙人出资1%但依法和依约决定财务、人事及投资时仍可能满足标准三。反之，担任法定代表人、董事或顾问也不自动证明其是实际控制人。受益所有人与实际控制人必须分开：受益所有人还包括最终拥有和最终收益路径，并且必须穿透到自然人；实际控制只是成为受益所有人的一条路径。若同一人同时达到标准二和标准三，应保留两种关系。只有关系线索、职位名称或未核实的第三方标签时，结论为证据不足。
