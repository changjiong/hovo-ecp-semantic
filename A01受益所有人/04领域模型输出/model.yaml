  recommendation: 确认客户准入等各用途的必需证据、复核角色、留痕格式与缺证升级流程。
  until_resolved: 仅保留法规义务与业务范围提示，设计建议不升格为作业政策。
  status: OPEN
  severity: MEDIUM
