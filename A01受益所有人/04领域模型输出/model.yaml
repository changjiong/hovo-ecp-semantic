- question_id: K.Q.03
  question: 谁按股权、股份或合伙权益标准成为受益所有人？
  answer: 无环路径乘算、多路径合计、>=25与完整清单停止条件。 本题寻找的是最终拥有权益的自然人，而不只是工商登记中的直接大股东。先固定判断时点和目标主体，取得直接股东或合伙人、每层持有比例、权益类型以及最终自然人身份；对自然人直接持有的比例直接计入，对经一层或多层主体持有的每条路径逐层相乘；同一自然人通过多条可归属于其的路径最终拥有同一目标主体权益时，将各路径结果相加。结果达到或超过25%即满足标准一，25%本身计入，24.99%不计入。第二版指南示例把同一自然人经B公司直接持有和经C公司再持有的路径相加，说明多路径不能遗漏。应逐人计算，所有达标自然人均列入，不能只取比例最高者。对某一自然人已经满足标准一时，备案关系按标准一记录，不再把同一人的收益权或表决权重复归入标准二；这不妨碍继续检查其他自然人是否按标准二或三成为受益所有人。金融机构遇到境外持股无法核实、循环嵌套、交叉持股、代持等特定风险时，应加强核实，并可把权益阈值收紧至10%；这只是风险措施，不能倒写成一般备案阈值。任一层比例、权利归属或最终自然人缺失时不得按零处理，也不得据此宣布无人满足标准一。限定材料只给出了普通多层和多路径算例，没有给出循环或交叉持股的封闭计算方法，遇此结构须补充合规认可的计算口径。
