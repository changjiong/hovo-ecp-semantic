    basis_ids:
    - K.R.01
    - K.R.20
    - K.R.21
    - K.R.EXT.GOV.20.ACCESS
    - K.R.EXT.GOV.21.LIABILITY
    - K.R.EXT.GOV.15.EXEMPT
    - K.R.EXT.GOV.15.SIMPLIFY
  - id: M.Step.G7.Liability
