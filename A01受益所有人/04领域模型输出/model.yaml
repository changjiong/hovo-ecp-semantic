- question_id: K.Q.13
  question: 金融机构应依据哪些来源、材料和判断步骤识别并核实受益所有人？
  answer: 候选识别、身份核实、权利核实和备案核对四层。 先取得客户提供的信息，再按客户类型收集能解释所有权与控制权结构的材料：法人侧重身份证明、章程、董事高管股东名单及持股和投票权类型；合伙企业侧重合伙协议、合伙人及责任方式和权益比例；外国公司分支机构、信托和资管产品分别补其专属材料。随后把结构逐层解释到自然人并适用识别标准。身份真实性优先用我国政府公开渠道或外国政府机构、国际组织等官方认证信息核实；无法使用时才以有效证件原件或复印影印件并辅以其他资料。权利状况以客户佐证为基础，必要时结合政府、公开和机构发现信息综合核实。对3号令备案主体还要与BOMIS备案信息查询核对。低风险可仅取得足以识别的部分材料，但必须记录识别过程和理由；该简化不等于免除识别、核实和风险判断。
