- id: M.Rule.SimplificationMeasure
  name: 按具体主体分支选择措施
  description: 按主体具体条款选择负责人、投资人或其他人员；不得跨分支概括，国企仍须完整性质、适用和风险链条，信托资管另按其条件。
  inputs:
  - name: category
    label: 对应的简化分支
    binding: M.Identification.simplification_category
    type: Enum
    values:
    - 非法人专业服务机构
    - 合作经济组织法人
    - 个人独资企业
    - 合格境外投资者
    - 外国企业常驻代表机构
    - 社会组织
    - 国有独资或国有控股等列明企业
    - 国有参股公司
    - 人民银行另行规定且已有依据
    - 不属于列明类别
    cardinality:
      min: 0
      max: 1
  - name: verified
    label: 主体类别及适用依据已可靠核实
    binding: M.Identification.category_verified
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: risk
    label: 风险评估已完成
    binding: M.Identification.risk_assessment_complete
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: higher
    label: 属于较高及以上风险
    binding: M.Identification.higher_risk
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: trigger
    label: 存在加强识别触发情形
    binding: M.Identification.risk20_triggered
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: doubt
    label: 信息准确性或完整性存疑
    binding: M.Identification.data_doubt
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: matched
    label: 所选简化措施与风险相匹配
    binding: M.Identification.matched_risk_measure
    type: Boolean
    cardinality:
      min: 0
      max: 1
  result:
    type: Text
    cardinality:
      min: 0
      max: 1
  expression:
    op: if
    args:
    - op: and
      args:
      - input: verified
      - input: risk
      - input: matched
      - op: not
        args:
        - input: trigger
      - op: not
        args:
        - input: doubt
      - op: not
        args:
        - op: eq
          args:
          - input: category
          - literal:
              type: Text
              value: 不属于列明类别
      - op: or
        args:
        - op: contains
          args:
          - op: list
            args:
            - literal:
                type: Text
                value: 国有独资或国有控股等列明企业
            - literal:
                type: Text
                value: 国有参股公司
            - literal:
                type: Text
                value: 人民银行另行规定且已有依据
          - input: category
        - op: not
          args:
          - input: higher
    - op: if
      args:
      - op: eq
        args:
        - input: category
        - literal:
            type: Text
            value: 非法人专业服务机构
      - literal:
          type: Text
          value: 可以认定机构负责人
      - op: if
        args:
        - op: eq
          args:
          - input: category
          - literal:
              type: Text
              value: 合作经济组织法人
        - literal:
            type: Text
            value: 参照一般标准后可以认定法定代表人
        - op: if
          args:
          - op: eq
            args:
            - input: category
            - literal:
                type: Text
                value: 个人独资企业
          - literal:
              type: Text
              value: 可以认定投资人
          - op: if
            args:
            - op: eq
              args:
              - input: category
              - literal:
                  type: Text
                  value: 合格境外投资者
            - literal:
                type: Text
                value: 可以认定法定代表人、授权代表或相关业务负责人
            - op: if
              args:
              - op: eq
                args:
                - input: category
                - literal:
                    type: Text
                    value: 国有独资或国有控股等列明企业
              - literal:
                  type: Text
                  value: 另经国企性质及风险链条后可以认定法定代表人
              - op: if
                args:
                - op: eq
                  args:
                  - input: category
                  - literal:
                      type: Text
                      value: 国有参股公司
                - literal:
                    type: Text
                    value: 一般识别中仅可不再识别国有资本部分
                - literal:
                    type: Text
                    value: 按具体条款及风险确定识别措施
    - literal:
        type: Text
        value: 不得采用该简化分支
  on_unknown: PROPAGATE
  basis_ids:
