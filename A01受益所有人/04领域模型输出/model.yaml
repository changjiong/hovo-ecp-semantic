- knowledge_rule_id: RULE.A01.KF.EXCEPTIONS
  question_ids:
  - Q.A01.S45
  - Q.A01.S47
  - Q.A01.S49
  model_ids:
  - M.IdentificationRouteAssessment
  - M.SelectIdentificationRoute
  - M.RiskAssessment
  status: PARTIAL
  gap_ids:
  - M.Gap.CrossBorder
  - M.Gap.StateControlScope
  facets:
    scope:
      source_text: 金融机构客户尽调，区别免识别和条件性简化
      model_refs:
      - M.IdentificationRouteAssessment
      explanation: 按显式子集锁定为金融机构非自然人客户的受益所有人识别；备案办理、信托/资管产品和差异报告不在模型范围。
      status: FORMALIZED
    preconditions:
      source_text: 机构核实的是客户组织本身可否享受金融机构第十条免识别或第十一条简化，而非该客户是否免向BOMIS备案。
      model_refs:
      - M.Organization.organization_form
      - M.RiskAssessment
      explanation: 仅在目标组织、自然人候选与同一判断时点可识别后进入相应标准；范围、类别或事实未知时保留未知。
      status: FORMALIZED
    conditions:
      source_text: 先以有效设立材料确认第十条机关法人及派出机构、事业单位、基层自治组织、农村集体、政府间国际组织、外国政府及其驻华机构等法定类别，匹配者可以免识别。非第十条主体仅在第十一条对应类别且风险闸门允许时简化：无法人资格的专业服务机构可认定机构负责人；合作经济组织先按第八条，若无较高风险可认定法定代表人；个人独资企业无较高风险可认定投资人；合格境外投资者无较高风险可在法定代表人、授权代表或业务负责人中按实际角色认定；外国企业常驻代表机构先参照外国分支第九条第二款，且无较高风险时才可按风险简化，并非直接固定为负责人；社会组织按风险状况简化但不能预设统一人选；国有企业另按专门规则判断法代路径。类别或风险无法准确判断，或发生第二十条特定风险时，不得沿用免识别或简化。
      model_refs:
      - M.SelectIdentificationRoute.criteria
      explanation: 阈值与确定性逻辑使用有限DSL表达；图路径、事实真实性、组织类别或实际控制仍按来源证据和人工准则判断。
      status: MANUAL
    result:
      source_text: 第十条确证类别可以免识别；第十一条仅在其自身类别、人选和风险条件成立时，采用该类别允许的简化结果。无法证明类别、候选人或风险闸门时，回到一般或加强识别。
      model_refs:
      - M.IdentificationRouteAssessment.route
      explanation: 结果落在具体自然人—目标组织—识别依据—期间的关系及结论记录中；候选和正式确认不混为一谈。
      status: FORMALIZED
    exceptions:
      source_text: 主体名字含‘协会’或‘国企’、客户声明低风险不能证明法定类别和风险闸门；专业机构负责人、个人独资投资人不能横向代替其他类别。
      model_refs:
      - M.IdentificationRouteAssessment.risk_gate_passed
      - M.RiskAssessment.triggers
      - M.SelectIdentificationRoute.criteria
      explanation: 不将例外扩大到相似名称/身份；循环、缺边、证据冲突或风险禁用条件按来源保持UNKNOWN/阻断。
      status: MANUAL
    missing_evidence:
      source_text: 机构设立及登记资格、组织方式、负责人/投资人官方材料、风险评估记录与第二十条触发事实。
      model_refs:
      - M.IdentificationRouteAssessment.evidence
      explanation: 缺证明确指向受影响的人、权利或适用路线，并进入结论中的未决事项；不以空值补成否。
      status: FORMALIZED
    effective_period:
      source_text: 按办理时点组织形式和风险状态判断，客户变化后重评简化资格。
      model_refs:
      - M.IdentificationRouteAssessment.as_of
      explanation: 权利和控制关系均保留有证据的生效/终止期间；身份核实日、资料日期和权利生效日不互相替代。
      status: FORMALIZED
