- question_id: K.Q.23
  question: BOMIS核验、当前查询和历史查询如何衔接？
  answer: 核验、当前、历史三类观察及请求反馈关联。 业务人员先区分核验、详情查询和历史查询：核验比较提交资料与系统资料；当前查询获取备案详情；历史查询用于回溯。单笔和批量核验都要等对应业务反馈，批量还需区分初步反馈与批处理后的逐主体结果。当前查询使用有效核验流水，受每日配额和有效期参数约束。历史记录帮助解释中断和变更，但不能用系统收录时间替代关系生效时间；外部历史缺口仍需原始证据。各阶段保留主体、流水、反馈时点和返回内容，技术成功不代替业务识别结论。
