  - M.Gap.EvidenceConflict
  - M.Gap.ProposedPolicy
  facets:
    scope:
      source_text: 备案及机构识别的有效受益所有权关系
      model_refs:
      - M.CandidateAssessment
      - M.UBOQualification
      explanation: 按显式子集锁定为金融机构非自然人客户的受益所有人识别；备案办理、信托/资管产品和差异报告不在模型范围。
      status: FORMALIZED
    preconditions:
      source_text: 明确具体自然人、权利种类和目标主体，并区分原入选、当前比例变动与权利终止事件。
      model_refs:
      - M.CandidateAssessment.as_of
      - M.UBOQualification.first_qualified_precision
      explanation: 仅在目标组织、自然人候选与同一判断时点可识别后进入相应标准；范围、类别或事实未知时保留未知。
      status: FORMALIZED
    conditions:
      source_text: 分别记录首次跨入识别标准、当前权益比例或控制关系的形成、终止、登记披露、机构核实和备案日；法规要求的是法律关系生效的形成/终止时间；逐份看章程、转让、决议和控制权协议何时生效；未退出时增持可能改变当前比例的形成日，却不抹掉首次入选日；退出后重入需建立新的权利区间。
      model_refs:
      - M.AssessOwnershipPaths.criteria
      explanation: 阈值与确定性逻辑使用有限DSL表达；图路径、事实真实性、组织类别或实际控制仍按来源证据和人工准则判断。
      status: MANUAL
    result:
      source_text: 区分首次达到识别标准的日期、当前权利状态生效日及权利终止日，并另外保留披露、核实与备案日期。
      model_refs:
      - M.CandidateAssessment.first_qualified_on
      - M.UBOQualification.first_qualified_on
      - M.UBOQualification.effective_from
      explanation: 结果落在具体自然人—目标组织—识别依据—期间的关系及结论记录中；候选和正式确认不混为一谈。
      status: FORMALIZED
    exceptions:
      source_text: 工商变更登记日、客户查询日、最新增持日不必等于关系生效日；仅知月份不能系统自动补一日。
      model_refs:
      - M.UBOQualification.first_qualified_precision
      - M.UBOQualification.effective_from_precision
      - M.AssessOwnershipPaths.criteria
      explanation: 不将例外扩大到相似名称/身份；循环、缺边、证据冲突或风险禁用条件按来源保持UNKNOWN/阻断。
      status: MANUAL
    missing_evidence:
      source_text: 附生效条款的股权转让/控制协议、章程决议、批准条件完成证明、比例历史和权利终止文件。
      model_refs:
      - M.AssessOwnershipPaths.required_evidence
      explanation: 缺证明确指向受影响的人、权利或适用路线，并进入结论中的未决事项；不以空值补成否。
      status: FORMALIZED
    effective_period:
      source_text: 保留有效区间、精度及冲突；对历史交易按交易发生时证据与当时规则还原，不将当前人选追责历史。
      model_refs:
