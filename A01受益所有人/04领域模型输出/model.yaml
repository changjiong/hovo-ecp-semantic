rules:
- id: M.Rule.FilingScope
  name: 判断备案适用范围
  description: 备案范围按主体类型单独判断；其他非自然人客户暂不备案不等于免除金融机构识别。
  inputs:
  - name: kind
    label: 主体类型
    binding: M.Subject.kind
    type: Enum
    values:
    - 公司
    - 合伙企业
    - 国内分支机构
    - 外国公司分支机构
    - 外国公司
    - 信托
    - 资产管理产品
    - 个体工商户
    - 机关事业单位
    - 其他非自然人主体
    cardinality:
      min: 0
      max: 1
  - name: date
    label: 业务判断日期
    binding: M.Identification.as_of
    type: Date
    cardinality:
      min: 0
      max: 1
  result:
    type: Boolean
    cardinality:
      min: 0
      max: 1
  expression:
    op: and
    args:
    - op: gte
      args:
      - input: date
      - literal:
          type: Date
          value: '2024-11-01'
    - op: contains
      args:
      - op: list
        args:
        - literal:
            type: Text
            value: 公司
        - literal:
            type: Text
            value: 合伙企业
        - literal:
            type: Text
            value: 外国公司分支机构
      - input: kind
  on_unknown: PROPAGATE
  basis_ids:
  - K.R.01
  question_ids:
  - K.Q.01
  depends_on: []
  result_binding: M.Identification.filing_applicable
  business_meaning: 备案范围按主体类型单独判断；其他非自然人客户暂不备案不等于免除金融机构识别。
- id: M.Rule.CddScope
