    - M.Query.independent_identification_complete
    - M.Query.verification_reference
    - M.Query.verification_valid
    writes:
    - M.Query.query_allowed
    depends_on: []
    on_missing: BLOCK
    description: 当前详情请求须使用有效核验流水并关联独立识别；收到实际详情反馈后才能进入比较。
    basis_ids:
    - K.R.23.CURRENT
  - id: M.Step.G9.ReportContent
