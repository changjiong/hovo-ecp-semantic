  - name: evidence
    label: 采用证据
    binding: M.Identification.evidence
    type: Ref
    target: M.Evidence
    cardinality:
      min: 0
      max: null
  - name: purpose
    label: 具体查询用途
    binding: M.Access.purpose
    type: Text
    cardinality:
      min: 0
      max: 1
  outputs:
  - name: category
    label: 主体类别及适用依据已可靠核实
    binding: M.Identification.category_verified
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: lawful
    label: 用途属于法定职责或反洗钱义务
