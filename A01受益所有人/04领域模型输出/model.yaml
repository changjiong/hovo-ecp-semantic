    kind: VERIFY
    uses:
    - M.Judgment.Liability
    reads:
    - M.ComplianceReview.as_of
    - M.ComplianceReview.duty_kind
    - M.ComplianceReview.evidence
    writes:
    - M.ComplianceReview.legal_sources_complete
    - M.ComplianceReview.mitigation
    - M.ComplianceReview.rectification
    - M.ComplianceReview.violation_type
    depends_on: []
    on_missing: BLOCK
