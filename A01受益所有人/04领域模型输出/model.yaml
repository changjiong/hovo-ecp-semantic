      min: 0
      max: 1
    description: 关系终止时记录。
  - name: end_status
    label: 所属关系终止状态
    type: Enum
    cardinality:
      min: 1
      max: 1
    description: 注销、恢复或登记异常期间需区分UNKNOWN。
    values:
    - OPEN
    - KNOWN
    - UNKNOWN
  - name: evidence
    label: 所属关系证据
    type: Ref
    cardinality:
      min: 1
      max: null
    description: 分支和总部登记、存续、恢复状态及关系材料。
    target: M.Evidence
  - name: branch_manager
    label: 分支管理人员
    type: Ref
    cardinality:
      min: 0
      max: null
    description: 外国公司分支识别时所需的至少一名分支高管候选。
    target: M.NaturalPerson
  examples:
  - 有存续证据和关系材料证明境内分支在判断日属于总公司。
  counterexamples:
  - 只凭历史总公司名称或分支营业执照推定当前关系仍然有效。
  term_origin: PROPOSED
  business_sentence: 在特定期间，某个分支机构隶属于某个总公司，金融机构据此判断何时可承继已核实的总公司受益所有人。
  why_object: 所属关系存在独立时点和证据；总公司注销、恢复或名称变化不能简单沿用旧链。
  identity_description: 以分支、总公司及有效区间区分；关系终止后不得把旧受益人作为当前结果。
- id: M.RiskAssessment
  name: 识别风险评估
  kind: DECISION
  description: 记录影响识别核实深度的风险事实、对应措施及剩余缺口；不直接给出洗钱定性。
  basis_ids:
  - RULE.A01.KF.RISK
  - RULE.A01.KF.EXCEPTIONS
  identity:
  - target_organization
  - as_of
  fields:
  - name: target_organization
    label: 风险评估对象
    type: Ref
    cardinality:
      min: 1
      max: 1
    description: 客户组织。
    target: M.Organization
  - name: as_of
    label: 评估时点
    type: Date
    cardinality:
      min: 1
      max: 1
    description: 风险事实及措施适用的判断时点。
  - name: triggers
    label: 风险触发事实
    type: Enum
    cardinality:
      min: 0
      max: null
    description: 仅记录有事实支持的风险触发项。
    values:
    - HIGH_RISK_JURISDICTION
    - FOREIGN_RECORD_UNAVAILABLE
    - NOMINEE_ARRANGEMENT
    - CIRCULAR_OR_CROSS_HOLDING
    - FREQUENT_CHANGE
    - ML_TF_SUSPICION
    - OTHER
  - name: selected_measures
    label: 加强核实措施
    type: Enum
    cardinality:
      min: 0
      max: null
    description: 逐项说明与具体缺口的关系；降低阈值是可选加强措施，不是通用25%替代值。
    values:
    - INDEPENDENT_SOURCE
    - OBTAIN_RIGHTS_AGREEMENT
    - CUSTOMER_VISIT
    - TRANSACTION_MONITORING
    - LOWER_THRESHOLD
    - INCREASE_REVIEW_FREQUENCY
    - OTHER
  - name: measure_reason
    label: 措施理由
    type: Text
    cardinality:
      min: 0
      max: 1
    description: 解释每一风险事实如何对应所选措施及其效果。
  - name: residual_risk
    label: 剩余风险状态
    type: Enum
    cardinality:
      min: 0
      max: 1
    description: 本模型不决定业务接受或拒绝客户。
    values:
    - ACCEPTABLE_FOR_REVIEW
    - UNRESOLVED
    - EXCEEDS_CAPABILITY
    - UNKNOWN
  - name: evidence
    label: 风险证据
    type: Ref
    cardinality:
      min: 0
      max: null
    description: 支撑触发事实和措施效果的材料。
    target: M.Evidence
  examples:
  - 境外上层登记无法核实，机构记录失败原因并补充独立可靠来源。
  counterexamples:
  - 仅因持有境外股东就直接判定存在洗钱，或把所有客户默认改为10%阈值。
  term_origin: PROPOSED
  business_sentence: 金融机构针对特定风险事实选择相称的加强核实措施，并记录核实后的剩余风险。
  why_object: 风险触发事实、措施和剩余风险分开，避免把复杂、境外或代持标签自动等同可疑或拒办。
  identity_description: 以组织与评估时点区分；触发事实和措施需能回溯至当时材料。
- id: M.UBOQualification
  name: 受益所有权关系角色
  kind: ROLE
  description: 自然人在目标组织上依据一个或多个独立识别标准承担的、具有期间与证据的受益所有人角色。
  basis_ids:
  - TERM.A01.KF.02
  - TERM.A01.KF.03
  - TERM.A01.KF.04
  - TERM.A01.KF.05
  - TERM.A01.KF.06
  - RULE.A01.KF.EQUITY
  - RULE.A01.KF.RETURNS_VOTES
  - RULE.A01.KF.CONTROL
  - RULE.A01.KF.FALLBACK
  identity:
  - person
  - target_organization
  - qualification_basis
  fields:
  - name: person
    label: 受益所有人自然人
    type: Ref
    cardinality:
      min: 1
      max: 1
    description: 角色承担者必须是自然人。
    target: M.NaturalPerson
  - name: target_organization
    label: 目标组织
    type: Ref
    cardinality:
      min: 1
      max: 1
    description: 受益所有权所指向的组织。
    target: M.Organization
  - name: qualification_basis
    label: 识别依据
    type: Enum
    cardinality:
      min: 1
      max: 1
    description: 同一自然人可以有多个有证据支持的识别依据；备位仅在三项标准均确定不成立时使用。
    values:
    - EQUITY
    - ECONOMIC_BENEFIT
    - VOTING
    - ACTUAL_CONTROL
    - FALLBACK_MANAGER
  - name: first_qualified_on
    label: 首次达标法律生效日
    type: Date
    cardinality:
      min: 0
      max: 1
    description: 保留第一次达到标准的时点，不因比例变更而覆盖。
  - name: first_qualified_precision
    label: 首次达标日期精度
    type: Enum
    cardinality:
      min: 1
      max: 1
    description: 按证据保留精度，不推定具体日。
    values:
    - EXACT
    - MONTH
    - YEAR
    - INTERVAL
    - UNKNOWN
  - name: first_qualified_period_note
    label: 首次达标期间说明
    type: Text
    cardinality:
      min: 0
      max: 1
    description: 精度不是EXACT时描述来源支持的期间。
  - name: effective_from
    label: 当前权利状态生效日
    type: Date
    cardinality:
      min: 0
      max: 1
    description: 当前比例/控制方式对应的法律生效日；不能用登记日替代。
  - name: effective_from_precision
    label: 当前权利日期精度
    type: Enum
    cardinality:
      min: 1
      max: 1
    description: 仅使用来源支持的日期精度。
    values:
    - EXACT
    - MONTH
    - YEAR
    - INTERVAL
    - UNKNOWN
  - name: effective_period_note
    label: 当前权利期间说明
    type: Text
    cardinality:
      min: 0
      max: 1
    description: 说明当前权利状态的期间或日期证据缺口。
  - name: effective_to
    label: 关系终止日
    type: Date
    cardinality:
      min: 0
      max: 1
    description: 有证据时记录。
  - name: end_status
    label: 关系终止状态
    type: Enum
    cardinality:
      min: 1
      max: 1
    description: 未知不等于持续，也不等于终止。
    values:
    - OPEN
    - KNOWN
    - UNKNOWN
  - name: candidate_assessment
    label: 自然人评估
    type: Ref
    cardinality:
      min: 1
      max: 1
    description: 连接比例、控制判断和判断时点。
    target: M.CandidateAssessment
  - name: evidence
    label: 关系证据
    type: Ref
    cardinality:
      min: 1
      max: null
    description: 支持身份、权利和期间的来源材料。
    target: M.Evidence
  examples:
  - 甲因最终权益达到25%在特定期间承担权益标准的受益所有人角色。
  counterexamples:
  - 把名义股东身份本身当作受益所有人关系。
  term_origin: PROPOSED
  business_sentence: 某自然人在有证据支持的期间内，因特定权益、收益、表决、实际控制或严格备位标准而与一个组织形成受益所有权关系。
  why_object: 把受益所有人角色与自然人身份、底层权利事实及最终识别判断分开，便于一人多标准和期间变化解释。
  identity_description: 目标组织、自然人、识别依据与生效期间共同识别一段关系；退出后重新达标形成新的关系区间。
  bearer_field: person
- id: M.IdentificationConclusion
  name: 受益所有人识别结论
  kind: DECISION
  description: 金融机构针对一个组织客户和判断时点形成的自然人识别结果、路由、范围完整性和未决事项。
  basis_ids:
  - RULE.A01.KF.PROFILE
  - RULE.A01.KF.FALLBACK
  - RULE.A01.KF.IDENTITY
  - RULE.A01.KF.RISK
  identity:
  - target_organization
  - as_of
  fields:
  - name: target_organization
    label: 识别对象
    type: Ref
    cardinality:
      min: 1
      max: 1
    description: 目标客户或适用分支。
    target: M.Organization
  - name: as_of
    label: 判断时点
    type: Date
    cardinality:
      min: 1
      max: 1
    description: 本结论覆盖的客户关系时点。
  - name: route_assessment
    label: 识别路由判断
    type: Ref
    cardinality:
      min: 1
      max: 1
    description: 一般、简化、免识别或阻断状态及依据。
    target: M.IdentificationRouteAssessment
  - name: result_state
    label: 结果完整性
    type: Enum
    cardinality:
      min: 1
      max: 1
    description: COMPLETE仅表示本范围内人选及必要关系均有足够依据，不表示业务批准。
    values:
    - COMPLETE
    - PARTIAL
    - UNDETERMINED
    - EXEMPT
  - name: qualifications
    label: 已支持的受益所有权关系
    type: Ref
    cardinality:
      min: 0
      max: null
    description: 逐人列明权利标准与有效区间。
    target: M.UBOQualification
  - name: candidate_assessments
    label: 候选评估
    type: Ref
    cardinality:
      min: 0
      max: null
    description: 包含已入选和未能排除的候选。
    target: M.CandidateAssessment
  - name: candidate_population
    label: 组织级候选全集
    type: Ref
    cardinality:
      min: 0
      max: 1
    description: 是否穷尽候选及可否启用备位的组织级依据。
    target: M.CandidatePopulationAssessment
  - name: unresolved_items
    label: 未决事项
    type: Text
    cardinality:
      min: 0
      max: null
    description: 逐项说明缺证、冲突或未确定的路由，并注明受影响结论。
  - name: reviewer
    label: 识别责任角色
    type: Ref
    cardinality:
      min: 1
      max: 1
    description: 金融机构有权尽调人员；本模型不规定准入/授信/报告审批岗位。
    target: M.IdentificationReviewer
  examples:
  - 结论列出甲的控制关系及证据，同时保留另一候选人的路径未知事项。
  counterexamples:
  - 仅保存一份无时点、无依据、未决项被清空的自然人名单。
  term_origin: PROPOSED
  business_sentence: 金融机构按明确客户范围和时点，交付已支持的自然人关系，并将未决候选、路径或证据缺口显式保留。
  why_object: 受益所有人姓名、路径、时间、证据、判断状态和业务审批是不同事实；将其合并成单一标签会隐去未知与冲突。
  identity_description: 以目标组织与判断时点识别一份结论快照；新证据可修订新版本，不覆盖原判断依据。
temporal:
- id: M.Time.BranchAffiliation
  type_id: M.BranchAffiliation
  start_field: effective_from
  end_field: effective_to
  end_status_field: end_status
  basis_ids:
  - RULE.A01.KF.BRANCHES
  - TERM.A01.KF.10
rules:
- id: M.SumEquityPaths
  name: 汇总同一自然人有效权益路径
  description: 路径全集完整且每条路径有效时，合计互异路径贡献；否则结果为UNKNOWN。
  inputs:
  - name: paths
    label: 互异权益路径
    type: Ref
    binding: M.CandidateAssessment.equity_paths
    target: M.EquityPath
    cardinality:
      min: 0
      max: null
  - name: path_status
    label: 整体路径状态
    type: Enum
    binding: M.CandidateAssessment.equity_path_status
    values:
    - COMPLETE
    - INCOMPLETE
    - CYCLICAL_OR_CROSS
    - CONFLICTED
    - UNKNOWN
  result:
    type: Decimal
  expression:
    op: if
    args:
    - op: and
      args:
      - op: eq
        args:
        - input: path_status
        - literal:
            type: Text
            value: COMPLETE
      - op: all
        args:
        - query:
            from:
              op: distinct
              args:
              - input: paths
            as: path
            where:
              literal:
                type: Boolean
                value: true
            select:
              op: eq
              args:
              - field:
                  of:
                    input: path
                  name: path_status
              - literal:
                  type: Text
                  value: VALID
    - op: sum
      args:
      - query:
          from:
            op: distinct
            args:
            - input: paths
          as: path
          where:
            literal:
              type: Boolean
              value: true
          select:
            field:
              of:
                input: path
              name: path_percentage
    - literal:
        type: Decimal
        value: null
  on_unknown: PROPAGATE
  basis_ids:
  - RULE.A01.KF.EQUITY
  question_ids:
  - Q.A01.S13
  - Q.A01.S14
  depends_on: []
  result_binding: M.CandidateAssessment.final_equity_percentage
  business_meaning: 完整性仍须由责任人员据全图证据核定；仅对已核实、互异且有效的路径贡献求和。
- id: M.MeetsEquityThreshold
  name: 权益比例达到25%
  description: 在最终自然人权益比例已可确定时，判断是否达到25%含本数；未知比例传播为UNKNOWN。
  inputs:
  - name: equity_percentage
    label: 最终权益比例（百分比）
    type: Decimal
    binding: M.CandidateAssessment.final_equity_percentage
  - name: path_status
    label: 整体路径状态
    type: Enum
    binding: M.CandidateAssessment.equity_path_status
    values:
    - COMPLETE
    - INCOMPLETE
    - CYCLICAL_OR_CROSS
    - CONFLICTED
    - UNKNOWN
  result:
    type: Boolean
  expression:
    op: if
    args:
    - op: eq
      args:
      - input: path_status
      - literal:
          type: Text
          value: COMPLETE
    - op: gte
      args:
      - input: equity_percentage
      - literal:
          type: Decimal
          value: 25
    - literal:
        type: Boolean
        value: null
  on_unknown: PROPAGATE
  basis_ids:
  - RULE.A01.KF.EQUITY
  question_ids:
  - Q.A01.S13
  - Q.A01.S14
  depends_on:
  - M.SumEquityPaths
  result_binding: M.CandidateAssessment.meets_standard1
  business_meaning: 25含本数；仅对同一判断时点、证据支持的最终权益比例求值。路径不完整、循环或冲突时比例保持未知，不按0处理。
- id: M.MeetsBenefitVoteThreshold
  name: 收益/表决权标准达到25%
  description: 只在自然人不符合权益标准一时，分别看最终收益与表决权是否任一达到25%含本数。
  inputs:
  - name: meets_standard1
    label: 已符合权益标准
    type: Boolean
    binding: M.CandidateAssessment.meets_standard1
  - name: benefit_percentage
    label: 最终收益权比例
    type: Decimal
    binding: M.CandidateAssessment.final_benefit_percentage
  - name: voting_percentage
    label: 最终表决权比例
    type: Decimal
    binding: M.CandidateAssessment.final_voting_percentage
  result:
    type: Boolean
  expression:
    op: if
    args:
    - input: meets_standard1
    - literal:
        type: Boolean
        value: false
    - op: or
      args:
      - op: gte
        args:
        - input: benefit_percentage
        - literal:
            type: Decimal
            value: 25
      - op: gte
        args:
        - input: voting_percentage
        - literal:
            type: Decimal
            value: 25
  on_unknown: PROPAGATE
  basis_ids:
  - RULE.A01.KF.RETURNS_VOTES
  question_ids:
  - Q.A01.S17
  - Q.A01.S18
  - Q.A01.S20
  depends_on:
  - M.MeetsEquityThreshold
  result_binding: M.CandidateAssessment.meets_standard2
  business_meaning: 权益标准一为真时标准二归类为假；否则收益权或表决权任一达到25%即为真。标准一未知或两种权利均无法确定时按三值逻辑传播未知。
- id: M.FallbackAvailable
  name: 三项一般标准均确定不成立
  description: 仅当权益、收益/表决与实际控制三个标准均确定为不成立时，备位前提才成立。
  inputs:
  - name: search_complete
    label: 组织级候选及路径已穷尽
    type: Boolean
    binding: M.CandidatePopulationAssessment.search_complete
  - name: any_qualifying
    label: 存在满足一般标准者
    type: Boolean
    binding: M.CandidatePopulationAssessment.any_qualifying_candidate
  result:
    type: Boolean
  expression:
    op: and
    args:
    - op: eq
      args:
      - input: search_complete
      - literal:
          type: Boolean
          value: true
    - op: eq
      args:
      - input: any_qualifying
      - literal:
          type: Boolean
          value: false
  on_unknown: PROPAGATE
  basis_ids:
  - RULE.A01.KF.FALLBACK
  question_ids:
  - Q.A01.S28
  - Q.A01.S29
  depends_on: []
  result_binding: M.CandidatePopulationAssessment.fallback_available
  business_meaning: 只有完整候选全集已核且不存在任何达到任一一般标准的自然人时，组织级备位前提才为真；否则为FALSE或UNKNOWN。
state_machines: []
judgments:
- id: M.AssessOwnershipPaths
  name: 核验并计算权益穿透路径
  description: 逐条核实路径节点与边，计算每条有效路径贡献并核定路径全集状态；合计由 M.SumEquityPaths 给出。
  inputs:
  - name: candidate
    label: 自然人评估
    type: Ref
    binding: M.CandidateAssessment
    target: M.CandidateAssessment
  - name: links
    label: 权益关系边
    type: Ref
    binding: M.CandidateAssessment.ownership_links
    target: M.OwnershipLink
    cardinality:
      min: 0
      max: null
  outputs:
  - name: paths
    label: 有序穿透路径
    type: Ref
    binding: M.CandidateAssessment.equity_paths
    target: M.EquityPath
    cardinality:
      min: 0
      max: null
  - name: path_status
    label: 整体路径状态
    type: Enum
    binding: M.CandidateAssessment.equity_path_status
    values:
    - COMPLETE
    - INCOMPLETE
    - CYCLICAL_OR_CROSS
    - CONFLICTED
    - UNKNOWN
  responsible_role: M.IdentificationReviewer
  required_evidence:
  - 每段持有人身份及比例的有效依据
  - 同一判断时点的完整上层结构
  - 循环、交叉、重复路径和关系期间核对记录
  question_ids:
  - Q.A01.S13
  - Q.A01.S14
  - Q.A01.S60
  - Q.A01.S61
  - Q.A01.S62
  issue_ids:
  - M.Gap.EvidenceConflict
  on_missing: BLOCK
  basis_ids:
  - TERM.A01.KF.02
  - TERM.A01.KF.03
  - TERM.A01.KF.04
  - TERM.A01.KF.05
  - TERM.A01.KF.06
