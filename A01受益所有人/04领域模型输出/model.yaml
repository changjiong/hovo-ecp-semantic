      explanation: 仅在目标组织、自然人候选与同一判断时点可识别后进入相应标准；范围、类别或事实未知时保留未知。
      status: FORMALIZED
    conditions:
      source_text: 逐项完成权益、收益/表决、实际控制的自然人查找；只有三项均确定不存在，才认定真实负责日常经营管理人员作为备位（指南要求至少一名最高层级日常管理人员）；备位是特定条件结果，不是实质自然人控制权的证明。
      model_refs:
      - M.FallbackAvailable.expression
      - M.SelectFallbackManager.criteria
      explanation: 阈值与确定性逻辑使用有限DSL表达；图路径、事实真实性、组织类别或实际控制仍按来源证据和人工准则判断。
      status: MIXED
    result:
      source_text: 经查三项一般标准确实没有符合者，才将真实负责日常经营管理的人员按备位识别。
      model_refs:
      - M.SelectFallbackManager.criteria
      - M.UBOQualification.qualification_basis
      explanation: 结果落在具体自然人—目标组织—识别依据—期间的关系及结论记录中；候选和正式确认不混为一谈。
      status: FORMALIZED
    exceptions:
      source_text: 结构分支未追完、代持协议缺失或控制争议属 UNKNOWN 而不是三项 FALSE，不得因此直接填法定代表人兜底。
      model_refs:
      - M.CandidatePopulationAssessment.fallback_available
      - M.SelectFallbackManager.criteria
      explanation: 不将例外扩大到相似名称/身份；循环、缺边、证据冲突或风险禁用条件按来源保持UNKNOWN/阻断。
      status: MANUAL
    missing_evidence:
      source_text: 完整自然人候选及排除理由、章程/决议、经营管理职责、任职记录与实际履职证据。
      model_refs:
      - M.SelectFallbackManager.required_evidence
      - M.ReviewCandidatePopulation.required_evidence
      explanation: 缺证明确指向受影响的人、权利或适用路线，并进入结论中的未决事项；不以空值补成否。
      status: FORMALIZED
    effective_period:
      source_text: 按判断日确认三项均不成立和管理者任职存续。
      model_refs:
      - M.CandidatePopulationAssessment.as_of
      - M.UBOQualification.effective_from
      explanation: 权利和控制关系均保留有证据的生效/终止期间；身份核实日、资料日期和权利生效日不互相替代。
      status: FORMALIZED
