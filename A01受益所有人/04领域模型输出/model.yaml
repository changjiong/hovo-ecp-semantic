    reads:
    - M.BomisCase.state
    writes:
    - M.BomisCase.state
    depends_on: []
    on_missing: BLOCK
    description: 按实际业务反馈及条件计算允许的状态变化；不写外部系统。
    basis_ids:
    - K.R.24.CASE
  - id: M.Step.G9.File
    name: 附件上传与关联
    kind: UPDATE
    uses:
