- question_id: K.Q.12
  question: 备案主体设立、信息变化、免报条件失效，以及金融机构存量客户治理分别适用什么期限？
  answer: 事件日起算的法定期限和存量分层计划。 第一步确认义务主体：备案主体还是金融机构。备案主体在线设立登记时同步备案；无法在线设立登记而现场办理的，自设立登记日起30日内补办。受益所有人信息变化或承诺免报条件失效的，自变化或失效日起30日内更新。2024年11月1日前登记的存量备案主体应于2025年11月1日前完成备案。金融机构对2026年1月20日前已建立关系或交易、但未满足新标准的存量非自然人客户，较高风险以上客户在施行日起6个月内完成，全部存量客户在施行日起2年内完成；长期不动户或已受严格限制的客户可延至申请激活或办理业务时。上述30日按条文写作日，差异报告的30个工作日属于另一问题，不得互换。
