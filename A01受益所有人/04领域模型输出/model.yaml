      status: FORMALIZED
    conditions:
      source_text: 区分识别谁、为何及何时有权：一般客户留存自然人姓名、性别、国籍、出生日期、身份证明类别号码与有效期限、权利类型、比例/控制方式和形成终止时间；仅对上市及经官方核实的特定高透明国企客户，可按第十八条至少留姓名、性别、国籍、出生年月及可识别身份照片；身份优先官方渠道，不能用时身份证件及补充材料；权利以客户资料为基础并按风险核对官方、公开、机构发现信息。确属低风险才可采信客户权利信息；部分佐证足够时记录取舍理由。另外，备案主体按照2024年第3号令第十一条逐人填报经常居住地或工作单位地址、联系方式，及证件有效期限；该备案字段不与机构一般识别留存字段混同。
      model_refs:
      - M.ReviewCandidateEvidence.criteria
      explanation: 阈值与确定性逻辑使用有限DSL表达；图路径、事实真实性、组织类别或实际控制仍按来源证据和人工准则判断。本规则的备案侧、备案专属字段或备案办理时限明确留在模型边界之外；只交接金融机构客户识别侧。
      status: MANUAL
    result:
      source_text: 逐人留存机构要求的身份、权利类型、比例或控制方式及有效时间，以风险相称可靠来源完成合理核实；备案另按第3号令第十一条填字段。
      model_refs:
      - M.CandidateAssessment.assessment_state
      - M.IdentificationConclusion
      explanation: 结果落在具体自然人—目标组织—识别依据—期间的关系及结论记录中；候选和正式确认不混为一谈。本规则的备案侧、备案专属字段或备案办理时限明确留在模型边界之外；只交接金融机构客户识别侧。
      status: FORMALIZED
    exceptions:
      source_text: 仅客户自报、第三方股权比例或身份证复印件在可得官方独立渠道且有冲突时不足；信息字段齐全不代表权利已核实。
      model_refs:
      - M.Evidence.verification_state
      - M.ReviewCandidateEvidence.criteria
      explanation: 不将例外扩大到相似名称/身份；循环、缺边、证据冲突或风险禁用条件按来源保持UNKNOWN/阻断。本规则的备案侧、备案专属字段或备案办理时限明确留在模型边界之外；只交接金融机构客户识别侧。
      status: MANUAL
    missing_evidence:
      source_text: 登记章程/合伙协议、股东董事及管理名单、有效身份件与官方核验、权利文件、日期、交叉核实及风险取舍记录。
      model_refs:
      - M.Evidence
      - M.ReviewCandidateEvidence.required_evidence
      explanation: 缺证明确指向受影响的人、权利或适用路线，并进入结论中的未决事项；不以空值补成否。本规则的备案侧、备案专属字段或备案办理时限明确留在模型边界之外；只交接金融机构客户识别侧。
      status: FORMALIZED
    effective_period:
      source_text: 资料与权利状态必须同一适用时点；缺生效日时不可自动填默认日。
      model_refs:
      - M.CandidateAssessment.as_of
      - M.OwnershipLink.effective_from
      explanation: 权利和控制关系均保留有证据的生效/终止期间；身份核实日、资料日期和权利生效日不互相替代。本规则的备案侧、备案专属字段或备案办理时限明确留在模型边界之外；只交接金融机构客户识别侧。
      status: FORMALIZED
- knowledge_rule_id: RULE.A01.KF.RISK
  question_ids:
  - Q.A01.S50
  - Q.A01.S52
  - Q.A01.S53
  model_ids:
  - M.RiskAssessment
  - M.SelectRiskMeasures
  - M.IdentificationConclusion
  status: PARTIAL
  gap_ids:
  - M.Gap.CrossBorder
  - M.Gap.EvidenceConflict
  facets:
    scope:
      source_text: 机构客户风险管理及第八条普通阈值的边界
      model_refs:
      - M.RiskAssessment
      - M.IdentificationConclusion
      explanation: 按显式子集锁定为金融机构非自然人客户的受益所有人识别；备案办理、信托/资管产品和差异报告不在模型范围。
      status: FORMALIZED
    preconditions:
      source_text: 金融机构已识别到第十二号令第二十条对应特定事实，并区分一般识别标准与加强措施的自由裁量范围。
      model_refs:
      - M.RiskAssessment.triggers
      explanation: 仅在目标组织、自然人候选与同一判断时点可识别后进入相应标准；范围、类别或事实未知时保留未知。
      status: FORMALIZED
    conditions:
      source_text: 客户高风险国家地区、境外上层无法核验、循环交叉持股、代持协议、异常频繁换人、重大差异或洗钱嫌疑等，触发按事实选择一种或多种相称加强措施；可取得独立可靠信息、补法效代持协议、回访、加强监测、降低比例阈值（如10%，仅可选加强不是普通25%改法）或提高更新频率。自然人客户较高风险还应视情筛查其作为受益人的本机构非自然人客户。
      model_refs:
      - M.SelectRiskMeasures.criteria
      explanation: 阈值与确定性逻辑使用有限DSL表达；图路径、事实真实性、组织类别或实际控制仍按来源证据和人工准则判断。
      status: MANUAL
    result:
      source_text: 特定风险事实触发与风险相称的一项或多项加强识别措施，效果不充分继续评估剩余风险；10%仅属可选加强示例。
      model_refs:
      - M.RiskAssessment.selected_measures
      - M.RiskAssessment.residual_risk
      explanation: 结果落在具体自然人—目标组织—识别依据—期间的关系及结论记录中；候选和正式确认不混为一谈。
      status: FORMALIZED
    exceptions:
      source_text: 发现触发事实而仅维持低风险客户自报、把10%改作所有客户法定阈值、或按同一清单一刀切，均不能证明相称。
      model_refs:
      - M.RiskAssessment.residual_risk
      - M.SelectRiskMeasures.criteria
      explanation: 不将例外扩大到相似名称/身份；循环、缺边、证据冲突或风险禁用条件按来源保持UNKNOWN/阻断。
      status: MANUAL
    missing_evidence:
      source_text: 风险地区及交易证据、境外登记失败记录、循环路径、代持原始协议、异常变化和关联客户清单、措施选用及效果。
      model_refs:
      - M.RiskAssessment.evidence
      - M.SelectRiskMeasures.required_evidence
      explanation: 缺证明确指向受影响的人、权利或适用路线，并进入结论中的未决事项；不以空值补成否。
      status: FORMALIZED
    effective_period:
      source_text: 风险事实发生和消失均影响加强程度；不能用后来的无风险状态抹去触发时记录。
      model_refs:
      - M.RiskAssessment.as_of
      explanation: 权利和控制关系均保留有证据的生效/终止期间；身份核实日、资料日期和权利生效日不互相替代。
      status: FORMALIZED
- knowledge_rule_id: RULE.A01.KF.DATES
  question_ids:
  - Q.A01.S60
  - Q.A01.S61
  - Q.A01.S62
  model_ids:
  - M.CandidateAssessment
  - M.UBOQualification
  - M.OwnershipLink
  - M.OtherRight
  - M.ControlArrangement
  - M.AssessOwnershipPaths
  status: PARTIAL
  gap_ids:
