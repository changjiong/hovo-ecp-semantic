      model_refs:
      - M.CandidateAssessment.meets_standard3
      - M.UBOQualification
      explanation: 仅承接自然人识别所需的稳定事实或判断；备案、机构操作和风险治理口径仍留在固定领域知识。
      status: FORMALIZED
    exceptions:
      source_text: 第一大股东、法定代表人、普通执行人、朋友/亲属关系和一次付款签名仅是线索；缺生效协议、决议、持续履行记录时实际支配为 UNKNOWN，不得因未发现股权人立即认定无控制。
