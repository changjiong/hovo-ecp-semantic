- question_id: K.Q.20
  question: 谁可以因何目的获取、查询和使用受益所有人信息，查询传输和后续使用如何保密？
  answer: 合法目的、访问授权、返回方式、传输控制和用途保密。 3号令允许国家有关机关履职依法获取，允许金融机构和特定非金融机构为履行反洗钱反恐怖融资义务查询；获得者均负保密义务。12号令进一步要求金融机构对识别核实中取得的信息依法保密。BOMIS接口规范只说明系统实施：声明反洗钱反恐怖融资查询目的时个人要素以非掩码但加密方式传输，否则按掩码返回；传输经DEMP、HTTPS、签名验签，证件编号使用数字信封，并校验用户、业务权限和代报关系。接口安全控制不替代用途合法性和组织内部最小必要使用。7份输入未给出“保存10年”的期限及起算规则，不能在本题中补造；若要采用该要求，须补充其规范原文并确认起算事件。
