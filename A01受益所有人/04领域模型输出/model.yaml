    - M.PersonAssessment.date_reason
    - M.PersonAssessment.history_complete
    depends_on: []
    on_missing: BLOCK
    description: 按实际生效的关系变化重建各段历史，核对真实中断和未知终止。；关系类型切换但总体资格始终满足时延续原日期；存在真实空档则保留退出和重新达标。；备案历史用于佐证变化，备案操作时点不能直接充当关系生效时点。
    basis_ids:
    - K.R.11
    - K.R.11.HISTORY
    - K.R.23.HISTORY
  - id: M.Step.G9.Query
    name: 查询异步反馈
    kind: UPDATE
    uses:
