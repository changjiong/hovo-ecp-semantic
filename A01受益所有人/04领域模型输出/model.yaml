      min: 1
      max: 1
    description: 本结论覆盖的客户关系时点。
  - name: result_state
    label: 结果完整性
    type: Enum
    cardinality:
      min: 1
      max: 1
    description: COMPLETE仅表示本范围内人选及必要关系均有足够依据，不表示业务批准。
    values:
    - COMPLETE
    - PARTIAL
    - UNDETERMINED
    - EXEMPT
  - name: qualifications
    label: 已支持的受益所有权关系
    type: Ref
    cardinality:
      min: 0
      max: null
    description: 逐人列明权利标准与有效区间。
    target: M.UBOQualification
  - name: candidate_assessments
    label: 候选评估
    type: Ref
    cardinality:
      min: 0
      max: null
    description: 包含已入选和未能排除的候选。
    target: M.CandidateAssessment
  - name: candidate_population
    label: 组织级候选全集
    type: Ref
    cardinality:
      min: 0
      max: 1
    description: 是否穷尽候选及可否启用备位的组织级依据。
    target: M.CandidatePopulationAssessment
  - name: unresolved_items
    label: 未决事项
    type: Text
    cardinality:
      min: 0
      max: null
    description: 逐项说明缺证、冲突或未确定的路由，并注明受影响结论。
  - name: reviewer
    label: 识别责任角色
    type: Ref
    cardinality:
      min: 1
      max: 1
    description: 金融机构有权尽调人员；本模型不规定准入/授信/报告审批岗位。
    target: M.IdentificationReviewer
  examples:
  - 结论列出甲的控制关系及证据，同时保留另一候选人的路径未知事项。
  counterexamples:
  - 仅保存一份无时点、无依据、未决项被清空的自然人名单。
  term_origin: PROPOSED
  business_sentence: 金融机构按明确客户范围和时点，交付已支持的自然人关系，并将未决候选、路径或证据缺口显式保留。
  why_object: 受益所有人姓名、路径、时间、证据、判断状态和业务审批是不同事实；将其合并成单一标签会隐去未知与冲突。
  identity_description: 以目标组织与判断时点识别一份结论快照；新证据可修订新版本，不覆盖原判断依据。
temporal: []
rules:
- id: M.SumEquityPaths
  name: 汇总同一自然人有效权益路径
  description: 路径全集完整且每条路径有效时，合计互异路径贡献；否则结果为UNKNOWN。
  inputs:
  - name: paths
    label: 互异权益路径
    type: Ref
    binding: M.CandidateAssessment.equity_paths
    target: M.EquityPath
    cardinality:
      min: 0
      max: null
  - name: path_status
    label: 整体路径状态
    type: Enum
    binding: M.CandidateAssessment.equity_path_status
    values:
    - COMPLETE
    - INCOMPLETE
    - CYCLICAL_OR_CROSS
    - CONFLICTED
    - UNKNOWN
  result:
    type: Decimal
  expression:
    op: if
    args:
    - op: and
      args:
      - op: eq
        args:
        - input: path_status
        - literal:
            type: Text
            value: COMPLETE
      - op: all
        args:
        - query:
            from:
              op: distinct
              args:
              - input: paths
            as: path
            where:
              literal:
                type: Boolean
                value: true
            select:
              op: eq
              args:
              - field:
                  of:
                    input: path
                  name: path_status
              - literal:
                  type: Text
                  value: VALID
    - op: sum
      args:
      - query:
          from:
            op: distinct
            args:
            - input: paths
          as: path
          where:
            literal:
              type: Boolean
              value: true
          select:
            field:
              of:
                input: path
              name: path_percentage
    - literal:
        type: Decimal
        value: null
  on_unknown: PROPAGATE
  basis_ids:
  - RULE.A01.KF.EQUITY
  question_ids:
  - Q.A01.S13
  - Q.A01.S14
  depends_on: []
  result_binding: M.CandidateAssessment.final_equity_percentage
  business_meaning: 完整性仍须由责任人员据全图证据核定；仅对已核实、互异且有效的路径贡献求和。
- id: M.MeetsEquityThreshold
  name: 权益比例达到25%
  description: 在最终自然人权益比例已可确定时，判断是否达到25%含本数；未知比例传播为UNKNOWN。
  inputs:
  - name: equity_percentage
    label: 最终权益比例（百分比）
    type: Decimal
    binding: M.CandidateAssessment.final_equity_percentage
  - name: path_status
    label: 整体路径状态
    type: Enum
    binding: M.CandidateAssessment.equity_path_status
    values:
    - COMPLETE
    - INCOMPLETE
    - CYCLICAL_OR_CROSS
    - CONFLICTED
    - UNKNOWN
  result:
    type: Boolean
  expression:
    op: if
    args:
    - op: eq
      args:
      - input: path_status
      - literal:
          type: Text
          value: COMPLETE
    - op: gte
      args:
      - input: equity_percentage
      - literal:
          type: Decimal
          value: 25
    - literal:
        type: Boolean
        value: null
  on_unknown: PROPAGATE
  basis_ids:
  - RULE.A01.KF.EQUITY
  question_ids:
  - Q.A01.S13
  - Q.A01.S14
  depends_on:
  - M.SumEquityPaths
  result_binding: M.CandidateAssessment.meets_standard1
  business_meaning: 25含本数；仅对同一判断时点、证据支持的最终权益比例求值。路径不完整、循环或冲突时比例保持未知，不按0处理。
- id: M.MeetsBenefitVoteThreshold
  name: 收益/表决权标准达到25%
  description: 只在自然人不符合权益标准一时，分别看最终收益与表决权是否任一达到25%含本数。
  inputs:
  - name: meets_standard1
    label: 已符合权益标准
    type: Boolean
    binding: M.CandidateAssessment.meets_standard1
  - name: benefit_percentage
    label: 最终收益权比例
    type: Decimal
    binding: M.CandidateAssessment.final_benefit_percentage
  - name: voting_percentage
    label: 最终表决权比例
    type: Decimal
    binding: M.CandidateAssessment.final_voting_percentage
  result:
    type: Boolean
  expression:
    op: if
    args:
    - input: meets_standard1
    - literal:
        type: Boolean
        value: false
    - op: or
      args:
      - op: gte
        args:
        - input: benefit_percentage
        - literal:
            type: Decimal
            value: 25
      - op: gte
        args:
        - input: voting_percentage
        - literal:
            type: Decimal
            value: 25
  on_unknown: PROPAGATE
  basis_ids:
  - RULE.A01.KF.RETURNS_VOTES
  question_ids:
  - Q.A01.S17
  - Q.A01.S18
  - Q.A01.S20
  depends_on:
  - M.MeetsEquityThreshold
  result_binding: M.CandidateAssessment.meets_standard2
  business_meaning: 权益标准一为真时标准二归类为假；否则收益权或表决权任一达到25%即为真。标准一未知或两种权利均无法确定时按三值逻辑传播未知。
- id: M.FallbackAvailable
  name: 三项一般标准均确定不成立
  description: 仅当权益、收益/表决与实际控制三个标准均确定为不成立时，备位前提才成立。
  inputs:
  - name: search_complete
    label: 组织级候选及路径已穷尽
    type: Boolean
    binding: M.CandidatePopulationAssessment.search_complete
  - name: any_qualifying
    label: 存在满足一般标准者
    type: Boolean
    binding: M.CandidatePopulationAssessment.any_qualifying_candidate
  result:
    type: Boolean
  expression:
    op: and
    args:
    - op: eq
      args:
      - input: search_complete
      - literal:
          type: Boolean
          value: true
    - op: eq
      args:
      - input: any_qualifying
      - literal:
          type: Boolean
          value: false
  on_unknown: PROPAGATE
  basis_ids:
  - RULE.A01.KF.FALLBACK
  question_ids:
  - Q.A01.S28
  - Q.A01.S29
  depends_on: []
  result_binding: M.CandidatePopulationAssessment.fallback_available
  business_meaning: 只有完整候选全集已核且不存在任何达到任一一般标准的自然人时，组织级备位前提才为真；否则为FALSE或UNKNOWN。
state_machines: []
judgments:
- id: M.AssessOwnershipPaths
  name: 核验并计算权益穿透路径
  description: 逐条核实路径节点与边，计算每条有效路径贡献并核定路径全集状态；合计由 M.SumEquityPaths 给出。
  inputs:
  - name: candidate
    label: 自然人评估
    type: Ref
    binding: M.CandidateAssessment
    target: M.CandidateAssessment
  - name: links
    label: 权益关系边
    type: Ref
    binding: M.CandidateAssessment.ownership_links
    target: M.OwnershipLink
    cardinality:
      min: 0
      max: null
  outputs:
  - name: paths
    label: 有序穿透路径
    type: Ref
    binding: M.CandidateAssessment.equity_paths
    target: M.EquityPath
    cardinality:
      min: 0
      max: null
  - name: path_status
    label: 整体路径状态
    type: Enum
    binding: M.CandidateAssessment.equity_path_status
    values:
    - COMPLETE
    - INCOMPLETE
    - CYCLICAL_OR_CROSS
    - CONFLICTED
    - UNKNOWN
  responsible_role: M.IdentificationReviewer
  required_evidence:
  - 每段持有人身份及比例的有效依据
  - 同一判断时点的完整上层结构
  - 循环、交叉、重复路径和关系期间核对记录
  question_ids:
  - Q.A01.S13
  - Q.A01.S14
  - Q.A01.S60
  - Q.A01.S61
  - Q.A01.S62
  issue_ids:
  - M.Gap.EvidenceConflict
  on_missing: BLOCK
  basis_ids:
  - TERM.A01.KF.02
  - TERM.A01.KF.03
  - TERM.A01.KF.04
  - TERM.A01.KF.05
  - TERM.A01.KF.06
  - TERM.A01.KF.07
  - TERM.A01.KF.09
  - TERM.A01.KF.10
  - TERM.A01.KF.13
  - RULE.A01.KF.EQUITY
  - RULE.A01.KF.DATES
  nature: BUSINESS_DISCRETION
  criteria:
  - 从自然人一侧到目标组织一侧为每条路径建立有序边步骤。
  - 逐边相乘并记下每条路径贡献；不得把中间组织控制比例当作100%权益。
  - 同一自然人的互异有效路径分别计算后合计，不重复计入同一关系路径。
  - 缺边、循环、冲突或日期不明影响总量时整体保留UNKNOWN，不把未查明比例按零处理。
  record_fields:
  - M.CandidateAssessment.equity_paths
  - M.CandidateAssessment.final_equity_percentage
  - M.CandidateAssessment.equity_path_status
  - M.CandidateAssessment.evidence
  review_requirements: 这是有序图事实上的人工/确定性计算边界；本领域模型未声称提供任意深度图遍历运行时。
- id: M.ReviewCandidateEvidence
  name: 核实自然人身份与权利证据
  description: 分别核对自然人身份、权利来源、证据可靠性及适用时点；资料字段齐全不等于权利已核实。
  inputs:
  - name: candidate
    label: 候选评估
    type: Ref
    binding: M.CandidateAssessment
    target: M.CandidateAssessment
  - name: evidence
    label: 候选证据
    type: Ref
    binding: M.CandidateAssessment.evidence
    target: M.Evidence
    cardinality:
      min: 0
      max: null
  outputs:
  - name: assessment_state
    label: 评估状态
    type: Enum
    binding: M.CandidateAssessment.assessment_state
    values:
    - IN_REVIEW
    - SUPPORTED
    - NOT_SUPPORTED
    - INCOMPLETE
    - UNKNOWN
  responsible_role: M.IdentificationReviewer
  required_evidence:
  - 自然人官方身份核验结果或有效身份证明与补充材料
  - 组织登记/章程/协议/权利记录及其生效期间
  - 独立来源交叉核实及冲突处理记录
  question_ids:
  - Q.A01.S16
  - Q.A01.S21
  - Q.A01.S56
  - Q.A01.S57
  issue_ids:
  - M.Gap.EvidenceConflict
  - M.Gap.ProposedPolicy
  on_missing: BLOCK
  basis_ids:
  - TERM.A01.KF.02
  - TERM.A01.KF.03
  - TERM.A01.KF.04
  - TERM.A01.KF.05
  - TERM.A01.KF.06
  - TERM.A01.KF.07
  - TERM.A01.KF.09
  - TERM.A01.KF.10
  - TERM.A01.KF.13
  - RULE.A01.KF.IDENTITY
  - RULE.A01.KF.NOMINEE
  nature: BUSINESS_DISCRETION
  criteria:
  - 身份真实性与自然人身份同一性可被可靠来源支持。
  - 材料支持具体权益、收益/表决或控制关系及对应期间，而非仅有姓名或比例标签。
  - 客户材料与独立信息相符；存在冲突时先记录受影响事实并补证。
  record_fields:
  - M.CandidateAssessment.assessment_state
  - M.CandidateAssessment.evidence
  - M.CandidateAssessment.equity_path_status
  review_requirements: 核验结论由金融机构责任人员记录；具体岗位授权依机构制度，本模型不作推定。缺身份或权利证据时阻断受影响结论而非把未知记为否。
- id: M.ReviewCandidatePopulation
  name: 核定组织级候选全集及备位前提
  description: 确定候选与路径核查是否穷尽，以及是否存在任何符合三项一般标准的自然人。
  inputs:
  - name: population
    label: 候选全集评估
    type: Ref
    binding: M.CandidatePopulationAssessment
    target: M.CandidatePopulationAssessment
  - name: candidates
    label: 逐人评估
    type: Ref
    binding: M.CandidatePopulationAssessment.candidate_assessments
    target: M.CandidateAssessment
    cardinality:
      min: 0
      max: null
  outputs:
  - name: search_complete
    label: 候选核查完整
    type: Boolean
    binding: M.CandidatePopulationAssessment.search_complete
  - name: any_qualifying
    label: 存在符合者
    type: Boolean
    binding: M.CandidatePopulationAssessment.any_qualifying_candidate
  responsible_role: M.IdentificationReviewer
  required_evidence:
  - 所有相关自然人候选来源和完整权益/收益/表决/控制路径
  - 每位候选人的三类标准状态及未知/冲突处理依据
  question_ids:
  - Q.A01.S28
  - Q.A01.S29
  issue_ids:
  - M.Gap.EvidenceConflict
  - M.Gap.ProposedPolicy
  on_missing: BLOCK
  basis_ids:
  - TERM.A01.KF.02
  - TERM.A01.KF.03
  - TERM.A01.KF.04
  - TERM.A01.KF.05
  - TERM.A01.KF.06
  - TERM.A01.KF.07
  - TERM.A01.KF.09
  - TERM.A01.KF.10
  - TERM.A01.KF.13
  - RULE.A01.KF.FALLBACK
  nature: BUSINESS_DISCRETION
  criteria:
  - 所有可能自然人及其直接/间接权益、收益/表决和实际控制路径均已覆盖。
  - 候选全集任何缺口、代持争议或控制UNKNOWN都使search_complete不能为TRUE。
  - 只要任一候选满足任何一项一般标准，any_qualifying_candidate为TRUE。
  - 只有全集完整且所有候选三项均确定不成立时才允许备位。
  record_fields:
  - M.CandidatePopulationAssessment.search_complete
  - M.CandidatePopulationAssessment.any_qualifying_candidate
  - M.CandidatePopulationAssessment.fallback_available
  - M.CandidatePopulationAssessment.evidence
  review_requirements: 单个候选人三项均否不等于组织级无人符合；责任人员必须确认候选全集完整。
- id: M.AssessActualControl
  name: 裁定实际控制
  description: 依据具体决定权限、实际作用和证据判断自然人是否单独或联合最终支配组织。
  inputs:
  - name: arrangements
    label: 控制安排
    type: Ref
    binding: M.CandidateAssessment.control_arrangements
    target: M.ControlArrangement
    cardinality:
      min: 0
      max: null
  outputs:
  - name: meets_standard3
    label: 实际控制标准结论
    type: Boolean
    binding: M.CandidateAssessment.meets_standard3
  responsible_role: M.IdentificationReviewer
  required_evidence:
  - 章程、协议和权限条款
  - 任免、重大决策、预算财务或重要资产长期支配记录
  - 联合控制中每个人的权限和共同作用证据
  question_ids:
  - Q.A01.S21
  - Q.A01.S22
  - Q.A01.S23
  - Q.A01.S24
  - Q.A01.S25
  - Q.A01.S26
  issue_ids:
  - M.Gap.EvidenceConflict
  on_missing: BLOCK
  basis_ids:
  - TERM.A01.KF.02
  - TERM.A01.KF.03
  - TERM.A01.KF.04
  - TERM.A01.KF.05
  - TERM.A01.KF.06
  - TERM.A01.KF.07
  - TERM.A01.KF.09
  - TERM.A01.KF.10
  - TERM.A01.KF.13
  - RULE.A01.KF.CONTROL
  nature: BUSINESS_DISCRETION
  criteria:
  - 候选人为自然人且明确指向目标组织。
  - 能指出其最终决定的具体事项以及权限来源。
  - 区分持续实际支配与一般任职、执行、签字或亲属关系。
  - 联合控制时逐人说明权限、共同机制及其在结论中的作用。
  record_fields:
  - M.CandidateAssessment.meets_standard3
  - M.CandidateAssessment.control_arrangements
  - M.CandidateAssessment.assessment_state
  review_requirements: 只有证据足以支持或排除实际控制时才输出TRUE/FALSE；权限范围或实际作用有冲突时输出UNKNOWN并补证。
- id: M.SelectFallbackManager
  name: 选择备位日常管理人员
  description: 只有前三项标准均已确定不成立时，才按真实日常经营管理职责识别备位人员。
  inputs:
  - name: population
    label: 组织级候选全集核查
    type: Ref
    binding: M.CandidatePopulationAssessment
    target: M.CandidatePopulationAssessment
  outputs:
  - name: fallback_person
    label: 备位自然人
    type: Ref
    binding: M.UBOQualification.person
    target: M.NaturalPerson
  responsible_role: M.IdentificationReviewer
  required_evidence:
  - 三项一般识别标准逐项排查与排除理由
  - 章程/治理文件、任职和实际日常管理职责证据
  question_ids:
  - Q.A01.S28
  - Q.A01.S29
  issue_ids: []
  on_missing: BLOCK
  basis_ids:
  - TERM.A01.KF.02
  - TERM.A01.KF.03
  - TERM.A01.KF.04
  - TERM.A01.KF.05
  - TERM.A01.KF.06
  - TERM.A01.KF.07
  - TERM.A01.KF.09
  - TERM.A01.KF.10
  - TERM.A01.KF.13
  - RULE.A01.KF.FALLBACK
  nature: BUSINESS_DISCRETION
  criteria:
  - M.FallbackAvailable必须对目标组织的完整候选全集为TRUE；单个候选人三项为FALSE不足以触发。
  - 不得存在任何符合一般标准的自然人；全集未穷尽或任一相关路径UNKNOWN时阻断。
  - 候选人实际负责日常经营管理并具备适用层级/职责证据。
  - 法定代表人、董事长或经理头衔本身不足以确定人选。
  record_fields:
  - M.CandidatePopulationAssessment.fallback_available
  - M.UBOQualification.person
  - M.UBOQualification.qualification_basis
  - M.IdentificationConclusion.unresolved_items
  review_requirements: 发现上层结构未穿透、代持未核或控制仍有争议时停止备位路径；不以职位字段默认补人。
question_coverage:
- question_id: Q.A01.S13
  model_ids:
  - M.OwnershipLink
  - M.EquityPath
  - M.CandidateAssessment
  - M.AssessOwnershipPaths
  - M.SumEquityPaths
  - M.MeetsEquityThreshold
