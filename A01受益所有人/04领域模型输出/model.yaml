- id: M.Judgment.DifferenceCause
  name: 差异原因和更正后复核
  description: 先与客户沟通核实差异成因，区分机构错误、备案错误和近期变化。；核实客户已经实际更正，并用重新查询或核验的结果复核一致；承诺或报告办结不替代这两项事实。；日期年月差异与影响认定分别记录；近期更新期限标记不覆盖重大性和报告义务。
  inputs:
  - name: institution
    label: 机构经核实的信息
    binding: M.Difference.institution_value
    type: Text
    cardinality:
      min: 0
      max: 1
  - name: filing
    label: 备案信息
    binding: M.Difference.filing_value
    type: Text
    cardinality:
      min: 0
      max: 1
  - name: correction
    label: 实际更正证据
    binding: M.Difference.correction_evidence
    type: Ref
    target: M.Evidence
    cardinality:
      min: 0
      max: null
  - name: recheck
    label: 复核一致证据
    binding: M.Difference.recheck_evidence
    type: Ref
    target: M.Evidence
    cardinality:
      min: 0
      max: null
  outputs:
  - name: cause
    label: 差异成因
    binding: M.Difference.cause
    type: Enum
    values:
    - 机构识别错误
    - 备案信息错误
    - 近期变化待更新
    - 双方均需核实
    - 尚未查明
    cardinality:
      min: 0
      max: 1
  - name: impact
    label: 差异影响受益所有人认定
    binding: M.Difference.affects_ubo
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: corrected
    label: 客户已实际更正
    binding: M.Difference.customer_corrected
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: consistent
    label: 再次核验或查询比对一致
    binding: M.Difference.recheck_consistent
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: reason
    label: 重大性和处置理由
    binding: M.Difference.reason
    type: Text
    cardinality:
      min: 0
      max: 1
