- question_id: K.Q.14
  question: 哪些事实触发加强识别，如何选择加强措施，何时才限制、拒绝或终止业务？
  answer: 触发→措施→剩余风险→限制/退出。 12号令第二十条列出五类触发：高风险国家或地区等特定风险；无法核实境外登记、循环嵌套、交叉持股、协议控制、代持等复杂结构；无合理理由频繁变更法定代表人、高管或受益所有人等异常变化；既有信息真实性可靠性存疑，包括重大差异；以及有合理理由怀疑洗钱或恐怖融资。触发后按具体原因从更全面身份信息、额外独立可靠来源、代持协议等证明、回访或实地走访、加强交易监测、更严格阈值、提高更新频率和高级管理层批准中选择一种或多种。10%是条文列举的更严格股权类阈值示例，不是所有高风险客户统一阈值。采取加强措施后，确需管理剩余风险的才可合理限制；只有风险超出机构风险管理能力时才应拒绝或终止。
