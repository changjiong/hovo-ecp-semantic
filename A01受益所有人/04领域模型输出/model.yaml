  answer: 制度风险全集门控；现行操作单列为观察。 简化取决于风险评估及所用措施与风险匹配。高风险来源、无法核实的境外持股、循环嵌套、交叉持股、协议控制或代持等复杂结构、无合理理由的异常人员变化、资料可靠性存疑或合理洗钱怀疑，均要求另作加强处理；本样章未完整展开全部加强措施。
