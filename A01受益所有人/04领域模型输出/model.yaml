  severity: HIGH
- id: M.Gap.DatedPublishing
  kind: MODEL_GAP
  statement: 上游备案期限事项与权利形成日规则共享来源陈述，合同要求继续追溯；备案期限本身不进入本模型，也不改变权利生效日的判断。
  affects:
  - ISSUE.A01.KF.DATED_PUBLISHING
  - RULE.A01.KF.DATES
  - Q.A01.S60
  - Q.A01.S61
  - Q.A01.S62
  owner: 备案主体及法规维护人
  recommendation: 由领域知识阶段另行处理备案期限口径；本模型只核权利生效证据和日期精度。
  until_resolved: 备案期限保持上游OPEN；不得把登记、披露或备案日替代权利形成日。
  status: OPEN
  severity: MEDIUM
- id: M.Gap.ProposedPolicy
  kind: MODEL_GAP
  statement: 业务讨论要求保留日期精度、缺证状态、证据链与人工复核，但未提供机构或专家正式作业来源，不可把设计建议写成普遍强制细则。
  affects:
  - ISSUE.A01.KF.PROPOSED_POLICY
  - RULE.A01.KF.IDENTITY
  - Q.A01.S56
  - Q.A01.S57
