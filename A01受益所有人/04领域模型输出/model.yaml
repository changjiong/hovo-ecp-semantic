  gap_ids: []
  facets:
    scope:
      source_text: 一般标准二；仅针对未满足持有权益标准一的自然人
      model_refs:
      - M.OtherRight
      - M.CandidateAssessment
      explanation: 仅承接自然人识别所需的稳定事实或判断；备案、机构操作和风险治理口径仍留在固定领域知识。
