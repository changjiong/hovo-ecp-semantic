- question_id: K.Q.15
  question: 金融机构何时可以免于识别或采取简化识别，备案承诺免报与其有何区别？
  answer: 免识别、简化、一般识别、备案免报四结论并列。 先核对是否属于12号令第十条列明的免识别主体；不属于时再核对第十一、十三、十四条的具体简化分支及其风险前提。专业服务机构、合作经济组织、个人独资企业、合格境外投资者、社会组织、国有企业、信托和资管产品的处理各有不同，不能概括成法定代表人一律替代。国有独资、国有控股等性质应有官方信息或适用的性质判断证据；国有参股公司只是不再识别国有资本部分，非国有部分仍按一般标准。3号令第三条的承诺免报仅减免备案主体向登记系统报送受益所有人信息，备案指南明确金融机构仍须开展识别。主体出现第二十条风险或无法准确判断条件时，第二十五条直接阻断简化与豁免。
