  statement: 本轮仅对8个问题直接相关的原文条款和BOMIS安全查询单元做深度回读；地方操作手册全部界面图、BOMIS其余千余报文字段及8题以外业务含义未宣称完成。
  affects:
  - K.ISSUE.EXT.GOV.BROAD_UNITS
  - K.Q.10
  - K.Q.12
  - K.Q.13
  - K.Q.14
  - K.Q.15
  - K.Q.16
  - K.Q.20
  - K.Q.21
  owner: 领域知识整理者
  recommendation: 集成时只升级unit_reviews列明单元，其他单元保留原有PARTIAL或NOT_REVIEWED状态。
