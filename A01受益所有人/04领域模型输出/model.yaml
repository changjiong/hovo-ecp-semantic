      max: 1
  - name: institution
    label: 机构具有查询权限
    binding: M.Access.institution_authorized
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: operator
    label: 经办授权有效
    binding: M.Access.operator_authorized
    type: Boolean
    cardinality:
      min: 0
      max: 1
  responsible_role: M.Appointment
  required_evidence:
  - 主体登记及类别依据
  - 法定职责或反洗钱用途记录
  - 机构和经办授权
  - 责任核查所需制度全文
  question_ids:
  - K.Q.01
  - K.Q.15
  - K.Q.20
  - K.Q.21
  issue_ids: []
  on_missing: BLOCK
  basis_ids:
  - K.R.01
  - K.R.20
  - K.R.21
  - K.R.EXT.GOV.20.ACCESS
  - K.R.EXT.GOV.21.LIABILITY
  - K.R.EXT.GOV.15.EXEMPT
  - K.R.EXT.GOV.15.SIMPLIFY
  nature: BUSINESS_DISCRETION
