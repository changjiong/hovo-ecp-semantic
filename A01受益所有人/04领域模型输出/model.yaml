  - name: kind
    label: 信托业务类别
    binding: M.Subject.trust_kind
    type: Enum
    values:
    - 财富管理服务信托
    - 公益慈善信托
    - 民事信托
    - 外国信托
    - 其他资产服务信托
    - 不适用
    cardinality:
      min: 0
      max: 1
  - name: simple
    label: 信托结构简单
    binding: M.ProductAssessment.simple_structure
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: low
    label: 风险已充分评估为低
    binding: M.ProductAssessment.low_risk
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: risk
    label: 产品风险已充分评估
    binding: M.ProductAssessment.risk_assessment_complete
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: risk_block
    label: 存在加强识别触发情形
    binding: M.Identification.risk20_triggered
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: data_doubt
    label: 信息准确性或完整性存疑
    binding: M.Identification.data_doubt
    type: Boolean
    cardinality:
      min: 0
      max: 1
  result:
    type: Boolean
    cardinality:
      min: 0
      max: 1
  expression:
    op: and
    args:
    - op: and
      args:
      - op: eq
        args:
        - input: kind
        - literal:
            type: Text
            value: 其他资产服务信托
      - input: simple
      - input: low
      - input: risk
    - op: not
      args:
      - input: risk_block
    - op: not
      args:
      - input: data_doubt
  on_unknown: PROPAGATE
  basis_ids:
  - K.R.09.TYPE
  question_ids:
  - K.Q.09
  depends_on: []
  result_binding: M.ProductAssessment.simplify_allowed
  business_meaning: 只有其他资产服务信托在结构简单且风险较低时可以简化；财富管理、公益慈善、民事和外国信托完整识别。
- id: M.Rule.AssetSimplification
  name: 资管产品简化条件
  description: 金融机构管理或受托并处于相应服务场景，公开募集发行且依法登记，或其他低风险产品依具体条件可简化；实际管理自然人必须具体核实。
