- id: M.Process.G8
  name: 地方备案办理
  question_ids:
  - K.Q.22
  trigger: 开始处理地方备案办理时，固定主体、用途、业务时点和本机构责任。
  steps:
  - id: M.Step.G8.FilingSubmit
    name: 备案资料和人员关系完整后提交
    kind: DETERMINE
    uses:
    - M.Rule.FilingSubmit
    reads:
    - M.Filing.all_people_recorded
    - M.Filing.all_relations_recorded
    - M.Filing.submission_checked
    - M.Identification.local_routing
    writes:
    - M.Filing.can_submit
    depends_on:
    - M.Step.G8.FilingRoute
    on_missing: BLOCK
    description: 按实际所在地指引进入办理，逐人逐关系核对后提交并保存回执；资料变化另按期限更新。
    basis_ids:
    - K.R.22
  - id: M.Step.G8.FilingRoute
    name: 地方办理方式和入口核对
    kind: VERIFY
    uses:
    - M.Judgment.FilingRoute
    reads:
    - M.Filing.evidence
    - M.Filing.method
    - M.Filing.subject
    writes:
    - M.Identification.local_routing
    depends_on: []
    on_missing: BLOCK
    description: 根据主体实际办理地区选用该地权威办理指引，不把北京和深圳的入口要求混用。；核实真实免报条件或自行填报路径，系统推荐信息须核实后采用；录入全部应报人员及其全部适用关系。；检查后提交并保存结果回执，后续变化仍按法定期限更新。
    basis_ids:
    - K.R.22
  basis_ids:
  - K.R.22
- id: M.Process.G9
  name: BOMIS核验、查询与办理
  question_ids:
  - K.Q.23
  - K.Q.23.CURRENT
  - K.Q.23.HISTORY
  - K.Q.23.VERIFY
  - K.Q.24
  - K.Q.24.CASE
  - K.Q.24.FILE
  - K.Q.24.PARAM
  - K.Q.24.REPORT
  - K.Q.24.STATUS
  trigger: 开始处理BOMIS核验、查询与办理时，固定主体、用途、业务时点和本机构责任。
  steps:
  - id: M.Step.G9.QueryAllowed
    name: 核验报文允许发送
    kind: DETERMINE
    uses:
    - M.Rule.QueryAllowed
    reads:
    - M.Access.allowed
    - M.Query.batch
    - M.Query.daily_used_before
    - M.Query.parameters_current
    - M.Query.quota
    - M.Query.subject_count
    writes:
    - M.Query.query_allowed
    depends_on: []
    on_missing: BLOCK
    description: 当日未达上限时可受理本批次；本批次跨额度仍整批核验，后续报文停止，不能截断为额度内部分。
    basis_ids:
    - K.R.23
    - K.R.23.VERIFY
  - id: M.Step.G9.DailyStop
    name: 本批次后是否停止后续核验
    kind: DETERMINE
    uses:
    - M.Rule.DailyStop
    reads:
    - M.Query.daily_used_before
    - M.Query.quota
    - M.Query.subject_count
    writes:
    - M.Query.triggers_daily_stop
    depends_on: []
    on_missing: BLOCK
    description: 按单笔与批量的主体数合计；跨限批次处理完后停止后续报文。
    basis_ids:
    - K.R.23.VERIFY
  - id: M.Step.G9.QueryMatch
    name: 反馈关联原请求
    kind: DETERMINE
    uses:
    - M.Rule.QueryMatch
    reads:
    - M.Query.request_reference
    - M.Query.response_reference
    writes:
    - M.Query.feedback_matched
    depends_on: []
    on_missing: BLOCK
    description: 核对请求及异步反馈的业务关联号；不能把别次请求的成功反馈用于本次。
    basis_ids:
    - K.R.23
    - K.R.23.CURRENT
    - K.R.23.HISTORY
  - id: M.Step.G9.QueryUsable
    name: 逐主体业务结果可用
    kind: DETERMINE
    uses:
    - M.Rule.QueryUsable
    reads:
    - M.Query.business_feedback_success
    - M.Query.feedback_matched
    - M.Query.feedback_received
    - M.Query.per_subject_complete
    writes:
    - M.Query.result_usable
    depends_on:
    - M.Step.G9.QueryMatch
    on_missing: BLOCK
    description: 接收或格式校验成功不等于业务核验完成；逐主体反馈齐备且匹配才可用，无反馈不是无受益所有人。
    basis_ids:
    - K.R.23
    - K.R.23.VERIFY
    - K.R.23.CURRENT
  - id: M.Step.G9.CurrentQuery
