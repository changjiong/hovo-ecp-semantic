  - K.R.03
  question_ids:
  - K.Q.03
  depends_on:
  - M.Rule.EquityTotal
  result_binding: M.PersonAssessment.standard1
  business_meaning: 最终股权或合伙权益达到25%即达标；不将24.99%四舍五入为25%。
- id: M.Rule.Standard2
