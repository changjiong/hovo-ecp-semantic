    name: 确认客户与判断时点
    kind: DETERMINE
    uses:
    - M.SelectIdentificationRoute
    reads:
    - M.IdentificationRouteAssessment.evidence
    - M.IdentificationRouteAssessment.target_organization
    - M.Organization.organization_form
    - M.Organization.state_ownership_status
    writes:
    - M.IdentificationRouteAssessment.as_of
    - M.IdentificationRouteAssessment.route
    depends_on: []
    on_missing: BLOCK
    description: 确认金融机构客户身份、组织类别和同一判断时点；不办理或评价备案。
    basis_ids:
    - RULE.A01.KF.PROFILE
    - RULE.A01.KF.EXCEPTIONS
  - id: M.Step.Branch
    name: 核实分支所属关系
    kind: VERIFY
    uses:
    - M.ReviewBranchAffiliation
    reads:
    - M.BranchAffiliation.branch_organization
    - M.BranchAffiliation.effective_from
    - M.BranchAffiliation.end_status
    - M.BranchAffiliation.evidence
    - M.BranchAffiliation.head_organization
    writes:
    - M.BranchAffiliation.evidence
    - M.IdentificationConclusion.result_state
    depends_on:
    - M.Step.Scope
    on_missing: CONTINUE_WITH_GAP
    description: 仅在分支为目标或权益路径节点时执行；关系不明则阻断承继。
    basis_ids:
    - RULE.A01.KF.BRANCHES
  - id: M.Step.Route
    name: 判定一般、简化或免识别路线
    kind: DETERMINE
    uses:
    - M.SelectIdentificationRoute
    - M.SelectStateOwnedRoute
    reads:
    - M.IdentificationRouteAssessment.evidence
    - M.IdentificationRouteAssessment.target_organization
    - M.Organization.organization_form
    - M.Organization.state_ownership_status
    - M.RiskAssessment.triggers
    writes:
    - M.IdentificationRouteAssessment.risk_gate_passed
    - M.IdentificationRouteAssessment.route
    - M.IdentificationRouteAssessment.route_basis
    depends_on:
    - M.Step.Scope
    on_missing: BLOCK
    description: 一般识别为基线；只有组织类别、人选及风险闸门均满足相应规定才采用简化或免识别。
    basis_ids:
    - RULE.A01.KF.EXCEPTIONS
    - RULE.A01.KF.SOE
  - id: M.Step.Relationships
    name: 建立权益、收益、表决与控制事实
    kind: VERIFY
    uses:
    - M.ReviewCandidateEvidence
    - M.AssessActualControl
    reads:
    - M.CandidateAssessment.control_arrangements
    - M.CandidateAssessment.evidence
    - M.ControlArrangement.target_organization
    - M.OtherRight.target_organization
    - M.OwnershipLink.target_organization
    writes:
    - M.CandidateAssessment.assessment_state
    - M.CandidateAssessment.meets_standard3
    - M.ControlArrangement.evidence
    - M.OtherRight.evidence
    - M.OwnershipLink.evidence
    depends_on:
    - M.Step.Route
    on_missing: CONTINUE_WITH_GAP
    description: 把名义持有与最终权利、收益权、表决权、实际控制分开，并逐条绑定材料和期间。
    basis_ids:
    - RULE.A01.KF.EQUITY
    - RULE.A01.KF.NOMINEE
    - RULE.A01.KF.RETURNS_VOTES
    - RULE.A01.KF.CONTROL
  - id: M.Step.Candidate
    name: 核验自然人并逐项评估三类标准
    kind: DETERMINE
    uses:
    - M.AssessOwnershipPaths
    - M.ReviewCandidateEvidence
    - M.SumEquityPaths
    - M.MeetsEquityThreshold
    - M.MeetsBenefitVoteThreshold
    - M.AssessActualControl
    reads:
    - M.CandidateAssessment.control_arrangements
    - M.CandidateAssessment.equity_path_status
    - M.CandidateAssessment.equity_paths
    - M.CandidateAssessment.evidence
    - M.CandidateAssessment.final_benefit_percentage
    - M.CandidateAssessment.final_equity_percentage
    - M.CandidateAssessment.final_voting_percentage
    - M.CandidateAssessment.meets_standard1
    - M.CandidateAssessment.ownership_links
    writes:
    - M.CandidateAssessment.assessment_state
    - M.CandidateAssessment.equity_path_status
    - M.CandidateAssessment.equity_paths
    - M.CandidateAssessment.final_equity_percentage
    - M.CandidateAssessment.meets_standard1
    - M.CandidateAssessment.meets_standard2
    - M.CandidateAssessment.meets_standard3
    depends_on:
    - M.Step.Relationships
    on_missing: CONTINUE_WITH_GAP
