  - name: effective
    label: 已有效履行识别义务
    binding: M.ProductAssessment.manager_duties_effective
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: doubt
    label: 所得信息存在疑点
    binding: M.ProductAssessment.doubts
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: managers
    label: 实际管理自然人已具体识别
    binding: M.ProductAssessment.manager_people_identified
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: party_scope
    label: 信托各类当事人和其他控制人范围完整
    binding: M.ProductAssessment.trust_party_scope_complete
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: lookthrough
    label: 组织当事人穿透完整
    binding: M.ProductAssessment.trust_lookthrough_complete
