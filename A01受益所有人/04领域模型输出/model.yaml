- id: M.Rule.Fallback
  name: 是否可以采用管理人员兜底
  description: 完整核验前三项且未识别出自然人时才可从最高层级日常经营管理人员中至少确定一人；缺证不能启动兜底；同一最高层级存在多名人员时，按公司章程（合伙企业按合伙协议）层级顺位取第一顺位并记录依据（用户已答口径）。
  inputs:
  - name: checked
    label: 前三项标准已全部核验
    binding: M.Identification.all_standards_checked
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: complete
    label: 权利结构已完整核实
    binding: M.Identification.structure_complete
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: positive
    label: 存在按前三项标准认定的自然人
    binding: M.Identification.any_standard_positive
    type: Boolean
    cardinality:
      min: 0
      max: 1
  result:
    type: Boolean
    cardinality:
      min: 0
      max: 1
  expression:
    op: and
    args:
    - input: checked
    - input: complete
    - op: not
      args:
      - input: positive
  on_unknown: PROPAGATE
  basis_ids:
  - K.R.06
  question_ids:
  - K.Q.06
  depends_on: []
  result_binding: M.Identification.fallback_allowed
  business_meaning: 完整核验前三项且未识别出自然人时才可从最高层级日常经营管理人员中至少确定一人；缺证不能启动兜底；同一最高层级存在多名人员时，按公司章程（合伙企业按合伙协议）层级顺位取第一顺位并记录依据（用户已答口径）。
- id: M.Rule.Article44
  name: 第四条第四项性质条件
  description: 合格出资人、持股未超过50%、第一大股东和有证据的实际支配同时成立；超过50%另按相应条款判断。
  inputs:
  - name: investor
    label: 出资人身份符合相应条款
    binding: M.StateNature.qualified_investor
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: ratio
    label: 国有持股比例
    binding: M.StateNature.state_ratio
    type: Decimal
    cardinality:
      min: 0
      max: 1
  - name: largest
    label: 属于第一大股东
    binding: M.StateNature.largest_shareholder
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: dominance
    label: 国有主体实际支配已核实
    binding: M.StateNature.actual_dominance
    type: Boolean
    cardinality:
      min: 0
      max: 1
  result:
    type: Boolean
    cardinality:
      min: 0
      max: 1
  expression:
    op: and
    args:
    - input: investor
    - op: lte
      args:
      - input: ratio
      - literal:
          type: Decimal
          value: 0.5
    - input: largest
    - input: dominance
  on_unknown: PROPAGATE
  basis_ids:
  - K.R.07.NATURE
  question_ids:
  - K.Q.07
  - K.Q.07.NATURE
  depends_on: []
  result_binding: M.StateNature.article4_4
  business_meaning: 合格出资人、持股未超过50%、第一大股东和有证据的实际支配同时成立；超过50%另按相应条款判断。
- id: M.Rule.RelativeHolding
  name: 衔接国有相对控股口径
  description: 按已记录的用户口径从第四条第四项性质认定衔接国有相对控股；仍需另做12号令适用及风险判断。
  inputs:
  - name: nature
    label: 第四条第四项条件成立
    binding: M.StateNature.article4_4
    type: Boolean
    cardinality:
      min: 0
      max: 1
  result:
    type: Boolean
    cardinality:
      min: 0
      max: 1
  expression:
    input: nature
  on_unknown: PROPAGATE
  basis_ids:
  - K.R.07.NATURE
  - K.R.07.APPLY
  question_ids:
  - K.Q.07
  - K.Q.07.APPLY
  - K.Q.07.NATURE
  depends_on:
  - M.Rule.Article44
  result_binding: M.StateNature.relative_holding
  business_meaning: 按已记录的用户口径从第四条第四项性质认定衔接国有相对控股；仍需另做12号令适用及风险判断。
- id: M.Rule.StateApplicability
  name: 金融机构国企简化主体范围
  description: 官方性质依据可靠后判断列明主体或已衔接相对控股范围；国有参股只可处理其国有资本部分，不能整户直接按法定代表人简化。
  inputs:
  - name: relative
    label: 按已确认口径属于国有相对控股
    binding: M.StateNature.relative_holding
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: nature
    label: 认定的企业性质
    binding: M.StateNature.nature
    type: Text
    cardinality:
      min: 0
      max: 1
  - name: official
    label: 企业性质已有可靠官方依据
    binding: M.StateNature.officially_verified
    type: Boolean
    cardinality:
      min: 0
      max: 1
  result:
    type: Boolean
    cardinality:
      min: 0
      max: 1
  expression:
    op: and
    args:
    - input: official
    - op: or
      args:
      - input: relative
      - op: contains
        args:
        - op: list
          args:
          - literal:
              type: Text
              value: 国有独资公司
          - literal:
              type: Text
              value: 国有控股公司
          - literal:
              type: Text
              value: 全民所有制企业
          - literal:
              type: Text
              value: 集体所有制企业
          - literal:
              type: Text
              value: 联营企业
        - input: nature
  on_unknown: PROPAGATE
  basis_ids:
  - K.R.07
  - K.R.07.APPLY
  - K.R.EXT.GOV.15.STATE
  question_ids:
  - K.Q.07
  - K.Q.07.APPLY
  - K.Q.15
  depends_on:
  - M.Rule.RelativeHolding
  result_binding: M.StateNature.cdd_branch_applicable
  business_meaning: 官方性质依据可靠后判断列明主体或已衔接相对控股范围；国有参股只可处理其国有资本部分，不能整户直接按法定代表人简化。
- id: M.Rule.StateSimplification
  name: 国企简化风险门控
  description: 性质与适用判断完成、风险评估充分且无阻断情形时才可以简化；结果表示允许，不表示必须自动采用。
  inputs:
  - name: applicable
    label: 符合金融机构简化的主体范围
    binding: M.StateNature.cdd_branch_applicable
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: risk_complete
    label: 风险评估已完成
    binding: M.Identification.risk_assessment_complete
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: trigger
    label: 存在加强识别触发情形
    binding: M.Identification.risk20_triggered
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: doubt
    label: 信息准确性或完整性存疑
    binding: M.Identification.data_doubt
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: matched
    label: 所选简化措施与风险相匹配
    binding: M.Identification.matched_risk_measure
    type: Boolean
    cardinality:
      min: 0
      max: 1
  result:
    type: Boolean
    cardinality:
      min: 0
      max: 1
  expression:
    op: and
    args:
    - input: applicable
    - input: risk_complete
    - op: not
      args:
      - input: trigger
    - op: not
      args:
      - input: doubt
    - input: matched
  on_unknown: PROPAGATE
  basis_ids:
  - K.R.07
  - K.R.07.RISK
  - K.R.EXT.GOV.15.STATE
  question_ids:
  - K.Q.07
  - K.Q.07.RISK
  - K.Q.15
  depends_on:
  - M.Rule.StateApplicability
  result_binding: M.Identification.simplification_allowed
  business_meaning: 性质与适用判断完成、风险评估充分且无阻断情形时才可以简化；结果表示允许，不表示必须自动采用。
- id: M.Rule.BranchRoute
  name: 分支机构识别路径
  description: 国内分支沿用须确认本机构已完成所属主体尽调；外国分支同时保留所属公司穿透和本分支高管两条来源。
  inputs:
  - name: kind
    label: 主体类型
    binding: M.Subject.kind
    type: Enum
    values:
    - 公司
    - 合伙企业
    - 国内分支机构
    - 外国公司分支机构
    - 外国公司
    - 信托
    - 资产管理产品
    - 个体工商户
    - 机关事业单位
    - 其他非自然人主体
    cardinality:
      min: 0
      max: 1
  - name: reused
    label: 本机构已对所属主体完成尽调
    binding: M.Identification.branch_reuse_verified
    type: Boolean
    cardinality:
      min: 0
      max: 1
  result:
    type: Text
    cardinality:
      min: 0
      max: 1
  expression:
    op: if
    args:
    - op: eq
      args:
      - input: kind
      - literal:
          type: Text
          value: 国内分支机构
    - op: if
      args:
      - input: reused
      - literal:
          type: Text
          value: 沿用本机构已完成尽调的所属主体结果
      - literal:
          type: Text
          value: 先对所属主体完成识别核实
    - op: if
      args:
      - op: eq
        args:
        - input: kind
        - literal:
            type: Text
            value: 外国公司分支机构
      - literal:
          type: Text
          value: 穿透所属外国公司并加入分支机构高级管理人员
      - literal:
          type: Text
          value: 非本规则分支
  on_unknown: PROPAGATE
  basis_ids:
  - K.R.08
  question_ids:
  - K.Q.08
  depends_on: []
  result_binding: M.Identification.branch_result
  business_meaning: 国内分支沿用须确认本机构已完成所属主体尽调；外国分支同时保留所属公司穿透和本分支高管两条来源。
- id: M.Rule.TrustFull
  name: 完整信托当事人识别
  description: 完整纳入各类当事人及其他最终有效控制自然人，组织当事人继续穿透；具体受益人未定时记录范围，不能造人。
  inputs:
  - name: scope
    label: 信托各类当事人和其他控制人范围完整
    binding: M.ProductAssessment.trust_party_scope_complete
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: lookthrough
    label: 组织当事人穿透完整
    binding: M.ProductAssessment.trust_lookthrough_complete
    type: Boolean
    cardinality:
      min: 0
      max: 1
  result:
    type: Boolean
    cardinality:
      min: 0
      max: 1
  expression:
    op: and
    args:
    - input: scope
    - input: lookthrough
  on_unknown: PROPAGATE
  basis_ids:
  - K.R.09
  question_ids:
  - K.Q.09
  depends_on: []
  result_binding: M.ProductAssessment.full_trust_identification
  business_meaning: 完整纳入各类当事人及其他最终有效控制自然人，组织当事人继续穿透；具体受益人未定时记录范围，不能造人。
- id: M.Rule.TrustSimplification
  name: 信托类型和风险分支
  description: 只有其他资产服务信托在结构简单且风险较低时可以简化；财富管理、公益慈善、民事和外国信托完整识别。
