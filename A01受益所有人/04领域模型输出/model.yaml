    basis_ids:
    - RULE.A01.KF.EQUITY
    - RULE.A01.KF.RETURNS_VOTES
    - RULE.A01.KF.CONTROL
    - RULE.A01.KF.IDENTITY
    - RULE.A01.KF.DATES
  - id: M.Step.Fallback
    name: 仅在组织级无人符合时评估备位
    kind: DETERMINE
    uses:
    - M.ReviewCandidatePopulation
    - M.FallbackAvailable
    - M.SelectFallbackManager
    reads:
    - M.CandidatePopulationAssessment.any_qualifying_candidate
    - M.CandidatePopulationAssessment.candidate_assessments
    - M.CandidatePopulationAssessment.search_complete
    writes:
    - M.CandidatePopulationAssessment.any_qualifying_candidate
    - M.CandidatePopulationAssessment.fallback_available
    - M.CandidatePopulationAssessment.search_complete
    - M.UBOQualification.person
    - M.UBOQualification.qualification_basis
    depends_on:
    - M.Step.Candidate
    on_missing: BLOCK
    description: 只有候选全集和全部相关路径核查完整且无人符合一般标准时才启用备位；单个候选不达标不足以触发。
    basis_ids:
    - TERM.A01.KF.06
    - RULE.A01.KF.FALLBACK
  - id: M.Step.Risk
    name: 选择相称加强核实措施
    kind: DETERMINE
    uses:
    - M.SelectRiskMeasures
    reads:
    - M.RiskAssessment.evidence
    - M.RiskAssessment.triggers
    writes:
    - M.RiskAssessment.residual_risk
    - M.RiskAssessment.selected_measures
    depends_on:
    - M.Step.Candidate
    on_missing: CONTINUE_WITH_GAP
    description: 针对具体风险事实补证并评价效果；不把风险措施变成通用识别阈值或拒办决定。
    basis_ids:
    - RULE.A01.KF.RISK
    - RULE.A01.KF.EXCEPTIONS
  - id: M.Step.Conclusion
    name: 形成有依据的识别结论
    kind: RECORD
    uses: []
    reads:
    - M.CandidateAssessment.assessment_state
    - M.CandidateAssessment.evidence
    - M.UBOQualification.qualification_basis
    - M.RiskAssessment.residual_risk
    writes:
    - M.IdentificationConclusion.result_state
    - M.IdentificationConclusion.qualifications
    - M.IdentificationConclusion.unresolved_items
    depends_on:
    - M.Step.Fallback
    - M.Step.Risk
    on_missing: CONTINUE_WITH_GAP
    description: 按自然人、权利标准、有效期间、证据和未决事项记录可支持部分；不输出备案或差异报告。
    basis_ids:
    - RULE.A01.KF.IDENTITY
    - RULE.A01.KF.RISK
    - RULE.A01.KF.FALLBACK
