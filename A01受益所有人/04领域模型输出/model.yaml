    - M.DifferenceReport.new_person_name_present
    - M.DifferenceReport.new_person_present
    - M.DifferenceReport.nonmajor_policy_confirmed
    - M.DifferenceReport.old_person_present
    - M.DifferenceReport.operation
    - M.DifferenceReport.organization_change
    - M.DifferenceReport.person_change
    - M.DifferenceReport.promise_or_state_condition
    - M.DifferenceReport.subject_code_present
    - M.DifferenceReport.subject_in_system
    - M.DifferenceReport.subtype
    - M.DifferenceReport.support_present
    - M.DifferenceReport.system_people_empty
    - M.DifferenceReport.verification_consistent
    writes:
    - M.DifferenceReport.required_content_complete
    depends_on: []
    on_missing: BLOCK
    description: 四类报备、两类补充、三类审批和确认无差异按各自条件处理；新增修改删除的原新人员边界明确，非重大接口报备实施口径未确认时不发送。
    basis_ids:
    - K.R.24
    - K.R.24.REPORT
  - id: M.Step.G9.ReportSubmit
