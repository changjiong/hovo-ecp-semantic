    writes:
    - M.Query.state
    depends_on: []
    on_missing: BLOCK
    description: 按实际业务反馈及条件计算允许的状态变化；不写外部系统。
    basis_ids:
    - K.R.23
    - K.R.23.VERIFY
    - K.R.23.CURRENT
  - id: M.Step.G9.Report
    name: 差异报告办理
