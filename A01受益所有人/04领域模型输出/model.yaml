  inputs:
  - name: kind
    label: 主体类型
    binding: M.Subject.kind
    type: Enum
    values:
    - 公司
    - 合伙企业
    - 国内分支机构
    - 外国公司分支机构
    - 外国公司
    - 信托
    - 资产管理产品
    - 个体工商户
    - 机关事业单位
    - 其他非自然人主体
    cardinality:
      min: 0
      max: 1
  - name: date
    label: 业务判断日期
    binding: M.Identification.as_of
    type: Date
    cardinality:
      min: 0
      max: 1
