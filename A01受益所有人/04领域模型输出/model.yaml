- question_id: K.Q.24.REPORT
  question: 怎样按事实选择报告类型及补充内容？
  answer: 事实分类、报告类型和字段边界。 先判断法定差异义务，再按实际事实区分报备、补充、审批和确认无差异。补充类仅能新增；信息完整类可按实际差异增改删；部分缺失类不能为缺字段而虚构全套资料，身份存疑类不提交未经确认的人员改动。退回补充后，应核对最新主体事实及原报告，按要求补齐分析和证明。非重大差异报备是接口能力，其实际启用要求仍需合规确认，不能据接口能力推翻12号令无需差异报告的实体规则。
