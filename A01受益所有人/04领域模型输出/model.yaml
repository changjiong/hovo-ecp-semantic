- question_id: K.Q.01
  question: 哪些主体和业务关系适用受益所有人要求？
  answer: 备案与金融机构识别双轴分流；不适用仅限本专项。 本题先分清两项不同义务。第一步判断是否属于3号令的备案主体：公司、合伙企业、外国公司分支机构以及两部门另行规定的其他主体应通过登记注册系统备案；个体工商户无需备案。第二版备案指南进一步说明，当前非公司企业法人、个人独资企业、农民专业合作社（联合社）及其分支机构、境内公司和合伙企业的分支机构暂无需备案，这一表述是现行备案办理说明，不能扩大成永久法定排除。第二步另行判断是否进入12号令的金融机构客户受益所有人识别：承担客户尽职调查义务的机构在为非自然人客户开展尽职调查时，应按客户组织形式和风险识别、合理核实并用于洗钱风险管理；个体工商户被12号令明确排除在本办法所称非自然人客户之外。两条线可以同时成立，也可以只成立一条。例如，公司开户既有企业备案义务，又有银行独立识别核实义务；当前无需备案的非公司企业法人如果成为金融机构非自然人客户，仍可能进入12号令识别。备案、BOMIS查询或地方系统办理结果均不能替代金融机构的独立风险判断。当前限定材料未包含12号令第二条所引用的2025年第11号令，因此可以确定义务机构需以该令为边界，但不能从本语料完整列举全部义务机构。
  rule_ids:
  - K.R.01
