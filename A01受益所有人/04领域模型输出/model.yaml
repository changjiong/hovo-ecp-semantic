      - M.AssessActualControl.criteria
      explanation: 仅承接自然人识别所需的稳定事实或判断；备案、机构操作和风险治理口径仍留在固定领域知识。
      status: MANUAL
    missing_evidence:
      source_text: 协议和章程中的权限、董事及重大决策记录、任免与预算授权、银行账户/重要资产长期支配事实、联合行动及实际行使证据。
      model_refs:
      - M.ControlArrangement.evidence
      - M.AssessActualControl.required_evidence
      explanation: 仅承接自然人识别所需的稳定事实或判断；备案、机构操作和风险治理口径仍留在固定领域知识。
      status: FORMALIZED
    effective_period:
      source_text: 实际控制形成及终止与协议生效和长期事实持续区间对应，不以后来的标签追溯历史。
