types:
- id: M.Organization
  name: 组织主体
  kind: ENTITY
  description: 受益所有人识别的目标组织或权益链中的中间组织。
  basis_ids:
  - TERM.A01.KF.02
  - RULE.A01.KF.EQUITY
  identity:
  - registration_identifier
  - jurisdiction
  fields:
  - name: registration_identifier
    label: 登记识别号
    type: Text
    cardinality:
      min: 1
      max: 1
    description: 官方登记或设立文件中的稳定主体识别号。缺失时不能虚构组织身份。
  - name: jurisdiction
    label: 登记/设立法域
    type: Text
    cardinality:
      min: 1
      max: 1
    description: 该组织登记或依法设立的法域，用于解释组织身份及证据适用范围。
  - name: official_name
    label: 法定名称
    type: Text
    cardinality:
      min: 1
      max: 1
    description: 与判断时点相符的登记或设立文件名称。
  - name: supporting_evidence
    label: 组织身份依据
    type: Ref
    cardinality:
      min: 1
      max: null
    description: 登记、设立、产权、章程或治理依据。
    target: M.Evidence
  examples:
  - 有登记号和法域、且在判断日存续的公司客户。
  counterexamples:
  - 名称相同但登记身份不同的组织不能合并为同一主体。
  term_origin: KNOWLEDGE
  business_sentence: 金融机构把组织主体作为客户，或把它作为权益链中的中间节点来识别最终自然人。
  why_object: 目标组织与中间持股组织具有独立身份；权益路径必须明确每段指向的组织。
  identity_description: 以登记识别号与登记/设立法域区分同名组织；更名或恢复登记须有连续身份和有效期间证据。
- id: M.NaturalPerson
  name: 自然人
  kind: ENTITY
  description: 最终受益所有人必须落到的现实自然人；身份同一性与其权利是否达标分别判断。
  basis_ids:
  - TERM.A01.KF.02
  - TERM.A01.KF.04
  - RULE.A01.KF.IDENTITY
  - RULE.A01.KF.CONTROL
  identity:
  - document_kind
  - document_number
  - issuer
  fields:
  - name: document_kind
    label: 身份证明类别
    type: Text
    cardinality:
      min: 1
      max: 1
    description: 官方核验或有效身份证明所载类别。
  - name: document_number
    label: 身份证明号码
    type: Text
    cardinality:
      min: 1
      max: 1
    description: 与签发法域共同用于识别个人的号码。
  - name: issuer
    label: 签发国家或地区
    type: Text
    cardinality:
      min: 1
      max: 1
    description: 身份证明签发国家或地区。
  - name: name
    label: 姓名
    type: Text
    cardinality:
      min: 1
      max: 1
    description: 自然人姓名；同名不能作为合并身份的依据。
  - name: gender
    label: 性别
    type: Text
    cardinality:
      min: 0
      max: 1
    description: 金融机构一般客户识别所需身份信息。
  - name: nationality
    label: 国籍/地区
    type: Text
    cardinality:
      min: 0
      max: 1
    description: 金融机构一般客户识别所需身份信息。
  - name: birth_date
    label: 出生日期
    type: Date
    cardinality:
      min: 0
      max: 1
    description: 金融机构一般客户识别所需身份信息。
  - name: document_expiry
    label: 证件有效期限
    type: Date
    cardinality:
      min: 0
      max: 1
    description: 所用身份证明的有效期限；过期不自动抹除历史身份。
  examples:
  - 甲以已核验证件身份持有目标公司的间接权益。
  counterexamples:
  - 仅以姓名字符串相同就合并的两名自然人。
  term_origin: KNOWLEDGE
  business_sentence: 某个自然人依据股权、最终收益/表决权、实际控制，或特定条件下的备位路径，被评估是否为组织客户的受益所有人。
  why_object: 权利证据可能指向不同候选人；只有身份核实后才能把权利事实绑定到一个现实自然人。
  identity_description: 优先按证件类别、号码与签发法域识别；同名、证件更新或多份证据之间的连续性需要独立核实。
- id: M.Evidence
  name: 识别证据
  kind: EVIDENCE
  description: 支持自然人身份、组织身份、权利关系或有效期间的可定位来源记录。
  basis_ids:
  - RULE.A01.KF.EQUITY
  - RULE.A01.KF.NOMINEE
  - RULE.A01.KF.IDENTITY
  identity:
  - source_reference
  - locator
  fields:
  - name: source_reference
    label: 来源记录标识
    type: Text
    cardinality:
      min: 1
      max: 1
    description: 来源文件、官方查询或客户原始材料的可回溯标识。
  - name: locator
    label: 材料位置
    type: Text
    cardinality:
      min: 1
      max: 1
    description: 页码、条款、登记记录或查询结果位置。
  - name: claim
    label: 支持的事实
    type: Text
    cardinality:
      min: 1
      max: 1
    description: 该材料实际支持的身份、权利、时间或风险事实，不超出来源内容。
  - name: source_authority
    label: 来源性质
    type: Enum
    cardinality:
      min: 0
      max: 1
    description: 来源类型不是可靠性结论。
    values:
    - OFFICIAL
    - CUSTOMER_ORIGINAL
    - PUBLIC_DISCLOSURE
    - INSTITUTION_OBSERVATION
    - THIRD_PARTY
    - UNKNOWN
  - name: verification_state
    label: 核实状态
    type: Enum
    cardinality:
      min: 0
      max: 1
    description: 记录材料核实结果；UNVERIFIED不得视作已证实。
    values:
    - VERIFIED
    - CORROBORATED
    - CONFLICTED
    - UNVERIFIED
    - UNAVAILABLE
  - name: issued_on
    label: 材料出具日
    type: Date
    cardinality:
      min: 0
      max: 1
    description: 来源材料被出具的日期，不自动视为权利生效日。
  - name: obtained_on
    label: 材料取得日
    type: Date
    cardinality:
      min: 0
      max: 1
    description: 金融机构取得该材料的日期。
  - name: verified_on
    label: 机构核实日
    type: Date
    cardinality:
      min: 0
      max: 1
    description: 机构完成该材料核实的日期；不替代权利形成日。
  - name: disclosed_on
    label: 对外披露日
    type: Date
    cardinality:
      min: 0
      max: 1
    description: 来源事实对外披露的日期；不替代法律关系生效日。
  - name: applicable_period
    label: 材料适用期间
    type: Text
    cardinality:
      min: 0
      max: 1
    description: 描述材料所支持事实的时点或期间；不得把材料日期直接替代权利生效日。
  examples:
  - 章程特定条款支持某人有权提名多数董事。
  counterexamples:
  - 第三方平台给出的比例标签直接作为已核实的最终权益。
  term_origin: PROPOSED
  business_sentence: 识别人员用可定位材料支持或质疑一个特定身份、权利事实及其有效期间。
  why_object: 增加第二份材料不会自动增加一个业务主体；证据需与它支持的事实和期间绑定。
  identity_description: 以来源标识与材料位置区分；同一材料的不同页、条款或查询快照分别定位，不以系统流水号替代来源事实。
- id: M.OwnershipLink
  name: 权益持有关系
  kind: FACT
  description: 某组织在特定期间向另一组织或自然人持有股权、股份或合伙权益的单条关系边。
  basis_ids:
  - TERM.A01.KF.03
  - TERM.A01.KF.04
  - RULE.A01.KF.EQUITY
  - RULE.A01.KF.NOMINEE
  identity:
  - target_organization
  - holder_kind
  - share_class
  - relationship_reference
  fields:
  - name: target_organization
    label: 被投资/持有权益的组织
    type: Ref
    cardinality:
      min: 1
      max: 1
    description: 路径中接受该段权益的组织。
    target: M.Organization
  - name: holder_kind
    label: 持有人类别
    type: Enum
    cardinality:
      min: 1
      max: 1
    description: 每条关系边只有一个持有人类别。
    values:
    - ORGANIZATION
    - NATURAL_PERSON
  - name: holder_organization
    label: 持有人组织
    type: Ref
    cardinality:
      min: 0
      max: 1
    description: 当 holder_kind 为 ORGANIZATION 时填写。
    target: M.Organization
  - name: holder_person
    label: 持有人自然人
    type: Ref
    cardinality:
      min: 0
      max: 1
    description: 当 holder_kind 为 NATURAL_PERSON 时填写。
    target: M.NaturalPerson
  - name: share_class
    label: 权益类别
    type: Text
    cardinality:
      min: 1
      max: 1
    description: 能够区分同一双方之间不同权益安排的业务类别。
  - name: relationship_reference
    label: 权益关系依据标识
    type: Text
    cardinality:
      min: 1
      max: 1
    description: 来源文件/登记权利关系中的稳定引用；无依据不构造事实边。
  - name: percentage
    label: 本段权益比例
    type: Decimal
    cardinality:
      min: 1
      max: 1
    description: 以百分比数值表示，例如25表示25%；缺失不得按零处理。
  - name: effective_from
    label: 本段关系精确生效日
    type: Date
    cardinality:
      min: 0
      max: 1
    description: 仅在可证实精确法律生效日时填写；登记或查询日期不能代替。
  - name: effective_from_precision
    label: 生效时点精度
    type: Enum
    cardinality:
      min: 1
      max: 1
    description: 按来源保留精度；非EXACT不得伪造具体日。
    values:
    - EXACT
    - MONTH
    - YEAR
    - INTERVAL
    - UNKNOWN
  - name: effective_from_period_note
    label: 生效期间说明
    type: Text
    cardinality:
      min: 0
      max: 1
    description: 仅知月份/年份/区间时记录对应来源描述。
  - name: effective_to
    label: 本段关系终止日
    type: Date
    cardinality:
      min: 0
      max: 1
    description: 有证据时记录终止日；未知或未终止与OPEN状态分别处理。
  - name: end_status
    label: 关系终止状态
    type: Enum
    cardinality:
      min: 1
      max: 1
    description: OPEN表示有依据确认仍持续；UNKNOWN表示无法判断是否终止。
    values:
    - OPEN
    - KNOWN
    - UNKNOWN
  - name: evidence
    label: 持有关系证据
    type: Ref
    cardinality:
      min: 1
      max: null
    description: 支持持有人、比例和期间的材料。
    target: M.Evidence
  examples:
  - 甲持有B公司30%，B公司持有客户A 80%，两条边分别留存。
  counterexamples:
  - 把B公司控制客户A解释成甲持有A公司100%权益。
  term_origin: PROPOSED
  business_sentence: 在某一时点，某个组织或自然人通过一条有效权益边持有另一个组织的一定股权或合伙权益。
  why_object: 直接与多层间接比例须按边计算并区分多条路径；把关系作为事实边可保留路径、期间和证据。
  identity_description: 同一目标、持有人、权益类别与生效区间构成关系身份；若身份字段或期间不明，不生成伪造的完整关系。
- id: M.EquityPath
  name: 权益穿透路径
  kind: FACT
  description: 从一个自然人经由有序权益关系边抵达目标组织的单条无环路径及其权益贡献。
  basis_ids:
  - RULE.A01.KF.EQUITY
  - RULE.A01.KF.DATES
  identity:
  - target_organization
  - person
  - as_of
  - path_key
  fields:
  - name: target_organization
    label: 目标组织
    type: Ref
    cardinality:
      min: 1
      max: 1
    description: 路径终点组织。
    target: M.Organization
  - name: person
    label: 最终自然人
    type: Ref
    cardinality:
      min: 1
      max: 1
    description: 路径起点自然人。
    target: M.NaturalPerson
  - name: as_of
    label: 路径判断时点
    type: Date
    cardinality:
      min: 1
      max: 1
    description: 所有路径边按同一时点筛选。
  - name: path_key
    label: 路径标识
    type: Text
    cardinality:
      min: 1
      max: 1
    description: 区分同一人到同一组织的不同关系路径。
  - name: steps
    label: 有序路径步骤
    type: Ref
    cardinality:
      min: 1
      max: null
    description: 按 step_order 排序，每步引用一条权益边。
    target: M.EquityPathStep
  - name: path_percentage
    label: 单路径权益贡献
    type: Decimal
    cardinality:
      min: 0
      max: 1
    description: 路径边逐段相乘后的比例贡献，例如30表示30%。
  - name: path_status
    label: 路径状态
    type: Enum
    cardinality:
      min: 1
      max: 1
    description: 不完整、循环或冲突路径不按零计入。
    values:
    - VALID
    - INCOMPLETE
    - CYCLICAL
    - CONFLICTED
    - UNKNOWN
  - name: evidence
    label: 路径核验证据
    type: Ref
    cardinality:
      min: 0
      max: null
    description: 支持路径中各边及期间的来源材料。
    target: M.Evidence
  examples:
  - 甲通过B再到目标组织的间接路径按两段比例相乘。
  counterexamples:
  - 把B控制目标组织解释为甲持有目标组织100%权益。
  term_origin: PROPOSED
  business_sentence: 识别人员逐条记录自然人到目标组织的权益路径及逐边相乘的单路径贡献。
  why_object: 显式保留有序边和路径贡献，避免把中间组织控制当作100%权益或丢失多路径依据。
  identity_description: 以目标组织、自然人、时点和有序边序列区分；关系变化产生新的时点路径。
- id: M.EquityPathStep
  name: 权益路径步骤
  kind: FACT
  description: 某权益关系边在一条穿透路径中的有序位置。
  basis_ids:
  - RULE.A01.KF.EQUITY
  identity:
  - path
  - step_order
  fields:
  - name: path
    label: 所属路径
    type: Ref
    cardinality:
      min: 1
      max: 1
    description: 对应的单条权益路径。
    target: M.EquityPath
  - name: ownership_link
    label: 权益关系边
    type: Ref
    cardinality:
      min: 1
      max: 1
    description: 该步骤采用的已核权益边。
    target: M.OwnershipLink
  - name: step_order
    label: 路径顺序
    type: Integer
    cardinality:
      min: 1
      max: 1
    description: 从自然人一侧到目标组织一侧的正整数顺序。
  examples:
  - 路径P的第2步引用B持有目标组织的权益边。
  counterexamples:
  - 把多条不同路径合并成无序边集合。
  term_origin: PROPOSED
  business_sentence: 一条权益边在某条具体路径中占据确定顺序位置。
  why_object: 同一关系边可被多条路径引用；序号支持逐边计算回放。
  identity_description: 以路径与路径内序号区分。
- id: M.OtherRight
  name: 收益或表决权安排
  kind: FACT
  description: 自然人最终享有的收益权或表决权关系，独立于股权边记录。
  basis_ids:
  - TERM.A01.KF.04
  - RULE.A01.KF.RETURNS_VOTES
  - RULE.A01.KF.NOMINEE
  identity:
  - target_organization
  - person
  - right_kind
  - arrangement_reference
  fields:
  - name: target_organization
    label: 目标组织
    type: Ref
    cardinality:
      min: 1
      max: 1
    description: 发生收益或表决权关系的组织。
    target: M.Organization
  - name: person
    label: 权利自然人
    type: Ref
    cardinality:
      min: 1
      max: 1
    description: 收益或表决权最终归属/行使的自然人。
    target: M.NaturalPerson
  - name: right_kind
    label: 权利类型
    type: Enum
    cardinality:
      min: 1
      max: 1
    description: 收益与表决是不同权利，不得混同。
    values:
    - ECONOMIC_BENEFIT
    - VOTING
  - name: arrangement_reference
    label: 权利安排依据标识
    type: Text
    cardinality:
      min: 1
      max: 1
    description: 协议、章程或权利来源中的稳定引用。
  - name: percentage
    label: 最终权利比例
    type: Decimal
    cardinality:
      min: 1
      max: 1
    description: 按最终权利计算的百分比，25含本数；缺失保持UNKNOWN。
  - name: effective_from
    label: 权利精确生效日
    type: Date
    cardinality:
      min: 0
      max: 1
    description: 仅在证据支持精确法律生效日时填写。
  - name: effective_from_precision
    label: 生效时点精度
    type: Enum
    cardinality:
      min: 1
      max: 1
    description: 按来源保留精度，不能自动补月首或年初。
    values:
    - EXACT
    - MONTH
    - YEAR
    - INTERVAL
    - UNKNOWN
  - name: effective_from_period_note
    label: 生效期间说明
    type: Text
    cardinality:
      min: 0
      max: 1
    description: 记录非精确生效期间及其来源。
  - name: effective_to
    label: 权利终止日
    type: Date
    cardinality:
      min: 0
      max: 1
    description: 有证据时填写，不能以材料更新时间替代。
  - name: end_status
    label: 权利终止状态
    type: Enum
    cardinality:
      min: 1
      max: 1
    description: 区分仍有效与终止状态未知。
    values:
    - OPEN
    - KNOWN
    - UNKNOWN
  - name: evidence
    label: 权利安排证据
    type: Ref
    cardinality:
      min: 1
      max: null
    description: 协议、章程、实际分配/投票记录及核验材料。
    target: M.Evidence
  examples:
  - 非股东甲依据生效协议享有目标组织25%的表决权。
  counterexamples:
  - 仅有一笔分红流水便断言甲最终收益权达到25%。
  term_origin: PROPOSED
  business_sentence: 某自然人在特定期间最终享有目标组织的收益权或表决权。
