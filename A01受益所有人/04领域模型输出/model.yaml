    binding: M.ProductAssessment.service_in_scope
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: risk
    label: 产品风险已充分评估
    binding: M.ProductAssessment.risk_assessment_complete
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: low
    label: 风险已充分评估为低
    binding: M.ProductAssessment.low_risk
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: people
    label: 实际管理自然人已具体识别
    binding: M.ProductAssessment.manager_people_identified
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: risk_block
    label: 存在加强识别触发情形
    binding: M.Identification.risk20_triggered
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: data_doubt
    label: 信息准确性或完整性存疑
    binding: M.Identification.data_doubt
    type: Boolean
    cardinality:
      min: 0
      max: 1
  result:
    type: Boolean
    cardinality:
      min: 0
      max: 1
  expression:
    op: and
    args:
    - op: and
      args:
      - input: manager
      - input: service
      - input: risk
      - input: people
      - op: or
        args:
        - op: and
          args:
          - input: public
          - input: registered
        - input: low
    - op: not
      args:
      - input: risk_block
    - op: not
      args:
      - input: data_doubt
  on_unknown: PROPAGATE
  basis_ids:
  - K.R.09.ASSET
  question_ids:
  - K.Q.09
  depends_on: []
  result_binding: M.ProductAssessment.simplify_allowed
