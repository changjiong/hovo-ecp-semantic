      source_text: 先依主体类型及日期确定是否有备案义务；另依客户组织形式与风险判机构识别义务。备案人填报与机构核实属于两个主体、两个目的，备案记录是可查询佐证但不是机构结论。公司法/国资交易的企业实际控制人不自动等于自然人受益所有人。
      model_refs:
      - M.SelectIdentificationRoute.criteria
      explanation: 阈值与确定性逻辑使用有限DSL表达；图路径、事实真实性、组织类别或实际控制仍按来源证据和人工准则判断。本规则的备案侧、备案专属字段或备案办理时限明确留在模型边界之外；只交接金融机构客户识别侧。
      status: MANUAL
    result:
      source_text: 分别形成备案主体的申报义务判断及金融机构对客户受益所有人的独立识别、风险使用结论。
      model_refs:
      - M.IdentificationConclusion
      - M.IdentificationRouteAssessment
      explanation: 结果落在具体自然人—目标组织—识别依据—期间的关系及结论记录中；候选和正式确认不混为一谈。本规则的备案侧、备案专属字段或备案办理时限明确留在模型边界之外；只交接金融机构客户识别侧。
      status: FORMALIZED
    exceptions:
      source_text: 只有备案姓名、公司法控股标签或当地系统页面时，不可推定金融机构已完成独立识别。
      model_refs:
      - M.IdentificationRouteAssessment.route
      - M.SelectIdentificationRoute.criteria
      explanation: 不将例外扩大到相似名称/身份；循环、缺边、证据冲突或风险禁用条件按来源保持UNKNOWN/阻断。本规则的备案侧、备案专属字段或备案办理时限明确留在模型边界之外；只交接金融机构客户识别侧。
      status: MANUAL
    missing_evidence:
      source_text: 本次业务日期、客户法定形态、登记主体与总分关系、机构自行收集的结构和可靠佐证。
      model_refs:
      - M.IdentificationRouteAssessment.evidence
      explanation: 缺证明确指向受影响的人、权利或适用路线，并进入结论中的未决事项；不以空值补成否。本规则的备案侧、备案专属字段或备案办理时限明确留在模型边界之外；只交接金融机构客户识别侧。
      status: FORMALIZED
    effective_period:
      source_text: 备案办法2024-11-01、金融机构办法2026-01-20；旧235/164通知自后者施行时废止，历史按当时制度还原。
      model_refs:
      - M.IdentificationRouteAssessment.as_of
      explanation: 权利和控制关系均保留有证据的生效/终止期间；身份核实日、资料日期和权利生效日不互相替代。本规则的备案侧、备案专属字段或备案办理时限明确留在模型边界之外；只交接金融机构客户识别侧。
      status: FORMALIZED
