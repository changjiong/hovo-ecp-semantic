  nature: BUSINESS_DISCRETION
  criteria:
  - 逐人核实单独或联合对人事、重大经营、财务或重要资产的最终决定能力。
  - 第一大股东、法代、亲属、一次签字和公开实控标签仅为线索；证据冲突时UNKNOWN。
  record_fields:
