state_machines: []
judgments:
- id: J.RightAttribution
  name: 名义与真实权利归属
  description: 裁定协议与履行证据能否证明本段真实权利人；证据不足时权利归属UNKNOWN。
  inputs:
  - name: right
    label: 登记与主张的权利
    binding: T.Right
    type: Ref
    target: T.Right
  - name: arrangement
    label: 代持或委托安排
    binding: T.Arrangement
    type: Ref
    target: T.Arrangement
  - name: evidence
    label: 协议及履行证据
    binding: T.Evidence
    type: Ref
    target: T.Evidence
  outputs:
  - name: holder
