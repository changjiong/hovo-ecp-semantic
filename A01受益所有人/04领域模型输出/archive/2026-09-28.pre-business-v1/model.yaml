  reason: 有效股权或合伙权益边、持有人和目标主体构成稳定结构；互异路径连乘汇总及含本数25%是可复用判断，未证路径保留未知。 非充分事实：第三方图谱展示单一持股比例，不能证明完整自然人路径或生效时点。；自然人控制一家公司，不等于持有该公司100%权益；中间节点持股70%不能直接当自然人70%。
