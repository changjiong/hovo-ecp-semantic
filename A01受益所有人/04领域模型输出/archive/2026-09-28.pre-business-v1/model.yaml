  reason: 名义登记人与最终拥有、收益、表决和控制人可分离；协议安排、权利范围和效力证据决定归属，不能以亲属或登记线索直接认定。 非充分事实：单纯同姓或母子、亲戚关系不证明代持；登记名义70%也不能证明最终拥有70%。；只知有分红转账而不知该权利由何份额产生，不能推最终收益权比例。
