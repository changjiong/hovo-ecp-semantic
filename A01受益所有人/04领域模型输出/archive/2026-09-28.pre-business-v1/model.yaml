types:
- id: T.Party
  name: 业务当事人
  kind: ENTITY
  description: 自然人、组织、分支、信托或产品的同一业务身份；只有自然人可成为最终受益所有人。
  basis_ids:
  - TERM.A01.KF.02
  - RULE.A01.KF.EQUITY
  - RULE.A01.KF.TRUST
  identity:
  - id
  fields:
  - name: id
    label: 业务实例标识
    type: Text
    cardinality:
      min: 1
      max: 1
    description: 同一现实对象或事实的稳定区分键，不代表缺证时可编造身份。
  - name: name
    label: 名称或姓名
    type: Text
    cardinality:
      min: 1
      max: 1
    description: 经可靠资料核对的当事人名称；同名不证明同一人。
  - name: kind
    label: 当事人性质
    type: Enum
    cardinality:
      min: 1
      max: 1
    description: 区分自然人和各类非自然人主体。
    values:
    - NATURAL_PERSON
    - ORGANIZATION
    - BRANCH
    - TRUST
    - PRODUCT
    - OTHER
  - name: legal_form
    label: 登记组织形态
    type: Enum
    cardinality:
      min: 0
      max: 1
    description: 仅保留识别路径所需的登记形态，不复制工商登记域。
    values:
    - COMPANY
    - PARTNERSHIP
    - FOREIGN_BRANCH
    - DOMESTIC_BRANCH
    - INDIVIDUAL_BUSINESS
    - OTHER
    - UNKNOWN
  - name: parent
    label: 所属主体
    type: Ref
    cardinality:
      min: 0
      max: 1
    description: 分支所属主体须按判断时点和有效证据核实。
    target: T.Party
  - name: state_controlled
    label: 国有独资或控股已证实
    type: Boolean
    cardinality:
      min: 0
      max: 1
    description: 必须由产权、控制权和适用口径支持；国有参股不等于控股。
  - name: registered_on
    label: 设立登记日期
    type: Date
    cardinality:
      min: 0
      max: 1
    description: 仅用于判断适用时点；不替代权利形成日期。
  examples:
  - 持有目标公司权益的自然人甲与目标公司分别记录。
  counterexamples:
  - 不能把国资监管语境中的实际控制企业直接记为自然人受益所有人。
  term_origin: PROPOSED
  business_sentence: 自然人和组织分别以自身身份参加权益、控制或信托关系。
  why_object: 各关系均需指向同一当事人；登记企业控制标签不能替代自然人身份。
  identity_description: 以原始资料中的对象与权利关系分别核对；标识只用于区分已存在的业务实例。
- id: T.Right
  name: 逐段权利关系
  kind: FACT
  description: 当事人与直接相连主体之间的一段股权、收益权或表决权，逐段记录比例、来源和有效时间；最终自然人比例另由完整路径汇总。
  basis_ids:
  - TERM.A01.KF.03
  - TERM.A01.KF.04
  - RULE.A01.KF.EQUITY
  - RULE.A01.KF.DATES
  identity:
  - id
  fields:
  - name: id
    label: 业务实例标识
    type: Text
    cardinality:
      min: 1
      max: 1
    description: 同一现实对象或事实的稳定区分键，不代表缺证时可编造身份。
  - name: holder
    label: 本段实际权利人
    type: Ref
    cardinality:
      min: 0
      max: 1
    description: 可为自然人或中间组织；归属证据不足时保持未知，不能默认登记人。
    target: T.Party
  - name: subject
    label: 本段权利所及主体
    type: Ref
    cardinality:
      min: 1
      max: 1
    description: 该段权利直接对应的组织、信托或产品。
    target: T.Party
  - name: kind
    label: 权利类别
    type: Enum
    cardinality:
      min: 1
      max: 1
    description: 股权、收益与表决分别判断。
    values:
    - EQUITY
    - BENEFIT
    - VOTE
  - name: percent
    label: 本段有效比例
    type: Decimal
    cardinality:
      min: 0
      max: 1
    description: 逐段由原始材料核实；最终比例由同日完整路径连乘、去重和汇总，未知段不得按零。
  - name: nominal_holder
    label: 名义登记人
    type: Ref
    cardinality:
      min: 0
      max: 1
    description: 与最终权利人分开核证。
    target: T.Party
  - name: arrangement
    label: 影响归属的安排
    type: Ref
    cardinality:
      min: 0
      max: 1
    description: 代持、委托等可改变表面归属。
    target: T.Arrangement
  - name: effective_start
    label: 法律关系生效日
    type: Date
    cardinality:
      min: 0
      max: 1
    description: 只有精确日期有证据时填写；不能以登记、核实或报送日代填。
  - name: formation_bounds
    label: 形成时间已知区间
    type: IntervalSet
    cardinality:
      min: 0
      max: 1
    description: 精确日未知时保留已证实上下界及精度。
  - name: effective_end
    label: 法律关系终止日
    type: Date
    cardinality:
      min: 0
      max: 1
    description: 若已知终止且有证据则填写。
  - name: effective_end_bounds
    label: 终止时间已知区间
    type: IntervalSet
    cardinality:
      min: 0
      max: 1
    description: 仅知终止月份或区间时保留上下界、精度与证据，不补造某日。
  - name: end_status
    label: 终止情况
    type: Enum
    cardinality:
      min: 0
      max: 1
    description: 未终止已证实与终止未知不能混同。
    values:
    - OPEN
    - KNOWN
    - UNKNOWN
  - name: evidence
    label: 权利证据
    type: Ref
    cardinality:
      min: 0
      max: null
    description: 逐条绑定各边比例、协议及生效材料。
    target: T.Evidence
  examples:
  - 甲持有中间公司20%，中间公司持有目标公司60%；两段分别记录，再计算甲对目标公司的12%。
  counterexamples:
  - 不能把中间公司60%持股直接全部归给甲，或把最终12%回填成任一段比例。
  term_origin: PROPOSED
  business_sentence: 某当事人在特定期间对直接相连主体享有一段可核实的权益、收益或表决权。
  why_object: 完整路径由逐段关系连接；名义登记、实际权利及各段有效期间不能混为一条最终比例。
  identity_description: 以原始资料中的对象与权利关系分别核对；标识只用于区分已存在的业务实例。
- id: T.Arrangement
  name: 权利与控制安排
  kind: FACT
  description: 代持、投票委托、一致行动或信托权力等可能改变最终权利和实际控制的有效安排。
  basis_ids:
  - TERM.A01.KF.04
  - TERM.A01.KF.05
  - RULE.A01.KF.NOMINEE
  - RULE.A01.KF.CONTROL
  - RULE.A01.KF.TRUST
  identity:
  - id
  fields:
  - name: id
    label: 业务实例标识
    type: Text
    cardinality:
      min: 1
      max: 1
    description: 同一现实对象或事实的稳定区分键，不代表缺证时可编造身份。
  - name: actor
    label: 权能行使人
    type: Ref
    cardinality:
      min: 0
      max: 1
    description: 联合控制时各自然人的具体作用须另核。
    target: T.Party
  - name: subject
    label: 受影响主体
    type: Ref
    cardinality:
      min: 1
      max: 1
    description: 安排的目标组织或信托。
    target: T.Party
  - name: kind
    label: 安排类别
    type: Enum
    cardinality:
      min: 1
      max: 1
    description: 不把不同法律效力的安排合并。
    values:
    - NOMINEE
    - VOTE_PROXY
    - JOINT_ACTION
    - CONTROL
    - TRUST_POWER
    - OTHER
  - name: power
    label: 实际权限
    type: Enum
    cardinality:
      min: 0
      max: null
    description: 人事、经营、财务、资产及信托处分或指定权分别核实。
    values:
    - APPOINTMENT
    - MANAGEMENT
    - FINANCE
    - ASSET
    - DISTRIBUTION
    - TRUST_CHANGE
    - OTHER
  - name: effective_start
    label: 安排生效日
    type: Date
    cardinality:
      min: 0
      max: 1
    description: 缺生效证据时保持未知。
  - name: formation_bounds
    label: 安排形成区间
    type: IntervalSet
    cardinality:
      min: 0
      max: 1
    description: 仅能确定期间时保留范围。
  - name: effective_end
    label: 安排终止日
    type: Date
    cardinality:
      min: 0
      max: 1
    description: 不可把过期委托计入判断日。
  - name: effective_end_bounds
    label: 安排终止已知区间
    type: IntervalSet
    cardinality:
      min: 0
      max: 1
    description: 终止日不精确时保留可信范围和精度。
  - name: end_status
    label: 终止情况
    type: Enum
    cardinality:
      min: 0
      max: 1
    description: OPEN须有持续有效依据；UNKNOWN不是OPEN。
    values:
    - OPEN
    - KNOWN
    - UNKNOWN
  - name: evidence
    label: 安排证据
    type: Ref
    cardinality:
      min: 0
      max: null
    description: 协议原件与实际行使记录需要相互核对。
    target: T.Evidence
  examples:
  - 生效协议赋予甲任免多数董事并决定年度预算的能力。
  counterexamples:
  - 一次付款签字或亲属关系本身不是实际控制安排。
  term_origin: PROPOSED
  business_sentence: 某项有效安排赋予特定当事人对目标的权利或决定能力。
  why_object: 表面持股不能表示协议控制、联合决定和信托处分或指定权。
  identity_description: 以原始资料中的对象与权利关系分别核对；标识只用于区分已存在的业务实例。
- id: T.Role
  name: 业务角色
  kind: ROLE
  description: 自然人或组织在特定主体和期间担任法定代表人、实际日常管理人、信托当事人等角色。
  basis_ids:
  - TERM.A01.KF.06
  - TERM.A01.KF.07
  - TERM.A01.KF.08
  - RULE.A01.KF.BRANCHES
  identity:
  - id
  fields:
  - name: id
    label: 业务实例标识
    type: Text
    cardinality:
      min: 1
      max: 1
    description: 同一现实对象或事实的稳定区分键，不代表缺证时可编造身份。
  - name: bearer
    label: 角色承担者
    type: Ref
    cardinality:
      min: 1
      max: 1
    description: 角色承担者身份需独立核实。
    target: T.Party
  - name: subject
    label: 角色所在主体
    type: Ref
    cardinality:
      min: 1
      max: 1
    description: 所任职组织、分支、信托或产品。
    target: T.Party
  - name: kind
    label: 角色类别
    type: Enum
    cardinality:
      min: 1
      max: 1
    description: 特定路径的人选资格依角色与有效期间判断。
    values:
    - LEGAL_REP
    - DAILY_MANAGER
    - BRANCH_SENIOR
    - TRUST_SETTLOR
    - TRUST_TRUSTEE
    - TRUST_BENEFICIARY
    - TRUST_SUPERVISOR
    - PRODUCT_MANAGER
    - OTHER
  - name: effective_start
    label: 任职或角色生效日
    type: Date
    cardinality:
      min: 0
      max: 1
    description: 按任命或信托文件的法律效力核对。
  - name: formation_bounds
    label: 角色形成区间
    type: IntervalSet
    cardinality:
      min: 0
      max: 1
    description: 精确日期缺证时保留范围。
  - name: effective_end
    label: 角色终止日
    type: Date
    cardinality:
      min: 0
      max: 1
    description: 角色终止不自动推出其他权利终止。
  - name: effective_end_bounds
    label: 角色终止已知区间
    type: IntervalSet
    cardinality:
      min: 0
      max: 1
    description: 终止日只知月份或范围时不补造精确日。
  - name: end_status
    label: 角色终止情况
    type: Enum
    cardinality:
      min: 0
      max: 1
    description: 已证实仍在任、已终止与未知分开。
    values:
    - OPEN
    - KNOWN
    - UNKNOWN
  - name: evidence
    label: 角色证据
    type: Ref
    cardinality:
      min: 0
      max: null
    description: 官方登记、任命、信托文件及实际职责记录。
    target: T.Evidence
  examples:
  - 甲经任命并实际负责公司日常经营。
  counterexamples:
  - 登记法定代表人头衔不能证明甲具有最终控制权。
  term_origin: PROPOSED
  business_sentence: 一个当事人在特定期间对另一主体承担可核实的业务角色。
  why_object: 角色与权利不同；任职名称不能自动证明最终拥有或控制。
  identity_description: 以原始资料中的对象与权利关系分别核对；标识只用于区分已存在的业务实例。
  bearer_field: bearer
- id: T.BeneficiaryScope
  name: 信托受益范围
  kind: FACT
  description: 信托受益人尚未具体确定时的可核实范围及后来指定事实，与已确认自然人分开。
  basis_ids:
  - TERM.A01.KF.08
  - RULE.A01.KF.TRUST
  identity:
  - id
  fields:
  - name: id
    label: 业务实例标识
    type: Text
    cardinality:
      min: 1
      max: 1
    description: 同一现实对象或事实的稳定区分键，不代表缺证时可编造身份。
  - name: trust
    label: 所属信托
    type: Ref
    cardinality:
      min: 1
      max: 1
    description: 对应的具体信托。
    target: T.Party
  - name: description
    label: 潜在受益范围
    type: Text
    cardinality:
      min: 1
      max: 1
    description: 按信托文件原义保留类别或指定范围。
  - name: designated_person
    label: 已指定自然人
    type: Ref
    cardinality:
      min: 0
      max: 1
    description: 只有指定已生效且身份获证才填写。
    target: T.Party
  - name: designation_status
    label: 指定情况
    type: Enum
    cardinality:
      min: 1
      max: 1
    description: 潜在、已指定与未知分开。
    values:
    - POTENTIAL
    - CONFIRMED
    - UNKNOWN
  - name: effective_on
    label: 指定生效日
    type: Date
    cardinality:
      min: 0
      max: 1
    description: 不以信托设立日替代后续指定生效日。
  - name: evidence
    label: 信托证据
    type: Ref
    cardinality:
      min: 0
      max: null
    description: 信托文件、指定文件和有效时间资料。
    target: T.Evidence
  examples:
  - 信托文件写明未来从家庭成员中指定受益人。
  counterexamples:
  - 不能在正式指定前把全部家庭成员列为确定受益人。
  term_origin: PROPOSED
  business_sentence: 信托可以先存在一个潜在受益范围，随后才有效指定具体自然人。
  why_object: 未指定范围必须可记录，但不能据此编造每名潜在成员的已确认身份。
  identity_description: 以原始资料中的对象与权利关系分别核对；标识只用于区分已存在的业务实例。
- id: T.Evidence
  name: 权利与身份依据
  kind: EVIDENCE
  description: 支持当事人身份、权利归属、角色、期间或判断的可追溯来源及其核实状态。
  basis_ids:
  - TERM.A01.KF.10
  - TERM.A01.KF.13
  - RULE.A01.KF.IDENTITY
  identity:
  - id
  fields:
  - name: id
    label: 业务实例标识
    type: Text
    cardinality:
      min: 1
      max: 1
    description: 同一现实对象或事实的稳定区分键，不代表缺证时可编造身份。
  - name: source
    label: 来源
    type: Text
    cardinality:
      min: 1
      max: 1
    description: 可定位的文件或机构来源。
  - name: kind
    label: 来源类别
    type: Enum
    cardinality:
      min: 1
      max: 1
    description: 区分原件、官方、客户、机构与外部观察。
    values:
    - OFFICIAL
    - ORIGINAL_DOCUMENT
    - CLIENT
    - INSTITUTION
    - BOMIS
    - THIRD_PARTY
  - name: issued_on
    label: 资料形成日
    type: Date
    cardinality:
      min: 0
      max: 1
    description: 资料形成日不等于权利生效日。
  - name: verified_on
    label: 核实日
    type: Date
    cardinality:
      min: 0
      max: 1
    description: 核实行为发生的时间。
  - name: reliability
    label: 可信及冲突状态
    type: Enum
    cardinality:
      min: 0
      max: 1
    description: 由有权人员依来源与交叉印证判断。
    values:
    - VERIFIED
    - UNVERIFIED
    - CONFLICTED
    - UNKNOWN
  - name: claim
