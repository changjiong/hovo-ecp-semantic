temporal: []
rules:
- id: R.NaturalPerson
  name: 自然人身份门槛
  description: 受益所有人结果须指向已核实的自然人。
  inputs:
  - name: person_kind
    label: 候选人的身份性质
    binding: T.Party.kind
    type: Enum
    cardinality:
      min: 1
      max: 1
    values:
    - NATURAL_PERSON
    - ORGANIZATION
    - BRANCH
    - TRUST
    - PRODUCT
    - OTHER
  result:
    label: 判断结果
    binding: T.PersonAssessment.is_natural
    type: Boolean
    cardinality:
      min: 0
      max: 1
  expression:
    op: eq
    args:
    - input: person_kind
    - literal:
        type: Text
        value: NATURAL_PERSON
  on_unknown: PROPAGATE
  basis_ids:
  - TERM.A01.KF.02
  - RULE.A01.KF.IDENTITY
  question_ids:
  - Q.A01.S13
  - Q.A01.S27
  depends_on: []
  result_binding: T.PersonAssessment.is_natural
  business_meaning: 输入是可靠身份资料对应的当事人性质；组织标签不能形成自然人结论。身份未核实则UNKNOWN；同名、系统标签不充分，身份文件冲突由有权人员复核。
- id: R.Equity25
  name: 最终权益达到25%
  description: 对同一自然人、同一目标、同一有效时点，判断完整权益路径合计是否达到含本数25%。
  inputs:
  - name: equity_percent
    label: 已核实最终权益比例
    binding: T.PersonAssessment.equity_percent
    type: Decimal
    cardinality:
      min: 0
      max: 1
  result:
    label: 判断结果
    binding: T.PersonAssessment.equity_met
    type: Boolean
    cardinality:
      min: 0
      max: 1
  expression:
    op: gte
    args:
    - input: equity_percent
    - literal:
        type: Decimal
        value: 25
  on_unknown: PROPAGATE
  basis_ids:
  - RULE.A01.KF.EQUITY
  question_ids:
  - Q.A01.S13
  - Q.A01.S14
  depends_on: []
  result_binding: T.PersonAssessment.equity_met
  business_meaning: 比例输入须由有效边逐段连乘、互异路径去重并汇总，证据为逐层名册、协议与生效文件。任一路径关键事实未知时受影响合计UNKNOWN，第三方单一比例不充分；路径争议由有权人员裁定。
- id: R.BenefitVote25
  name: 收益或表决达到25%
  description: 只对未符合权益标准一的同一自然人判断有效收益权或表决权是否达到含本数25%。
  inputs:
  - name: equity_met
    label: 权益标准一是否成立
    binding: T.PersonAssessment.equity_met
    type: Boolean
    cardinality:
      min: 0
      max: 1
  - name: benefit_percent
    label: 最终收益比例
    binding: T.PersonAssessment.benefit_percent
    type: Decimal
    cardinality:
      min: 0
      max: 1
  - name: vote_percent
    label: 最终表决比例
