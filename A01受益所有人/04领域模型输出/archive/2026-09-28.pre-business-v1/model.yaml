  criteria:
  - 逐项分开权益所有、收益、表决和控制，不以登记名义或亲属关系单独确定最终归属。
  - 协议真实性、效力期间及实际履行有冲突时保持未知并取得独立佐证。
  record_fields:
  - T.Right.holder
  - T.Right.percent
  - T.Right.effective_start
  review_requirements: 责任边界：金融机构有权尽调人员；逐项记录采用与排除的材料、适用时点、冲突、非充分线索及UNKNOWN原因；具体岗位由机构正式制度确定。
- id: J.ActualControl
  name: 自然人实际控制
  description: 依据具体权限和持续行使事实判断最终决定能力；职务或单次经办不是充分事实。
  inputs:
  - name: arrangement
    label: 控制权安排
    binding: T.Arrangement
    type: Ref
    target: T.Arrangement
  - name: role
    label: 任职角色
    binding: T.Role
    type: Ref
    target: T.Role
  - name: evidence
    label: 权限与行使证据
    binding: T.Evidence
    type: Ref
    target: T.Evidence
  outputs:
  - name: control
    label: 实际控制结论
    binding: T.PersonAssessment.actual_control
    type: Boolean
    cardinality:
      min: 0
      max: 1
  responsible_role: T.Role
  required_evidence:
