  kind: MODEL_GAP
  statement: 上游未决：第三方TXT048声称同年跨月、相差30自然日内可以不算重大；12号令第二十八条明确形成年月或终止年月不一致为重大。现有来源不支持该第三方豁免；不能视为规范冲突，也不能让其覆盖规范。
