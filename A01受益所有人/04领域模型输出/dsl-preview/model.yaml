rules:
- id: M.CurrentFormation
  name: 当前形成日期
  description: 取最近一次包含核对时点的连续达标区间起点；完整历史与连续性未核实返回未知。
  inputs:
  - name: intervals
    type: IntervalSet
  - name: as_of
    type: Date
  - name: history_complete
    type: Boolean
  - name: continuity_verified
    type: Boolean
  result:
    type: Date
  expression:
    op: current_interval_start
    args:
    - input: intervals
    - input: as_of
    - input: history_complete
    - input: continuity_verified
  on_unknown: PROPAGATE
  basis_ids:
  - K.R.11.HISTORY
- id: M.CanResolve
  name: 是否具备闭环条件
  description: 实际更正与系统复核一致须同时成立；布尔事实必须有外部证据支持。
  inputs:
  - name: corrected
    type: Boolean
  - name: consistent
    type: Boolean
  result:
    type: Boolean
  expression:
    op: and
    args:
    - input: corrected
    - input: consistent
  on_unknown: PROPAGATE
  basis_ids:
  - K.R.19.CLOSE
state_machines:
- id: M.DifferenceFlow
  type_id: M.Difference
  state_field: state
  initial: PENDING
  transitions:
  - id: M.Resolve
    event: RECHECK
    from:
    - PENDING
    to: RESOLVED
    guard:
      op: and
      args:
      - field:
          of:
            input: self
          name: corrected
      - field:
          of:
            input: self
          name: consistent
    on_unknown: BLOCK
    basis_ids:
    - K.R.19.CLOSE
  basis_ids:
  - K.R.19.CLOSE
