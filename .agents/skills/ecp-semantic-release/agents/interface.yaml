name: ecp-semantic-release
version: "0.2.0"
interface:
  display_name: "ECP 语义资产发布"
  short_description: "核对版本闭包，按授权发布并取得回读与运行证据。"
  default_prompt: "使用 $ecp-semantic-release，先检查固定版本资产的依赖和摘要，完成本次授权范围的打包或平台交付，分别报告编译、发布、运行与业务验收证据。"
compatibility:
  adapter_targets: [openai, claude, generic, agent-skills-compatible]
  canonical_format: "Agent Skills Markdown with JSON Schema"
  dependencies: "本目录固定版本资料与 requirements.txt；无其他技能依赖"
  host_installation: "NOT_EXECUTED"
  context_isolation: "宿主能力需独立验证，说明文件不提供沙箱"
  permissions: "按当前任务授权；技能创建不授权数据访问、发布或运行"
