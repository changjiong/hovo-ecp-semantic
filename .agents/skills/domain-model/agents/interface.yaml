name: domain-model
version: "0.7.0"
interface:
  display_name: "领域模型 DSL"
  short_description: "固定知识版本，建立可校验的领域模型 DSL 并生成审阅材料。"
  default_prompt: "使用 $domain-model，把指定版本领域知识写成 model.yaml，默认全量承接问题、规则七要素和案例，使用业务语言并保留缺口，生成业务审阅材料。"
compatibility:
  adapter_targets: [openai, claude, generic, agent-skills-compatible]
  canonical_format: "Agent Skills Markdown, YAML DSL and JSON Schema"
  dependencies: "随包知识 4.0.0 快照及 Python requirements.txt；无其他技能运行依赖"
  host_installation: "NOT_EXECUTED"
  context_isolation: "宿主能力另行核验；说明文件不提供沙箱"
  permissions: "限本地建模与示例求值；不代表业务批准或平台执行"
