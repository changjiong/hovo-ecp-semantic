model_version: 1.0.0
artifact_id: Example.Order
content_version: 1.0.0
name: 订单履约业务领域模型（合成）
domain_name: 商户订单履约
domain_purpose: 表达订单、商户关系以及基于支付和配送事实形成的可履约判断。
knowledge_ref:
  artifact_id: Synthetic.OrderKnowledge
  content_version: 0.0.0
  contract_version: 5.0.0
  path: .agents/skills/domain-model/examples/order/synthetic-knowledge.json
  digest: sha256:cdbdeaae36eed54ec7208bf2324b2cc411d537fb40fa37beed07de35469bf0f5
knowledge_basis: DRAFT
scope_mode: FULL_BASELINE
question_scope_ids:
- K.Q.ORDER
business_objects:
- id: Order.Merchant
  name: 商户
  category: PARTICIPANT
  definition: 接收并履行订单的业务主体。
  identity_description: 以商户编号区分不同商户。
  identity_attributes:
  - merchant_code
  attributes:
  - name: merchant_code
    label: 商户编号
    type: Text
    cardinality: {min: 1, max: 1}
    meaning: 商户范围内稳定识别商户。
  examples:
  - 商户甲负责订单A2026001的履约。
  counterexamples:
  - 配送服务商不是本模型中的订单商户。
- id: Order.Order
  name: 订单
  category: BUSINESS_OBJECT
  definition: 商户收到并需要判断是否可以履约的客户订单。
  identity_description: 以商户编号和商户订单号共同识别同一订单。
  identity_attributes:
  - merchant_code
  - order_number
  attributes:
  - name: merchant_code
    label: 商户编号
    type: Text
    cardinality: {min: 1, max: 1}
    meaning: 限定订单号所属商户。
  - name: order_number
    label: 商户订单号
    type: Text
    cardinality: {min: 1, max: 1}
    meaning: 商户范围内识别订单。
  - name: paid
    label: 支付已确认
    type: Boolean
    cardinality: {min: 0, max: 1}
    meaning: 是否已经取得可靠的支付确认。
  - name: deliverable
    label: 配送可用
    type: Boolean
    cardinality: {min: 0, max: 1}
    meaning: 当前订单是否具备可配送条件。
  examples:
  - 商户甲的订单A2026001已经确认支付且可配送。
  counterexamples:
  - 支付回执是订单证据，不是另一张订单。
business_relations:
- id: Order.PlacedWith
  name: 订单归属商户
  definition: 一张订单属于一个负责履约的商户。
  participants:
  - role: order
    label: 订单
    object_id: Order.Order
    cardinality: {min: 1, max: 1}
    meaning: 需要履约判断的订单。
  - role: merchant
    label: 商户
    object_id: Order.Merchant
    cardinality: {min: 1, max: 1}
    meaning: 对该订单承担履约责任的商户。
  attributes: []
  temporal_semantics: 订单存续期间该归属关系有效；订单转移不在本合成示例范围。
  evidence_semantics: 商户订单记录支持归属关系。
  examples:
  - A2026001属于商户甲。
  counterexamples:
  - 仅有同号订单不能跨商户认定为同一订单。
business_decisions:
- id: Order.CanFulfill
  name: 订单可履约判断
  business_question: 什么时候允许订单履约？
  definition: 根据订单支付确认和配送可用事实判断当前是否允许履约。
  decision_mode: DETERMINISTIC
  inputs:
  - ref: Order.Order.paid
    meaning: 支付已经可靠确认。
  - ref: Order.Order.deliverable
    meaning: 当前具备配送条件。
  outcomes:
  - value: CAN_FULFILL
    label: 可以履约
    meaning: 支付已确认且配送可用。
  - value: CANNOT_FULFILL
    label: 不可履约
    meaning: 任一必要条件已明确不成立。
  - value: UNKNOWN
    label: 暂不能判断
    meaning: 任一必要事实缺失或未知。
  criteria:
  - 支付已确认且配送可用时，可以履约。
  - 任一必要条件明确不成立时，不可履约。
  non_sufficient_facts:
  - 只有支付截图但未完成可靠核实，不能单独证明支付已确认。
  unknown_behavior: 支付或配送任一事实未知时，结果保持 UNKNOWN，不默认允许履约。
  evidence_requirements:
  - 可靠支付确认
  - 当前配送可用事实
  human_boundary: 本合成示例不包含固有人工裁定；事实真实性仍由上游业务来源负责。
  result_semantics: 判断结果直接说明当前订单是否允许履约；UNKNOWN 表示不能进入正式履约结论。
  external_context_ids: []
external_contexts: []
