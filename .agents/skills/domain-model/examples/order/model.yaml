    cardinality:
      min: 1
      max: 1
    description: 商户订单号用于商户范围内识别订单。
  - name: merchant_code
    label: 商户编号
    type: Text
    cardinality:
      min: 1
      max: 1
    description: 商户编号用于商户范围内识别订单。
  - name: state
    label: 订单状态
    type: Enum
    cardinality:
      min: 1
      max: 1
    description: 订单状态
    values:
    - OPEN
    - FULFILLED
    value_labels:
      OPEN: 待履约
      FULFILLED: 已履约
  - name: paid
    label: 支付已确认
    type: Boolean
    cardinality:
      min: 0
      max: 1
    description: 支付已确认
  - name: deliverable
    label: 配送可用
    type: Boolean
    cardinality:
      min: 0
      max: 1
    description: 配送可用
  - name: can_fulfill
    label: 是否可履约
    type: Boolean
    cardinality:
      min: 0
      max: 1
    description: 支付和配送条件都具备时允许履约；资料不全时保留未知。
  basis_ids:
  - K.SYNTHETIC.ORDER
  examples:
  - 商户甲的订单A2026001已确认支付，收货地址位于可配送范围。
  counterexamples:
  - 支付回执只是订单的证据，不是另一份订单。
  term_origin: KNOWLEDGE
  business_sentence: 商户收到买家的订单，确认收款且具备配送条件后才允许履约。
  why_object: 订单具有独立订单号、履约条件和状态，需要跨支付与配送阶段持续跟踪。
  identity_description: 以商户范围内发放的订单号识别同一订单；重复收到回执不创建新订单。
temporal: []
rules:
- id: M.CanFulfill
  name: 是否可履约
  description: 纯合成规则，用来展示三值布尔表达式。
  inputs:
  - name: paid
    type: Boolean
    binding: M.Order.paid
    label: 支付已确认
  - name: deliverable
    type: Boolean
    binding: M.Order.deliverable
    label: 配送可用
  result:
    type: Boolean
  expression:
    op: and
    args:
    - input: paid
    - input: deliverable
  on_unknown: PROPAGATE
  basis_ids:
  - K.SYNTHETIC.ORDER
  question_ids:
  - K.Q.ORDER
  depends_on: []
  result_binding: M.Order.can_fulfill
  business_meaning: 支付已确认且配送可用，才允许履约；任一条件未知时不默认允许。
state_machines:
- id: M.OrderFlow
  type_id: M.Order
  state_field: state
  initial: OPEN
  transitions:
  - id: M.Fulfill
    event: FULFILL
    from:
    - OPEN
    to: FULFILLED
    guard:
      op: and
      args:
      - field:
          of:
            input: self
          name: paid
      - field:
          of:
            input: self
          name: deliverable
    on_unknown: BLOCK
    basis_ids:
    - K.SYNTHETIC.ORDER
    name: 完成履约
  basis_ids:
  - K.SYNTHETIC.ORDER
  name: 订单履约状态
judgments: []
